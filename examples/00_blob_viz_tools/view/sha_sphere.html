<script>const EV = {};
// ---- toolbox/core/clock.js ----
// orior - Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>
// SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational
//
// When the next turn of a frame loop runs. With vsync, once per display refresh. Without it, as soon as the turn
// before has left the main thread, through a message port that the browser does not hold to the refresh. A hidden
// page always waits for the refresh: an uncapped loop never runs in a tab no one sees. The meter counts the turns
// that actually ran, per second, over half-second windows.

EV.uncapped = (() => {
  const channel = new MessageChannel();
  let queued = null;
  channel.port1.onmessage = () => {
    const turn = queued;
    queued = null;
    if (turn) {
      turn(performance.now());
    }
  };
  return (turn) => {
    queued = turn;
    channel.port2.postMessage(0);
  };
})();

EV.nextTurn = (vsync, turn) => (vsync || document.hidden ? requestAnimationFrame(turn) : EV.uncapped(turn));

EV.rateMeter = () => {
  let count = 0;
  let since = performance.now();
  let rate = 0;
  return {
    tick: (now) => {
      count += 1;
      if (now - since >= 500) {
        rate = Math.round((count * 1000) / (now - since));
        count = 0;
        since = now;
      }
      return rate;
    },
    rate: () => rate,
  };
};

// ---- toolbox/core/watch.js ----
// orior - Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>
// SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational
//
// A frame loop that reports on itself. EV.watchLoop runs a page's step once per turn inside a guard and asks
// EV.nextTurn for the next one. No page schedules its own frames. A throw stops the loop. A loop awake for
// its patience that has turned fewer than twice is reported: one turn is what a dead loop gives, because setup
// has already drawn a correct still frame and the first turn throws. A hidden page is not
// judged; the browser holds its frames, and the count starts again when the page is seen.
//
// A loop runs for the life of the page or on demand. A step that returns false has nothing left to draw, and
// the loop sleeps until the page wakes it. Every loop starts asleep, and a sleeping loop is healthy.
//
//   const loop = EV.watchLoop("scope view", (now) => { draw(now); }, { vsync: () => view.vsync, settle });
//   loop.wake();
//
// vsync, when given, is asked before every turn; without it every turn waits for the refresh. settle, when
// given, returns a promise the next uncapped turn waits on. A turn never queues behind unfinished work.
//
// window.__loopHealth is read fresh on every access and covers every loop on the page: ok is true, false, or
// null before the first verdict; turns counts them all; why and detail come from the loop that settled the
// verdict; loops holds each loop's own record. A failure also shows on the page in a line at the top. A page
// whose loop cannot start at all, with no device to draw on, says so through EV.noLoop and shows its own reason.

EV.loops = [];

EV.noLoop = (label, why, detail) => {
  EV.loops.push({ label, ok: false, turns: 0, why, detail: detail || "", awake: false });
};

EV.loopHealth = () => {
  const loops = EV.loops.map((one) => ({ ...one }));
  const failed = loops.find((one) => one.ok === false);
  const waiting = loops.find((one) => one.ok === null);
  const deciding = failed || waiting || loops[0];
  return {
    ok: loops.length === 0 ? null : failed ? false : waiting ? null : true,
    turns: loops.reduce((sum, one) => sum + one.turns, 0),
    why: deciding ? `${deciding.label}: ${deciding.why}` : "no frame loop on this page",
    detail: failed ? failed.detail : "",
    loops,
  };
};

Object.defineProperty(window, "__loopHealth", { configurable: true, enumerable: true, get: EV.loopHealth });

EV.loopAlarm = (text) => {
  let line = document.getElementById("loopAlarm");
  if (!line) {
    line = document.createElement("div");
    line.id = "loopAlarm";
    line.setAttribute("role", "alert");
    line.style.cssText = "position: fixed; left: 50%; top: 24px; transform: translateX(-50%); z-index: 30; "
      + "padding: 6px 12px; border-radius: 6px; background: #d55e00; color: #ffffff; font: 12px/1.4 system-ui, sans-serif;";
    document.body.appendChild(line);
  }
  line.textContent = text;
  line.hidden = false;
};

EV.watchLoop = (label, step, options = {}) => {
  const patience = options.patience || 1500;
  const record = { label, ok: true, turns: 0, why: "asleep, nothing to draw", detail: "", awake: false };
  EV.loops.push(record);
  let stopped = false;
  let from = 0;
  let timer = 0;
  let unseen = false;

  const fail = (why, detail) => {
    record.ok = false;
    record.why = why;
    record.detail = detail || "";
    console.error(`[${label}] frame loop ${why}`, record.detail);
    EV.loopAlarm(`${label}: frame loop ${why}`);
  };

  const judge = () => {
    timer = 0;
    if (stopped || !record.awake || record.ok === false) {
      return;
    }
    if (document.visibilityState === "hidden") {
      unseen = true;
      return;
    }
    if (record.turns - from < 2) {
      fail(`turned ${record.turns - from} time(s) in ${patience} ms`, "a page that draws one frame and stops looks correct and is not");
    }
  };

  const arm = () => {
    from = record.turns;
    clearTimeout(timer);
    timer = setTimeout(judge, patience);
  };

  document.addEventListener("visibilitychange", () => {
    if (unseen && document.visibilityState !== "hidden") {
      unseen = false;
      arm();
    }
  });

  const schedule = () => {
    const vsync = options.vsync ? options.vsync() : true;
    const waiting = !vsync && options.settle ? options.settle() : null;
    if (waiting) {
      waiting.then(() => EV.nextTurn(options.vsync ? options.vsync() : true, turn));
    } else {
      EV.nextTurn(vsync, turn);
    }
  };

  const turn = (now) => {
    if (stopped) {
      return;
    }
    let more;
    try {
      more = step(now);
    } catch (thrown) {
      stopped = true;
      record.awake = false;
      fail(`threw on turn ${record.turns + 1}: ${thrown && thrown.message ? thrown.message : thrown}`,
           String(thrown && thrown.stack ? thrown.stack : thrown));
      return;
    }
    record.turns += 1;
    if (record.ok === null && record.turns - from >= 2) {
      record.ok = true;
      record.why = "turned twice";
    }
    if (more === false) {
      record.awake = false;
      if (record.ok === null) {
        record.ok = true;
        record.why = "asleep, nothing to draw";
      }
      return;
    }
    schedule();
  };

  return {
    record,
    // Asks for turns. A loop already awake keeps running, and a stopped loop stays stopped.
    wake: () => {
      if (stopped || record.awake) {
        return;
      }
      record.awake = true;
      if (record.ok !== false) {
        record.ok = null;
        record.why = "not judged yet";
      }
      arm();
      schedule();
    },
  };
};

// ---- toolbox/ui/bar.js ----
// orior - Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>
// SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational
//
// The shared control bar: one option model for every blob viz unit, carrying the discipline the
// toolbox's core/scheme.js holds. A unit hands the bar a schema, one entry per setting with its kind,
// its range and its fallback, and the opening values a build wrote. The bar draws one control per
// entry, and on every change it reports what it took and what it refused, each by name. An absent
// value takes its fallback. A value of the wrong kind or outside its range is named in the status
// line and not applied, and the control that holds it stays. Nothing goes silently inert.
//
// A template names it with <!--TOOL ui/bar-->. The unit calls BAR.mount with a container, its schema,
// the build's settings, and a draw callback the bar hands a view on every applied change.

window.BAR = (function () {
  // Checks one value against its rule; returns the reason it errors, or null. The reasons read as a
  // control's allowed range, the same shape cfg.js reports.
  function errorValue(rule, value) {
    if (rule.kind === "int" || rule.kind === "float") {
      var number = rule.kind === "int"
        ? (typeof value === "number" && Number.isInteger(value))
        : (typeof value === "number" && Number.isFinite(value));
      if (!number) { return rule.kind === "int" ? "a whole number" : "a number"; }
      if (rule.low !== undefined && value < rule.low) { return "at least " + rule.low; }
      if (rule.high !== undefined && value > rule.high) { return "at most " + rule.high; }
      return null;
    }
    if (rule.kind === "switch") {
      return typeof value === "boolean" ? null : "on or off";
    }
    if (rule.kind === "word") {
      return rule.words.indexOf(value) >= 0 ? null : "one of " + rule.words.join(", ");
    }
    if (rule.kind === "color") {
      return (typeof value === "string" && /^#[0-9a-fA-F]{6}$/.test(value)) ? null : "a color as #rrggbb";
    }
    // text takes any string.
    return typeof value === "string" ? null : "any text";
  }

  // A view with every setting at its fallback.
  function defaultView(schema) {
    var view = {};
    Object.keys(schema).forEach(function (name) { view[name] = schema[name].fallback; });
    return view;
  }

  // Applies a section over a view. Returns what was applied and what errored, each by name.
  function applyView(view, section, schema) {
    var applied = [];
    var error = [];
    if (!section || typeof section !== "object") {
      return { applied: applied, error: ["settings: an object of name to value"] };
    }
    Object.keys(section).forEach(function (name) {
      var rule = schema[name];
      if (!rule) { error.push(name + ": the bar has no such setting"); return; }
      var reason = errorValue(rule, section[name]);
      if (reason) { error.push(name + ": " + reason); return; }
      view[name] = section[name];
      applied.push(name);
    });
    return { applied: applied, error: error };
  }

  // Builds one control for a rule, reading and writing view[name]. report() runs on every edit.
  function control(name, rule, view, report) {
    var row = document.createElement("label");
    row.className = "bar-row";
    var caption = document.createElement("span");
    caption.className = "bar-name";
    caption.textContent = name;
    row.appendChild(caption);

    var field;
    if (rule.kind === "word") {
      field = document.createElement("select");
      rule.words.forEach(function (word) {
        var option = document.createElement("option");
        option.value = word;
        option.textContent = word === "" ? "(system)" : word;
        field.appendChild(option);
      });
      field.value = view[name];
      field.addEventListener("change", function () { report(name, field.value); });
    } else if (rule.kind === "switch") {
      field = document.createElement("input");
      field.type = "checkbox";
      field.checked = view[name] === true;
      field.addEventListener("change", function () { report(name, field.checked); });
    } else if (rule.kind === "color") {
      field = document.createElement("input");
      field.type = "color";
      field.value = /^#[0-9a-fA-F]{6}$/.test(view[name]) ? view[name] : "#000000";
      field.addEventListener("input", function () { report(name, field.value); });
    } else if (rule.kind === "int" || rule.kind === "float") {
      var bounded = rule.low !== undefined && rule.high !== undefined;
      field = document.createElement("input");
      field.type = bounded ? "range" : "number";
      if (rule.low !== undefined) { field.min = rule.low; }
      if (rule.high !== undefined) { field.max = rule.high; }
      if (rule.kind === "int") { field.step = 1; }
      field.value = view[name];
      var readout = null;
      if (bounded) {
        readout = document.createElement("span");
        readout.className = "bar-value";
        readout.textContent = view[name];
      }
      field.addEventListener("input", function () {
        var text = field.value;
        var parsed = rule.kind === "int" ? parseInt(text, 10) : parseFloat(text);
        if (readout) { readout.textContent = field.value; }
        report(name, Number.isNaN(parsed) ? text : parsed);
      });
      row.appendChild(field);
      if (readout) { row.appendChild(readout); }
      return row;
    } else {
      field = document.createElement("input");
      field.type = "text";
      field.value = view[name];
      field.addEventListener("input", function () { report(name, field.value); });
    }
    row.appendChild(field);
    return row;
  }

  // Mounts the bar into container: a control per schema entry, opened at the build's settings over the
  // fallbacks, with a status line naming what each change took and refused. draw(view) is called once
  // on mount and again on every applied change.
  function mount(container, schema, settings, draw) {
    var view = defaultView(schema);
    var opening = applyView(view, settings || {}, schema);

    var strip = document.createElement("div");
    strip.className = "bar-strip";
    var status = document.createElement("div");
    status.className = "bar-status";

    function say(name, value) {
      var one = {};
      one[name] = value;
      var report = applyView(view, one, schema);
      if (report.error.length) {
        status.textContent = "refused " + report.error.join("; ");
      } else {
        status.textContent = "applied " + name + " = " + view[name];
        draw(view);
      }
    }

    Object.keys(schema).forEach(function (name) {
      strip.appendChild(control(name, schema[name], view, say));
    });
    container.appendChild(strip);
    container.appendChild(status);

    if (opening.error.length) {
      status.textContent = "the build asked for settings the bar refused: " + opening.error.join("; ");
    }
    draw(view);
    return view;
  }

  return { errorValue: errorValue, defaultView: defaultView, applyView: applyView, mount: mount };
})();

  // The observer, held as an offset and an up vector so the axes are re-derived from where it
  // actually is. Euler angles were tried first and they invert the drag past the pole, which reads
  // as the object fighting the hand.
  var target = new THREE.Vector3(0, 0, 0);
  var offset = new THREE.Vector3(0, 5, 34);
  var upVec = new THREE.Vector3(0, 1, 0);
  var side = new THREE.Vector3();

  function screenRight() {
    side.crossVectors(upVec, offset);
    if (side.lengthSq() < 1e-9) {
      side.set(1, 0, 0);
    }
    return side.normalize();
  }

  // ---------------------------------------------------------------------------------------------
  // Color. Cool is nothing arriving and hot is a lot, with the edge controls deciding how much of
  // the middle survives the trip to the screen.
  // ---------------------------------------------------------------------------------------------

  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    var cool = [0.11, 0.24, 0.38];
    var mid = [0.55, 0.42, 0.3];
    var hot = [1.0, 0.62, 0.22];
    var a, b, f;
    if (t < 0.5) {
      a = cool;
      b = mid;
      f = t * 2;
    } else {
      a = mid;
      b = hot;
      f = (t - 0.5) * 2;
    }
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  }

  // Torsion is a PHASE, and a phase is cyclic: it has no top and no bottom, a ramp with two ends
  // misrepresents it - the two extremes of a linear ramp are the same torsion and get opposite
  // colors. Hue is the channel that closes on itself, which makes it the correct one here and also
  // the loudest, since fully saturated hues are as far apart as color gets.
  //
  // The magnitude does NOT go into the hue. It gates the brightness against the floor, anything
  // the field cannot distinguish from noise goes black and only what clears it carries color. The
  // surface then reads as a beacon instead of a gradient: the quiet parts stop competing
  // for attention entirely instead of merely being dimmer.
  function hueToRgb(hue) {
    var h = ((hue % 1) + 1) % 1;
    var sector = h * 6.0;
    var slice = Math.floor(sector);
    var f = sector - slice;
    var q = 1 - f;
    switch (slice % 6) {
      case 0:
        return [1, f, 0];
      case 1:
        return [q, 1, 0];
      case 2:
        return [0, 1, f];
      case 3:
        return [0, q, 1];
      case 4:
        return [f, 0, 1];
      default:
        return [1, 0, q];
    }
  }

  // phase in radians, strength as a fraction of the floor: at or below one it is noise.
  function torsionRamp(phase, strength, boost) {
    var base = hueToRgb(phase / (2 * Math.PI));
    if (strength <= 1.0) {
      // Under the floor. Not dimmed - extinguished. It cannot be mistaken for weak signal.
      var floorGrey = 0.045 + 0.035 * Math.min(1, strength);
      return [floorGrey, floorGrey * 1.05, floorGrey * 1.25];
    }
    // Above the floor the color saturates fast. Clearing the bar is visible immediately and
    // does not need another factor of two to become obvious.
    var lift = Math.min(1, Math.pow((strength - 1.0) * boost, 0.55));
    var glow = 0.25 + 0.75 * lift;
    return [base[0] * glow, base[1] * glow, base[2] * glow];
  }

  function readEdge(value, level, sharpness) {
    // sharpness 0 leaves the field as it is, and 1 cuts it to a circle with no gradient at all.
    var span = grid.high - grid.low || 1;
    var raw = (value - grid.low) / span;
    if (sharpness <= 0.001) {
      return raw;
    }
    var steep = 0.5 + sharpness * sharpness * 900;
    var t = 1 / (1 + Math.exp(-steep * (raw - level)));
    return raw * (1 - sharpness) + t * sharpness;
  }

  function sampleGrid(u, v) {
    var y = Math.min(grid.latitudes - 1, Math.max(0, Math.floor(v * grid.latitudes)));
    var x = ((Math.floor(u * grid.longitudes) % grid.longitudes) + grid.longitudes) % grid.longitudes;
    return grid.values[y][x];
  }

  function paint() {
    var geometry = ball.geometry;
    var position = geometry.attributes.position;
    var count = position.count;
    if (!geometry.attributes.color) {
      geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
    }
    var colors = geometry.attributes.color;
    var level = state.level;
    var sharpness = state.sharp;
    for (var i = 0; i < count; i++) {
      var px = position.getX(i),
        py = position.getY(i),
        pz = position.getZ(i);
      var r = Math.sqrt(px * px + py * py + pz * pz) || 1;
      var v = Math.acos(Math.max(-1, Math.min(1, py / r))) / Math.PI;
      var u = (Math.atan2(pz, px) + Math.PI) / TWO_PI;
      var raw = sampleGrid(u, v);
      var shade;
      if (state.beacon) {
        // Torsion as hue, magnitude as a gate against the floor. The phase is taken from the field's
        // own local turning and not from a separate table: the direction the surface is climbing
        // at this point. Torsion is a reading of it.
        var east = sampleGrid((u + 0.004) % 1, v) - sampleGrid((u - 0.004 + 1) % 1, v);
        var north = sampleGrid(u, Math.min(0.999, v + 0.004)) - sampleGrid(u, Math.max(0.001, v - 0.004));
        var phase = Math.atan2(north, east) + Math.PI;
        var span = grid.high - grid.low || 1;
        var over = (raw - grid.low) / span;
        // Strength as a multiple of the floor. The floor is where the surface stops being
        // distinguishable from its own noise, the same bar the detector draws.
        var strength = over / Math.max(0.0001, state.floor);
        shade = torsionRamp(phase, strength, state.boost);
      } else {
        shade = ramp(readEdge(raw, level, sharpness));
      }
      colors.setXYZ(i, shade[0], shade[1], shade[2]);
    }
    colors.needsUpdate = true;
  }

  // ---------------------------------------------------------------------------------------------
  // The circles. A source's spot is a disc about its own direction. The level cuts each profile
  // at one angle and that angle is the circle drawn. Nothing about where the observer stands enters
  // this: the circles belong to the sources and the observer is free to go anywhere.
  // ---------------------------------------------------------------------------------------------

  function capRadius(profile, level, strength) {
    var samples = profile.length;
    if (!samples || profile[0] * strength < level) {
      return 0;
    }
    for (var i = 1; i < samples; i++) {
      if (profile[i] * strength < level) {
        var span = (profile[i - 1] - profile[i]) * strength;
        var part = span <= 0 ? 0 : (profile[i - 1] * strength - level) / span;
        return (Math.PI * (i - 1 + part)) / (samples - 1);
      }
    }
    return Math.PI;
  }

  function toVector(colatitude, longitude) {
    return new THREE.Vector3(
      Math.sin(colatitude) * Math.cos(longitude),
      Math.cos(colatitude),
      Math.sin(colatitude) * Math.sin(longitude),
    );
  }

  function buildRings() {
    while (ringGroup.children.length) {
      var gone = ringGroup.children.pop();
      gone.geometry.dispose();
      gone.material.dispose();
    }
    if (state.rings === "off") {
      return;
    }

    var level = absoluteLevel();
    for (var s = 0; s < sources.length; s++) {
      var source = sources[s];
      var profile = DATA.profiles[source.depth.toFixed(4)];
      if (!profile) {
        continue;
      }
      var gamma = capRadius(profile, level, source.heat);
      if (gamma <= 0.002 || gamma >= Math.PI - 0.002) {
        continue;
      }

      var axis = toVector(source.colatitude, source.longitude);
      var any = Math.abs(axis.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      var one = new THREE.Vector3().crossVectors(axis, any).normalize();
      var two = new THREE.Vector3().crossVectors(axis, one).normalize();

      var points = [];
      var steps = 84;
      for (var k = 0; k <= steps; k++) {
        var phi = (TWO_PI * k) / steps;
        var point = new THREE.Vector3()
          .addScaledVector(axis, Math.cos(gamma))
          .addScaledVector(one, Math.sin(gamma) * Math.cos(phi))
          .addScaledVector(two, Math.sin(gamma) * Math.sin(phi));
        points.push(point.multiplyScalar(RADIUS * 1.004));
      }
      var warmth = Math.min(1, source.bits / 8);
      var shade = ramp(0.35 + 0.65 * warmth);
      var line = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({
          color: new THREE.Color(shade[0], shade[1], shade[2]),
          transparent: true,
          opacity: state.rings === "only" ? 0.95 : 0.6,
        }),
      );
      line.userData.source = s;
      line.userData.gamma = gamma;
      ringGroup.add(line);
    }
  }

  // The level a circle is cut at has to be measured against one source's own peak and never against
  // the summed surface. On a file with ninety-five symbols the sum runs five hundred times higher
  // than any single contributor. A level taken from the sum sat above every profile and every
  // circle came back with radius zero. The panel then reported no circles meeting, which is a
  // believable answer and was an arithmetic mistake.
  var PEAK = 0;
  for (var seek = 0; seek < sources.length; seek++) {
    var seen = DATA.profiles[sources[seek].depth.toFixed(4)];
    if (seen) {
      PEAK = Math.max(PEAK, seen[0] * sources[seek].heat);
    }
  }

  function absoluteLevel() {
    return state.level * (PEAK || 1);
  }

  // ---------------------------------------------------------------------------------------------
  // Relative geometry. The angle between two sources is the same from everywhere, and the angle the
  // observer happens to see is not. Both are reported, because the gap between them is what moving
  // obliquely is for: a pair squashed against the limb opens up as the observer comes around.
  // ---------------------------------------------------------------------------------------------

  function angleBetween(one, two) {
    return Math.acos(
      Math.max(-1, Math.min(1, toVector(one.colatitude, one.longitude).dot(toVector(two.colatitude, two.longitude)))),
    );
  }

  function apparentAngle(one, two) {
    var eye = offset.clone().normalize();
    var a = toVector(one.colatitude, one.longitude);
    var b = toVector(two.colatitude, two.longitude);
    var flatA = a.clone().addScaledVector(eye, -a.dot(eye));
    var flatB = b.clone().addScaledVector(eye, -b.dot(eye));
    if (flatA.lengthSq() < 1e-9 || flatB.lengthSq() < 1e-9) {
      return 0;
    }
    return Math.acos(Math.max(-1, Math.min(1, flatA.normalize().dot(flatB.normalize()))));
  }

  function meeting() {
    var level = absoluteLevel();
    var radii = [];
    for (var s = 0; s < sources.length; s++) {
      var profile = DATA.profiles[sources[s].depth.toFixed(4)];
      radii.push(profile ? capRadius(profile, level, sources[s].heat) : 0);
    }
    var found = [];
    for (var i = 0; i < sources.length; i++) {
      if (radii[i] <= 0) {
        continue;
      }
      for (var j = i + 1; j < sources.length; j++) {
        if (radii[j] <= 0) {
          continue;
        }
        var apart = angleBetween(sources[i], sources[j]);
        var room = radii[i] + radii[j] - apart;
        if (room > 0) {
          found.push({ i: i, j: j, apart: apart, room: room });
        }
      }
    }
    found.sort(function (a, b) {
      return b.room - a.room;
    });
    return { radii: radii, found: found };
  }

  // ---------------------------------------------------------------------------------------------
  // Counting, by two routes that do not share a step: how many harmonic modes carry anything, and
  // how many circles of the size now being drawn fit on the sphere without lying on top of one
  // another. They do not land on one number and they are not supposed to. A mode is signed and a
  // circle is not, and a degree carries 2l + 1 of them. The mode count runs a small factor above
  // the circle count. Both scale with area over a squared length and neither
  // scales with volume, and a run where one of them started tracking the source count instead would
  // be reporting that something in the geometry had come loose.
  // ---------------------------------------------------------------------------------------------

  function counts(state, met) {
    var spectrum = DATA.spectrum;
    var total = 0,
      i;
    for (i = 0; i < spectrum.length; i++) {
      total += spectrum[i];
    }
    var modes = 0,
      reached = 0;
    for (i = 0; i < spectrum.length; i++) {
      if (total > 0 && spectrum[i] / total > 1e-4) {
        modes += 2 * i + 1;
        reached = i;
      }
    }

    var live = met.radii.filter(function (one) {
      return one > 0;
    });
    var mean = live.length
      ? live.reduce(function (a, b) {
          return a + b;
        }, 0) / live.length
      : 0;
    var seats = 0;
    if (mean > 0 && mean < Math.PI) {
      seats = Math.floor(2 / (1 - Math.cos(mean)));
    }

    // What the observer can see at once, and how much of the sphere that leaves hidden.
    var distance = offset.length() / RADIUS;
    var visible = distance > 1 ? Math.acos(1 / distance) : 0;
    var share = (1 - Math.cos(visible)) / 2;

    // The inversion, and where it stops. Undoing the trip from a source to the surface means
    // dividing degree l by its own gain, and that gain is already below one part in a million by the
    // degree the spectrum has died at. Past there the division amplifies the noise faster than the
    // signal and returns a confident answer about nothing.
    var finest = reached > 0 ? Math.PI / reached : Math.PI;

    return {
      modes: modes,
      reached: reached,
      seats: seats,
      mean: mean,
      visible: visible,
      share: share,
      finest: finest,
      pairs: met.found.length,
    };
  }

  // ---------------------------------------------------------------------------------------------
  // Drawing the panels.
  // ---------------------------------------------------------------------------------------------

  function radians(value) {
    return value.toFixed(3) + " rad";
  }

  function drawCounts(figures) {
    var read = DATA.read;
    var rows = [
      ["symbols placed", DATA.symbols],
      ["bits deposited", read.total_bits.toFixed(0)],
      ["", ""],
      ["harmonic modes alive", figures.modes],
      ["highest degree reached", figures.reached],
      ["circles the sphere seats", figures.seats],
      ["", ""],
      ["mean circle", radians(figures.mean)],
      ["finest recoverable", radians(figures.finest)],
      ["depth read back", read.depth.toFixed(3) + " R"],
      ["", ""],
      ["observer at", (offset.length() / RADIUS).toFixed(2) + " R"],
      ["sees a cap of", radians(figures.visible)],
      ["that is", (figures.share * 100).toFixed(0) + "% of it"],
      ["circles meeting", figures.pairs],
    ];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0] === "") {
        html += "<tr><td colspan=2 style='height:5px'></td></tr>";
        continue;
      }
      html += "<tr><td>" + rows[i][0] + "</td><td class='num'>" + rows[i][1] + "</td></tr>";
    }
    document.getElementById("countTable").innerHTML = html;
  }

  function drawPairs(met) {
    var html = "<tr><th>circles</th><th>apart</th><th>seen</th><th>over</th></tr>";
    var show = met.found.slice(0, 40);
    if (!show.length) {
      html += "<tr><td colspan=4 style='color:var(--faint)'>none at this level</td></tr>";
    }
    for (var k = 0; k < show.length; k++) {
      var one = sources[show[k].i],
        two = sources[show[k].j];
      html +=
        "<tr><td>" +
        one.value +
        " &middot; " +
        two.value +
        "</td>" +
        "<td class='num'>" +
        show[k].apart.toFixed(2) +
        "</td>" +
        "<td class='num'>" +
        apparentAngle(one, two).toFixed(2) +
        "</td>" +
        "<td class='num'>" +
        show[k].room.toFixed(2) +
        "</td></tr>";
    }
    document.getElementById("pairTable").innerHTML = html;
  }

  function drawSpectrum() {
    var canvas = document.getElementById("specCanvas");
    var pen = canvas.getContext("2d");
    var wide = canvas.width,
      high = canvas.height;
    pen.clearRect(0, 0, wide, high);

    var ink = getComputedStyle(document.body).getPropertyValue("--ink").trim();
    var faint = getComputedStyle(document.body).getPropertyValue("--faint").trim();
    var hot = getComputedStyle(document.body).getPropertyValue("--hot").trim();
    var nul = getComputedStyle(document.body).getPropertyValue("--null").trim();

    var both = DATA.spectrum.concat(DATA.null_spectrum).filter(function (v) {
      return v > 0;
    });
    if (!both.length) {
      return;
    }
    var top = Math.log10(Math.max.apply(null, both));
    var floor = top - 9;

    function place(degree, value) {
      var x = 8 + ((wide - 16) * degree) / (DATA.spectrum.length - 1);
      var y =
        value <= 0 ? high - 12 : high - 12 - (high - 22) * Math.max(0, (Math.log10(value) - floor) / (top - floor));
      return [x, y];
    }

    pen.strokeStyle = faint;
    pen.globalAlpha = 0.35;
    pen.beginPath();
    pen.moveTo(8, high - 12);
    pen.lineTo(wide - 8, high - 12);
    pen.stroke();
    pen.globalAlpha = 1;

    function trace(series, color, dashed) {
      pen.strokeStyle = color;
      pen.lineWidth = 1.4;
      pen.setLineDash(dashed ? [3, 3] : []);
      pen.beginPath();
      for (var l = 0; l < series.length; l++) {
        var at = place(l, series[l]);
        if (l === 0) {
          pen.moveTo(at[0], at[1]);
        } else {
          pen.lineTo(at[0], at[1]);
        }
      }
      pen.stroke();
      pen.setLineDash([]);
    }

    // The null goes on top. Underneath it vanishes wherever the two agree, and the degrees where
    // they agree are the reading: a map that has stopped beating random placement is the answer, and
    // a plot that hides it looks like a map winning everywhere.
    trace(DATA.spectrum, hot, false);
    trace(DATA.null_spectrum, nul, true);

    pen.fillStyle = faint;
    pen.font = "9px system-ui, sans-serif";
    pen.fillText("0", 6, high - 3);
    pen.fillText("degree " + (DATA.spectrum.length - 1), wide - 62, high - 3);
  }

  // ---------------------------------------------------------------------------------------------
  // State and wiring.
  // ---------------------------------------------------------------------------------------------

  var state = {
    level: 0.12,
    sharp: 0.26,
    rings: "over",
    fade: 0.94,
    beacon: true,
    floor: 0.34,
    boost: 2.6,
  };

  function refresh(full) {
    if (full) {
      paint();
      buildRings();
    }
    var met = meeting();
    drawCounts(counts(state, met));
    drawPairs(met);
  }

  function bind(id, outId, apply, format) {
    var input = document.getElementById(id);
    var out = document.getElementById(outId);
    function run() {
      var shown = apply(Number(input.value));
      if (out) {
        out.textContent = format ? format(shown) : shown;
      }
    }
    input.addEventListener("input", run);
    run();
  }

  bind(
    "level",
    "levelOut",
    function (raw) {
      state.level = raw / 1000;
      refresh(true);
      return state.level;
    },
    function (v) {
      return v.toFixed(3);
    },
  );

  bind(
    "sharp",
    "sharpOut",
    function (raw) {
      state.sharp = raw / 100;
      refresh(true);
      return state.sharp;
    },
    function (v) {
      return v < 0.05 ? "off" : v > 0.8 ? "hard" : v > 0.4 ? "cut" : "soft";
    },
  );

  bind(
    "floor",
    "floorOut",
    function (raw) {
      // Where the surface stops being distinguishable from its own noise. Everything under it is
      // painted out entirely and not dimmed. Quiet ground cannot be mistaken for weak signal.
      state.floor = raw / 100;
      refresh(true);
      return state.floor;
    },
    function (v) {
      return v.toFixed(2);
    },
  );

  bind(
    "boost",
    "boostOut",
    function (raw) {
      // How hard color comes up once the floor is cleared. High values make clearing the bar visible
      // at once instead of needing another factor of two to become obvious.
      state.boost = raw / 10;
      refresh(true);
      return state.boost;
    },
    function (v) {
      return v.toFixed(1);
    },
  );

  (function () {
    var pick = document.getElementById("beacon");
    if (pick) {
      pick.addEventListener("change", function () {
        state.beacon = pick.value === "1";
        refresh(true);
      });
    }
  })();

  bind(
    "tau",
    "tauOut",
    function (raw) {
      // Conduction past what the page was built with cannot be added here, since smoothing the field
      // further is a change to the physics and this panel only ever changes the reading. The control
      // reports what it was built with and stays put, which is honest about where the boundary is.
      return raw;
    },
    function () {
      return DATA.tau.toExponential(1);
    },
  );

  bind(
    "dist",
    "distOut",
    function (raw) {
      offset.setLength((RADIUS * raw) / 100);
      refresh(false);
      return raw / 100;
    },
    function (v) {
      return v.toFixed(2) + " R";
    },
  );

  bind(
    "fade",
    "fadeOut",
    function (raw) {
      state.fade = raw / 100;
      var boxes = document.querySelectorAll(".box");
      for (var i = 0; i < boxes.length; i++) {
        boxes[i].style.opacity = state.fade;
      }
      return raw;
    },
    function (v) {
      return String(v);
    },
  );

  document.getElementById("rings").addEventListener("change", function (event) {
    state.rings = event.target.value;
    ball.visible = state.rings !== "only";
    refresh(true);
  });

  // Every box moves, because all of them get in front of the object sooner or later.
  function movable(box) {
    var handle = box.querySelector("h4");
    var holding = false,
      fromX = 0,
      fromY = 0,
      wasX = 0,
      wasY = 0;
    handle.addEventListener("mousedown", function (event) {
      holding = true;
      fromX = event.clientX;
      fromY = event.clientY;
      var spot = box.getBoundingClientRect();
      wasX = spot.left;
      wasY = spot.top;
      box.style.right = "auto";
      box.style.bottom = "auto";
      event.preventDefault();
    });
    window.addEventListener("mousemove", function (event) {
      if (!holding) {
        return;
      }
      box.style.left = wasX + event.clientX - fromX + "px";
      box.style.top = wasY + event.clientY - fromY + "px";
    });
    window.addEventListener("mouseup", function () {
      holding = false;
    });
  }
  var boxes = document.querySelectorAll(".box");
  for (var b = 0; b < boxes.length; b++) {
    movable(boxes[b]);
  }

  // The observer, dragged. Left and right always mean left and right to whoever is looking, and the
  // axes come from where the observer is standing now instead of from a world axis. Nothing
  // inverts when it passes over the top.
  var dragging = false,
    lastX = 0,
    lastY = 0;
  renderer.domElement.addEventListener("mousedown", function (event) {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
  });
  window.addEventListener("mouseup", function () {
    dragging = false;
  });
  window.addEventListener("mousemove", function (event) {
    if (!dragging) {
      return;
    }
    var dx = event.clientX - lastX,
      dy = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    var right = screenRight().clone();
    offset.applyAxisAngle(upVec, -dx * 0.006);
    offset.applyAxisAngle(right, -dy * 0.006);
    upVec.applyAxisAngle(right, -dy * 0.006).normalize();
    refresh(false);
  });
  renderer.domElement.addEventListener(
    "wheel",
    function (event) {
      event.preventDefault();
      var slider = document.getElementById("dist");
      slider.value = String(Math.max(105, Math.min(600, Number(slider.value) * (event.deltaY > 0 ? 1.06 : 0.94))));
      slider.dispatchEvent(new Event("input"));
    },
    { passive: false },
  );

  var ask = document.getElementById("ask");
  var tile = document.getElementById("tile");
  tile.innerHTML =
    "<p><b>" +
    DATA.title +
    "</b>, written onto the inside of a scattering ball. Each distinct byte " +
    "is a source. Its heat is its surprisal in this file, in bits. Its depth is set the same way, " +
    "so rare bytes sit near the shell and common ones sit deep.</p>" +
    "<p>Depth decides <b>size</b>. A source at radius r reaches degree l as (r/R)^l. A source " +
    "near the shell prints a small circle and one near the center spreads over the whole sphere. " +
    "A spot is always wider than the source that made it.</p>" +
    "<p>You may go anywhere; the sources may not., an absolute direction carries nothing and the " +
    "angle <b>between</b> two circles carries everything. The pair list reports both that angle and " +
    "the one you happen to see from here, and the two part company near the limb.</p>" +
    "<p>The edge controls are a <b>reading</b>, never the physics. Cutting the field harder shrinks " +
    "every circle and breaks the weakest overlaps first, which is how a coincidence that needs fat " +
    "circles is told from one that survives them being cut to nothing.</p>" +
    "<p>Counting stops somewhere. Modes below the resolution go as boundary area over a squared " +
    "length. The surface holds a finite number of circles however continuous it is, and the " +
    "inversion back to the interior stops at the same place.</p>";
  ask.addEventListener("mouseenter", function () {
    tile.hidden = false;
  });
  tile.addEventListener("mouseleave", function () {
    tile.hidden = true;
  });
  ask.addEventListener("mouseleave", function () {
    setTimeout(function () {
      if (!tile.matches(":hover")) {
        tile.hidden = true;
      }
    }, 220);
  });

  document.getElementById("placeName").textContent = DATA.place;

  function fit() {
    var wide = window.innerWidth,
      high = window.innerHeight;
    renderer.setSize(wide, high);
    camera.aspect = wide / high;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", fit);
  fit();

  // Opening appearance through the shared control bar's model. The schema is the build's one settings
  // source: a value of the wrong kind or out of range is named in the report below and never applied,
  // and a key the build leaves out keeps the page default. The sphere's own reading controls are
  // untouched. The bar governs the chrome the page can honor: the theme, the backdrop the transparent
  // canvas lets through, the opening observer distance, and how present the boxes are. The observer
  // distance opens on a range narrowed to this scene, a span a ball-centered view needs and an open
  // one does not, and a value past it comes back named and refused under the range the slider carries.
  var SCHEMA = DATA.schema || {};
  var SET = DATA.settings || {};
  var wanted = BAR.defaultView(SCHEMA);
  var report = BAR.applyView(wanted, SET, SCHEMA);

  function given(key) {
    return report.applied.indexOf(key) >= 0;
  }

  if (given("theme")) {
    document.documentElement.setAttribute("data-theme", wanted.theme);
  }
  if (given("background")) {
    document.body.style.background = wanted.background;
  }
  if (given("distance")) {
    var slider = document.getElementById("dist");
    slider.value = String(wanted.distance);
    slider.dispatchEvent(new Event("input"));
  }
  if (given("opacity")) {
    var fader = document.getElementById("fade");
    fader.value = String(wanted.opacity);
    fader.dispatchEvent(new Event("input"));
  }

  // The report line. A refusal is named; otherwise the keys the build set are listed, and an empty
  // settings object opens at the page defaults and says so.
  var reportEl = document.getElementById("open-report");
  if (reportEl) {
    reportEl.classList.remove("refused");
    if (report.error.length) {
      reportEl.textContent = "refused " + report.error.join("; ");
      reportEl.classList.add("refused");
    } else if (report.applied.length) {
      reportEl.textContent = "opened with " + report.applied.join(", ");
    } else {
      reportEl.textContent = "opened at the page defaults";
    }
  }

  refresh(true);
  drawSpectrum();

  function turn() {
    camera.position.copy(target).add(offset);
    camera.up.copy(upVec);
    camera.lookAt(target);
    renderer.render(scene, camera);
  }

  EV.watchLoop("sphere view", turn).wake();
</script>
