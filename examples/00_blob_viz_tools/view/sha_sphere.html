<title>Boundary Field</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --ink: #16181d;
    --dim: #5d6470;
    --faint: #949cab;
    --ground: #eceef1;
    --panel: #f8f9fa;
    --edge: #ccd1d9;
    --hot: #d8541f;
    --cool: #2c6f9b;
    --null: #9aa3b0;
  }
  :root:not([data-theme="light"]) {
    --ink: #e6e9ee;
    --dim: #99a1ae;
    --faint: #626a78;
    --ground: #101216;
    --panel: #191c22;
    --edge: #2c313a;
    --hot: #ff7a3d;
    --cool: #4aa3d8;
    --null: #565e6c;
  }
  :root[data-theme="dark"] {
    --ink: #e6e9ee;
    --dim: #99a1ae;
    --faint: #626a78;
    --ground: #101216;
    --panel: #191c22;
    --edge: #2c313a;
    --hot: #ff7a3d;
    --cool: #4aa3d8;
    --null: #565e6c;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font:
      12px/1.5 "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
  }

  .box {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 9px 11px 10px;
    opacity: 0.94;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
    user-select: none;
  }
  .box h4 {
    margin: 0 0 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: move;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 4px 0;
  }
  .row label {
    flex: 0 0 84px;
    color: var(--dim);
    font-size: 11px;
  }
  .row input[type="range"] {
    flex: 1;
    min-width: 90px;
    height: 3px;
    accent-color: var(--hot);
  }
  .row output,
  .row .val {
    flex: 0 0 52px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  select {
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 2px 4px;
    font: inherit;
    font-size: 11px;
  }
  table {
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  th,
  td {
    padding: 1px 8px 1px 0;
    text-align: right;
  }
  th {
    color: var(--faint);
    font-weight: 500;
    font-size: 10px;
  }
  td:first-child,
  th:first-child {
    text-align: left;
  }
  .scroll {
    max-height: 168px;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .scroll::-webkit-scrollbar {
    width: 7px;
  }
  .scroll::-webkit-scrollbar-thumb {
    background: var(--edge);
    border-radius: 4px;
  }
  .scroll::-webkit-scrollbar-track {
    background: transparent;
  }

  #ask {
    position: fixed;
    top: 12px;
    right: 14px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: help;
    opacity: 0.6;
    z-index: 40;
  }
  #ask:hover {
    opacity: 1;
  }
  #tile {
    position: fixed;
    top: 38px;
    right: 14px;
    width: 330px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 12px 14px;
    z-index: 39;
    font-size: 11.5px;
    line-height: 1.62;
    color: var(--dim);
  }
  #tile b {
    color: var(--ink);
    font-weight: 600;
  }
  #tile p {
    margin: 0 0 8px;
  }
  #tile p:last-child {
    margin: 0;
  }
  .key {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    vertical-align: -1px;
  }
  .num {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .warn {
    color: var(--hot);
  }
</style>

<div id="stage"></div>
<div id="ask">?</div>
<div id="tile" hidden></div>

<div class="box" id="panel" style="left: 14px; top: 14px; width: 236px">
  <h4>Reading</h4>
  <div class="row">
    <label>edge level</label>
    <input type="range" id="level" min="1" max="999" value="120" />
    <span class="val" id="levelOut">–</span>
  </div>
  <div class="row">
    <label>edge</label>
    <input type="range" id="sharp" min="0" max="100" value="26" />
    <span class="val" id="sharpOut">soft</span>
  </div>
  <div class="row">
    <label>surface</label>
    <select id="beacon">
      <option value="1">torsion, gated</option>
      <option value="0">magnitude ramp</option>
    </select>
  </div>
  <div class="row">
    <label>noise floor</label>
    <input type="range" id="floor" min="1" max="90" value="34" />
    <span class="val" id="floorOut">0.34</span>
  </div>
  <div class="row">
    <label>beacon</label>
    <input type="range" id="boost" min="5" max="80" value="26" />
    <span class="val" id="boostOut">2.6</span>
  </div>
  <div class="row">
    <label>conduction</label>
    <input type="range" id="tau" min="0" max="100" value="0" />
    <span class="val" id="tauOut">as built</span>
  </div>
  <div class="row">
    <label>observer</label>
    <input type="range" id="dist" min="105" max="600" value="340" />
    <span class="val" id="distOut">3.4 R</span>
  </div>
  <div class="row">
    <label>circles</label>
    <select id="rings">
      <option value="over">on the surface</option>
      <option value="only">circles alone</option>
      <option value="off">off</option>
    </select>
  </div>
  <div class="row">
    <label>opacity</label>
    <input type="range" id="fade" min="25" max="100" value="94" />
    <span class="val" id="fadeOut">94</span>
  </div>
</div>

<div class="box" id="counts" style="right: 14px; top: 70px; width: 268px">
  <h4>What the boundary holds</h4>
  <table id="countTable"></table>
</div>

<div class="box" id="spec" style="right: 14px; bottom: 14px; width: 268px">
  <h4>Power by degree</h4>
  <canvas id="specCanvas" width="244" height="118"></canvas>
  <div style="font-size: 10.5px; color: var(--dim); margin-top: 5px">
    <span class="key" style="background: var(--hot)"></span> placed by
    <span id="placeName" class="num"></span> &nbsp;
    <span class="key" style="background: var(--null)"></span> same sources, no
    map
  </div>
</div>

<div class="box" id="pairs" style="left: 14px; bottom: 14px; width: 300px">
  <h4>Circles that meet</h4>
  <div class="scroll"><table id="pairTable"></table></div>
</div>

  // ---------------------------------------------------------------------------------------------
  // The page recomputes no physics. Every profile, every coefficient and the whole surface came out
  // of the generator. What moves here is the reading: where the edge is cut, how hard that cut is,
  // and where the observer stands. Keeping those apart from the field is the entire point of the
  // tool, because a control that changed the physics would let a slider manufacture a result.
  // ---------------------------------------------------------------------------------------------

  var TWO_PI = Math.PI * 2;
  var grid = DATA.grid;
  var sources = DATA.sources;
  var stage = document.getElementById("stage");

  var scene = new THREE.Scene();
  // Forty-six degrees and an opening distance of three and a half radii, so the whole ball is inside
  // the frame when the page opens. At the distance this started with the sphere overran the viewport
  // on every side, which reads as a rendering fault and is a camera that was never framed.
  var camera = new THREE.PerspectiveCamera(46, 1, 0.1, 200);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  var RADIUS = 10;
  var ball = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, grid.longitudes, grid.latitudes),
    new THREE.MeshBasicMaterial({ vertexColors: true }),
  );
  scene.add(ball);

  var ringGroup = new THREE.Group();
  scene.add(ringGroup);

  // The observer, held as an offset and an up vector so the axes are re-derived from where it
  // actually is. Euler angles were tried first and they invert the drag past the pole, which reads
  // as the object fighting the hand.
  var target = new THREE.Vector3(0, 0, 0);
  var offset = new THREE.Vector3(0, 5, 34);
  var upVec = new THREE.Vector3(0, 1, 0);
  var side = new THREE.Vector3();

  function screenRight() {
    side.crossVectors(upVec, offset);
    if (side.lengthSq() < 1e-9) {
      side.set(1, 0, 0);
    }
    return side.normalize();
  }

  // ---------------------------------------------------------------------------------------------
  // Colour. Cool is nothing arriving and hot is a lot, with the edge controls deciding how much of
  // the middle survives the trip to the screen.
  // ---------------------------------------------------------------------------------------------

  function ramp(t) {
    t = Math.max(0, Math.min(1, t));
    var cool = [0.11, 0.24, 0.38];
    var mid = [0.55, 0.42, 0.3];
    var hot = [1.0, 0.62, 0.22];
    var a, b, f;
    if (t < 0.5) {
      a = cool;
      b = mid;
      f = t * 2;
    } else {
      a = mid;
      b = hot;
      f = (t - 0.5) * 2;
    }
    return [
      a[0] + (b[0] - a[0]) * f,
      a[1] + (b[1] - a[1]) * f,
      a[2] + (b[2] - a[2]) * f,
    ];
  }

  // Torsion is a PHASE, and a phase is cyclic: it has no top and no bottom, a ramp with two ends
  // misrepresents it - the two extremes of a linear ramp are the same torsion and get opposite
  // colours. Hue is the channel that closes on itself, which makes it the correct one here and also
  // the loudest, since fully saturated hues are as far apart as colour gets.
  //
  // The magnitude does NOT go into the hue. It gates the brightness against the floor, anything
  // the field cannot distinguish from noise goes black and only what clears it carries colour. That
  // is what makes the surface read as a beacon instead of a gradient: the quiet parts stop competing
  // for attention entirely rather than merely being dimmer.
  function hueToRgb(hue) {
    var h = ((hue % 1) + 1) % 1;
    var sector = h * 6.0;
    var slice = Math.floor(sector);
    var f = sector - slice;
    var q = 1 - f;
    switch (slice % 6) {
      case 0:
        return [1, f, 0];
      case 1:
        return [q, 1, 0];
      case 2:
        return [0, 1, f];
      case 3:
        return [0, q, 1];
      case 4:
        return [f, 0, 1];
      default:
        return [1, 0, q];
    }
  }

  // phase in radians, strength as a fraction of the floor: at or below one it is noise.
  function torsionRamp(phase, strength, boost) {
    var base = hueToRgb(phase / (2 * Math.PI));
    if (strength <= 1.0) {
      // Under the floor. Not dimmed - extinguished, so it cannot be mistaken for weak signal.
      var floorGrey = 0.045 + 0.035 * Math.min(1, strength);
      return [floorGrey, floorGrey * 1.05, floorGrey * 1.25];
    }
    // Above the floor the colour saturates fast, so clearing the bar is visible immediately rather
    // than needing another factor of two to become obvious.
    var lift = Math.min(1, Math.pow((strength - 1.0) * boost, 0.55));
    var glow = 0.25 + 0.75 * lift;
    return [base[0] * glow, base[1] * glow, base[2] * glow];
  }

  function readEdge(value, level, sharpness) {
    // sharpness 0 leaves the field as it is, and 1 cuts it to a circle with no gradient at all.
    var span = grid.high - grid.low || 1;
    var raw = (value - grid.low) / span;
    if (sharpness <= 0.001) {
      return raw;
    }
    var steep = 0.5 + sharpness * sharpness * 900;
    var t = 1 / (1 + Math.exp(-steep * (raw - level)));
    return raw * (1 - sharpness) + t * sharpness;
  }

  function sampleGrid(u, v) {
    var y = Math.min(
      grid.latitudes - 1,
      Math.max(0, Math.floor(v * grid.latitudes)),
    );
    var x =
      ((Math.floor(u * grid.longitudes) % grid.longitudes) + grid.longitudes) %
      grid.longitudes;
    return grid.values[y][x];
  }

  function paint() {
    var geometry = ball.geometry;
    var position = geometry.attributes.position;
    var count = position.count;
    if (!geometry.attributes.color) {
      geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(new Float32Array(count * 3), 3),
      );
    }
    var colors = geometry.attributes.color;
    var level = state.level;
    var sharpness = state.sharp;
    for (var i = 0; i < count; i++) {
      var px = position.getX(i),
        py = position.getY(i),
        pz = position.getZ(i);
      var r = Math.sqrt(px * px + py * py + pz * pz) || 1;
      var v = Math.acos(Math.max(-1, Math.min(1, py / r))) / Math.PI;
      var u = (Math.atan2(pz, px) + Math.PI) / TWO_PI;
      var raw = sampleGrid(u, v);
      var shade;
      if (state.beacon) {
        // Torsion as hue, magnitude as a gate against the floor. The phase is taken from the field's
        // own local turning rather than from a separate table: the direction the surface is climbing
        // at this point, which is what torsion is a reading of.
        var east =
          sampleGrid((u + 0.004) % 1, v) - sampleGrid((u - 0.004 + 1) % 1, v);
        var north =
          sampleGrid(u, Math.min(0.999, v + 0.004)) -
          sampleGrid(u, Math.max(0.001, v - 0.004));
        var phase = Math.atan2(north, east) + Math.PI;
        var span = grid.high - grid.low || 1;
        var over = (raw - grid.low) / span;
        // Strength as a multiple of the floor. The floor is where the surface stops being
        // distinguishable from its own noise, which is the same bar the detector draws.
        var strength = over / Math.max(0.0001, state.floor);
        shade = torsionRamp(phase, strength, state.boost);
      } else {
        shade = ramp(readEdge(raw, level, sharpness));
      }
      colors.setXYZ(i, shade[0], shade[1], shade[2]);
    }
    colors.needsUpdate = true;
  }

  // ---------------------------------------------------------------------------------------------
  // The circles. A source's spot is a disc about its own direction, so the level cuts each profile
  // at one angle and that angle is the circle drawn. Nothing about where the observer stands enters
  // this: the circles belong to the sources and the observer is free to go anywhere.
  // ---------------------------------------------------------------------------------------------

  function capRadius(profile, level, strength) {
    var samples = profile.length;
    if (!samples || profile[0] * strength < level) {
      return 0;
    }
    for (var i = 1; i < samples; i++) {
      if (profile[i] * strength < level) {
        var span = (profile[i - 1] - profile[i]) * strength;
        var part = span <= 0 ? 0 : (profile[i - 1] * strength - level) / span;
        return (Math.PI * (i - 1 + part)) / (samples - 1);
      }
    }
    return Math.PI;
  }

  function toVector(colatitude, longitude) {
    return new THREE.Vector3(
      Math.sin(colatitude) * Math.cos(longitude),
      Math.cos(colatitude),
      Math.sin(colatitude) * Math.sin(longitude),
    );
  }

  function buildRings() {
    while (ringGroup.children.length) {
      var gone = ringGroup.children.pop();
      gone.geometry.dispose();
      gone.material.dispose();
    }
    if (state.rings === "off") {
      return;
    }

    var level = absoluteLevel();
    for (var s = 0; s < sources.length; s++) {
      var source = sources[s];
      var profile = DATA.profiles[source.depth.toFixed(4)];
      if (!profile) {
        continue;
      }
      var gamma = capRadius(profile, level, source.heat);
      if (gamma <= 0.002 || gamma >= Math.PI - 0.002) {
        continue;
      }

      var axis = toVector(source.colatitude, source.longitude);
      var any =
        Math.abs(axis.y) < 0.9
          ? new THREE.Vector3(0, 1, 0)
          : new THREE.Vector3(1, 0, 0);
      var one = new THREE.Vector3().crossVectors(axis, any).normalize();
      var two = new THREE.Vector3().crossVectors(axis, one).normalize();

      var points = [];
      var steps = 84;
      for (var k = 0; k <= steps; k++) {
        var phi = (TWO_PI * k) / steps;
        var point = new THREE.Vector3()
          .addScaledVector(axis, Math.cos(gamma))
          .addScaledVector(one, Math.sin(gamma) * Math.cos(phi))
          .addScaledVector(two, Math.sin(gamma) * Math.sin(phi));
        points.push(point.multiplyScalar(RADIUS * 1.004));
      }
      var warmth = Math.min(1, source.bits / 8);
      var shade = ramp(0.35 + 0.65 * warmth);
      var line = new THREE.LineLoop(
        new THREE.BufferGeometry().setFromPoints(points),
        new THREE.LineBasicMaterial({
          color: new THREE.Color(shade[0], shade[1], shade[2]),
          transparent: true,
          opacity: state.rings === "only" ? 0.95 : 0.6,
        }),
      );
      line.userData.source = s;
      line.userData.gamma = gamma;
      ringGroup.add(line);
    }
  }

  // The level a circle is cut at has to be measured against one source's own peak and never against
  // the summed surface. On a file with ninety-five symbols the sum runs five hundred times higher
  // than any single contributor, a level taken from the sum sat above every profile and every
  // circle came back with radius zero. The panel then reported no circles meeting, which is a
  // believable answer and was an arithmetic mistake.
  var PEAK = 0;
  for (var seek = 0; seek < sources.length; seek++) {
    var seen = DATA.profiles[sources[seek].depth.toFixed(4)];
    if (seen) {
      PEAK = Math.max(PEAK, seen[0] * sources[seek].heat);
    }
  }

  function absoluteLevel() {
    return state.level * (PEAK || 1);
  }

  // ---------------------------------------------------------------------------------------------
  // Relative geometry. The angle between two sources is the same from everywhere, and the angle the
  // observer happens to see is not. Both are reported, because the gap between them is what moving
  // obliquely is for: a pair squashed against the limb opens up as the observer comes around.
  // ---------------------------------------------------------------------------------------------

  function angleBetween(one, two) {
    return Math.acos(
      Math.max(
        -1,
        Math.min(
          1,
          toVector(one.colatitude, one.longitude).dot(
            toVector(two.colatitude, two.longitude),
          ),
        ),
      ),
    );
  }

  function apparentAngle(one, two) {
    var eye = offset.clone().normalize();
    var a = toVector(one.colatitude, one.longitude);
    var b = toVector(two.colatitude, two.longitude);
    var flatA = a.clone().addScaledVector(eye, -a.dot(eye));
    var flatB = b.clone().addScaledVector(eye, -b.dot(eye));
    if (flatA.lengthSq() < 1e-9 || flatB.lengthSq() < 1e-9) {
      return 0;
    }
    return Math.acos(
      Math.max(-1, Math.min(1, flatA.normalize().dot(flatB.normalize()))),
    );
  }

  function meeting() {
    var level = absoluteLevel();
    var radii = [];
    for (var s = 0; s < sources.length; s++) {
      var profile = DATA.profiles[sources[s].depth.toFixed(4)];
      radii.push(profile ? capRadius(profile, level, sources[s].heat) : 0);
    }
    var found = [];
    for (var i = 0; i < sources.length; i++) {
      if (radii[i] <= 0) {
        continue;
      }
      for (var j = i + 1; j < sources.length; j++) {
        if (radii[j] <= 0) {
          continue;
        }
        var apart = angleBetween(sources[i], sources[j]);
        var room = radii[i] + radii[j] - apart;
        if (room > 0) {
          found.push({ i: i, j: j, apart: apart, room: room });
        }
      }
    }
    found.sort(function (a, b) {
      return b.room - a.room;
    });
    return { radii: radii, found: found };
  }

  // ---------------------------------------------------------------------------------------------
  // Counting, by two routes that do not share a step: how many harmonic modes carry anything, and
  // how many circles of the size now being drawn fit on the sphere without lying on top of one
  // another. They do not land on one number and they are not supposed to. A mode is signed and a
  // circle is not, and a degree carries 2l + 1 of them, so the mode count runs a small factor above
  // the circle count. What matters is that both scale with area over a squared length and neither
  // scales with volume, and a run where one of them started tracking the source count instead would
  // be reporting that something in the geometry had come loose.
  // ---------------------------------------------------------------------------------------------

  function counts(state, met) {
    var spectrum = DATA.spectrum;
    var total = 0,
      i;
    for (i = 0; i < spectrum.length; i++) {
      total += spectrum[i];
    }
    var modes = 0,
      reached = 0;
    for (i = 0; i < spectrum.length; i++) {
      if (total > 0 && spectrum[i] / total > 1e-4) {
        modes += 2 * i + 1;
        reached = i;
      }
    }

    var live = met.radii.filter(function (one) {
      return one > 0;
    });
    var mean = live.length
      ? live.reduce(function (a, b) {
          return a + b;
        }, 0) / live.length
      : 0;
    var seats = 0;
    if (mean > 0 && mean < Math.PI) {
      seats = Math.floor(2 / (1 - Math.cos(mean)));
    }

    // What the observer can see at once, and how much of the sphere that leaves hidden.
    var distance = offset.length() / RADIUS;
    var visible = distance > 1 ? Math.acos(1 / distance) : 0;
    var share = (1 - Math.cos(visible)) / 2;

    // The inversion, and where it stops. Undoing the trip from a source to the surface means
    // dividing degree l by its own gain, and that gain is already below one part in a million by the
    // degree the spectrum has died at. Past there the division amplifies the noise faster than the
    // signal and returns a confident answer about nothing.
    var finest = reached > 0 ? Math.PI / reached : Math.PI;

    return {
      modes: modes,
      reached: reached,
      seats: seats,
      mean: mean,
      visible: visible,
      share: share,
      finest: finest,
      pairs: met.found.length,
    };
  }

  // ---------------------------------------------------------------------------------------------
  // Drawing the panels.
  // ---------------------------------------------------------------------------------------------

  function radians(value) {
    return value.toFixed(3) + " rad";
  }

  function drawCounts(figures) {
    var read = DATA.read;
    var rows = [
      ["symbols placed", DATA.symbols],
      ["bits deposited", read.total_bits.toFixed(0)],
      ["", ""],
      ["harmonic modes alive", figures.modes],
      ["highest degree reached", figures.reached],
      ["circles the sphere seats", figures.seats],
      ["", ""],
      ["mean circle", radians(figures.mean)],
      ["finest recoverable", radians(figures.finest)],
      ["depth read back", read.depth.toFixed(3) + " R"],
      ["", ""],
      ["observer at", (offset.length() / RADIUS).toFixed(2) + " R"],
      ["sees a cap of", radians(figures.visible)],
      ["that is", (figures.share * 100).toFixed(0) + "% of it"],
      ["circles meeting", figures.pairs],
    ];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0] === "") {
        html += "<tr><td colspan=2 style='height:5px'></td></tr>";
        continue;
      }
      html +=
        "<tr><td>" +
        rows[i][0] +
        "</td><td class='num'>" +
        rows[i][1] +
        "</td></tr>";
    }
    document.getElementById("countTable").innerHTML = html;
  }

  function drawPairs(met) {
    var html =
      "<tr><th>circles</th><th>apart</th><th>seen</th><th>over</th></tr>";
    var show = met.found.slice(0, 40);
    if (!show.length) {
      html +=
        "<tr><td colspan=4 style='color:var(--faint)'>none at this level</td></tr>";
    }
    for (var k = 0; k < show.length; k++) {
      var one = sources[show[k].i],
        two = sources[show[k].j];
      html +=
        "<tr><td>" +
        one.value +
        " &middot; " +
        two.value +
        "</td>" +
        "<td class='num'>" +
        show[k].apart.toFixed(2) +
        "</td>" +
        "<td class='num'>" +
        apparentAngle(one, two).toFixed(2) +
        "</td>" +
        "<td class='num'>" +
        show[k].room.toFixed(2) +
        "</td></tr>";
    }
    document.getElementById("pairTable").innerHTML = html;
  }

  function drawSpectrum() {
    var canvas = document.getElementById("specCanvas");
    var pen = canvas.getContext("2d");
    var wide = canvas.width,
      high = canvas.height;
    pen.clearRect(0, 0, wide, high);

    var ink = getComputedStyle(document.body).getPropertyValue("--ink").trim();
    var faint = getComputedStyle(document.body)
      .getPropertyValue("--faint")
      .trim();
    var hot = getComputedStyle(document.body).getPropertyValue("--hot").trim();
    var nul = getComputedStyle(document.body).getPropertyValue("--null").trim();

    var both = DATA.spectrum.concat(DATA.null_spectrum).filter(function (v) {
      return v > 0;
    });
    if (!both.length) {
      return;
    }
    var top = Math.log10(Math.max.apply(null, both));
    var floor = top - 9;

    function place(degree, value) {
      var x = 8 + ((wide - 16) * degree) / (DATA.spectrum.length - 1);
      var y =
        value <= 0
          ? high - 12
          : high -
            12 -
            (high - 22) *
              Math.max(0, (Math.log10(value) - floor) / (top - floor));
      return [x, y];
    }

    pen.strokeStyle = faint;
    pen.globalAlpha = 0.35;
    pen.beginPath();
    pen.moveTo(8, high - 12);
    pen.lineTo(wide - 8, high - 12);
    pen.stroke();
    pen.globalAlpha = 1;

    function trace(series, colour, dashed) {
      pen.strokeStyle = colour;
      pen.lineWidth = 1.4;
      pen.setLineDash(dashed ? [3, 3] : []);
      pen.beginPath();
      for (var l = 0; l < series.length; l++) {
        var at = place(l, series[l]);
        if (l === 0) {
          pen.moveTo(at[0], at[1]);
        } else {
          pen.lineTo(at[0], at[1]);
        }
      }
      pen.stroke();
      pen.setLineDash([]);
    }

    // The null goes on top. Underneath it vanishes wherever the two agree, and the degrees where
    // they agree are the reading: a map that has stopped beating random placement is the answer, and
    // a plot that hides it looks like a map winning everywhere.
    trace(DATA.spectrum, hot, false);
    trace(DATA.null_spectrum, nul, true);

    pen.fillStyle = faint;
    pen.font = "9px system-ui, sans-serif";
    pen.fillText("0", 6, high - 3);
    pen.fillText("degree " + (DATA.spectrum.length - 1), wide - 62, high - 3);
  }

  // ---------------------------------------------------------------------------------------------
  // State and wiring.
  // ---------------------------------------------------------------------------------------------

  var state = {
    level: 0.12,
    sharp: 0.26,
    rings: "over",
    fade: 0.94,
    beacon: true,
    floor: 0.34,
    boost: 2.6,
  };

  function refresh(full) {
    if (full) {
      paint();
      buildRings();
    }
    var met = meeting();
    drawCounts(counts(state, met));
    drawPairs(met);
  }

  function bind(id, outId, apply, format) {
    var input = document.getElementById(id);
    var out = document.getElementById(outId);
    function run() {
      var shown = apply(Number(input.value));
      if (out) {
        out.textContent = format ? format(shown) : shown;
      }
    }
    input.addEventListener("input", run);
    run();
  }

  bind(
    "level",
    "levelOut",
    function (raw) {
      state.level = raw / 1000;
      refresh(true);
      return state.level;
    },
    function (v) {
      return v.toFixed(3);
    },
  );

  bind(
    "sharp",
    "sharpOut",
    function (raw) {
      state.sharp = raw / 100;
      refresh(true);
      return state.sharp;
    },
    function (v) {
      return v < 0.05 ? "off" : v > 0.8 ? "hard" : v > 0.4 ? "cut" : "soft";
    },
  );

  bind(
    "floor",
    "floorOut",
    function (raw) {
      // Where the surface stops being distinguishable from its own noise. Everything under it is
      // painted out entirely rather than dimmed, so quiet ground cannot be mistaken for weak signal.
      state.floor = raw / 100;
      refresh(true);
      return state.floor;
    },
    function (v) {
      return v.toFixed(2);
    },
  );

  bind(
    "boost",
    "boostOut",
    function (raw) {
      // How hard colour comes up once the floor is cleared. High values make clearing the bar visible
      // at once instead of needing another factor of two to become obvious.
      state.boost = raw / 10;
      refresh(true);
      return state.boost;
    },
    function (v) {
      return v.toFixed(1);
    },
  );

  (function () {
    var pick = document.getElementById("beacon");
    if (pick) {
      pick.addEventListener("change", function () {
        state.beacon = pick.value === "1";
        refresh(true);
      });
    }
  })();

  bind(
    "tau",
    "tauOut",
    function (raw) {
      // Conduction past what the page was built with cannot be added here, since smoothing the field
      // further is a change to the physics and this panel only ever changes the reading. The control
      // reports what it was built with and stays put, which is honest about where the boundary is.
      return raw;
    },
    function () {
      return DATA.tau.toExponential(1);
    },
  );

  bind(
    "dist",
    "distOut",
    function (raw) {
      offset.setLength((RADIUS * raw) / 100);
      refresh(false);
      return raw / 100;
    },
    function (v) {
      return v.toFixed(2) + " R";
    },
  );

  bind(
    "fade",
    "fadeOut",
    function (raw) {
      state.fade = raw / 100;
      var boxes = document.querySelectorAll(".box");
      for (var i = 0; i < boxes.length; i++) {
        boxes[i].style.opacity = state.fade;
      }
      return raw;
    },
    function (v) {
      return String(v);
    },
  );

  document.getElementById("rings").addEventListener("change", function (event) {
    state.rings = event.target.value;
    ball.visible = state.rings !== "only";
    refresh(true);
  });

  // Every box moves, because all of them get in front of the object sooner or later.
  function movable(box) {
    var handle = box.querySelector("h4");
    var holding = false,
      fromX = 0,
      fromY = 0,
      wasX = 0,
      wasY = 0;
    handle.addEventListener("mousedown", function (event) {
      holding = true;
      fromX = event.clientX;
      fromY = event.clientY;
      var spot = box.getBoundingClientRect();
      wasX = spot.left;
      wasY = spot.top;
      box.style.right = "auto";
      box.style.bottom = "auto";
      event.preventDefault();
    });
    window.addEventListener("mousemove", function (event) {
      if (!holding) {
        return;
      }
      box.style.left = wasX + event.clientX - fromX + "px";
      box.style.top = wasY + event.clientY - fromY + "px";
    });
    window.addEventListener("mouseup", function () {
      holding = false;
    });
  }
  var boxes = document.querySelectorAll(".box");
  for (var b = 0; b < boxes.length; b++) {
    movable(boxes[b]);
  }

  // The observer, dragged. Left and right always mean left and right to whoever is looking, and the
  // axes come from where the observer is standing now instead of from a world axis, so nothing
  // inverts when it passes over the top.
  var dragging = false,
    lastX = 0,
    lastY = 0;
  renderer.domElement.addEventListener("mousedown", function (event) {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
  });
  window.addEventListener("mouseup", function () {
    dragging = false;
  });
  window.addEventListener("mousemove", function (event) {
    if (!dragging) {
      return;
    }
    var dx = event.clientX - lastX,
      dy = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    var right = screenRight().clone();
    offset.applyAxisAngle(upVec, -dx * 0.006);
    offset.applyAxisAngle(right, -dy * 0.006);
    upVec.applyAxisAngle(right, -dy * 0.006).normalize();
    refresh(false);
  });
  renderer.domElement.addEventListener(
    "wheel",
    function (event) {
      event.preventDefault();
      var slider = document.getElementById("dist");
      slider.value = String(
        Math.max(
          105,
          Math.min(
            600,
            Number(slider.value) * (event.deltaY > 0 ? 1.06 : 0.94),
          ),
        ),
      );
      slider.dispatchEvent(new Event("input"));
    },
    { passive: false },
  );

  var ask = document.getElementById("ask");
  var tile = document.getElementById("tile");
  tile.innerHTML =
    "<p><b>" +
    DATA.title +
    "</b>, written onto the inside of a scattering ball. Each distinct byte " +
    "is a source. Its heat is its surprisal in this file, in bits. Its depth is set the same way, " +
    "so rare bytes sit near the shell and common ones sit deep.</p>" +
    "<p>Depth decides <b>size</b>. A source at radius r reaches degree l as (r/R)^l, a source " +
    "near the shell prints a small circle and one near the centre spreads over the whole sphere. " +
    "A spot is always wider than the source that made it.</p>" +
    "<p>You may go anywhere; the sources may not. an absolute direction carries nothing and the " +
    "angle <b>between</b> two circles carries everything. The pair list reports both that angle and " +
    "the one you happen to see from here, and the two part company near the limb.</p>" +
    "<p>The edge controls are a <b>reading</b>, never the physics. Cutting the field harder shrinks " +
    "every circle and breaks the weakest overlaps first, which is how a coincidence that needs fat " +
    "circles is told from one that survives them being cut to nothing.</p>" +
    "<p>Counting stops somewhere. Modes below the resolution go as boundary area over a squared " +
    "length, so the surface holds a finite number of circles however continuous it is, and the " +
    "inversion back to the interior stops at the same place.</p>";
  ask.addEventListener("mouseenter", function () {
    tile.hidden = false;
  });
  tile.addEventListener("mouseleave", function () {
    tile.hidden = true;
  });
  ask.addEventListener("mouseleave", function () {
    setTimeout(function () {
      if (!tile.matches(":hover")) {
        tile.hidden = true;
      }
    }, 220);
  });

  document.getElementById("placeName").textContent = DATA.place;

  function fit() {
    var wide = window.innerWidth,
      high = window.innerHeight;
    renderer.setSize(wide, high);
    camera.aspect = wide / high;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", fit);
  fit();

  // Opening state, where the caller asked for one.
  var opening = DATA.settings || {};
  if (opening.theme) {
    document.documentElement.setAttribute("data-theme", opening.theme);
  }
  if (opening.distance) {
    var slider = document.getElementById("dist");
    slider.value = String(Math.max(105, Math.min(600, opening.distance)));
    slider.dispatchEvent(new Event("input"));
  }
  if (typeof opening.opacity === "number" && opening.opacity > 0) {
    var fader = document.getElementById("fade");
    fader.value = String(opening.opacity);
    fader.dispatchEvent(new Event("input"));
  }

  refresh(true);
  drawSpectrum();

  function turn() {
    camera.position.copy(target).add(offset);
    camera.up.copy(upVec);
    camera.lookAt(target);
    renderer.render(scene, camera);
    requestAnimationFrame(turn);
  }
  // ---------------------------------------------------------------------------------------------
  // Does the loop turn twice?
  // ---------------------------------------------------------------------------------------------
  //
  // A page whose loop throws on its first turn has already had one frame drawn by setup, so it
  // renders a complete, correct, still picture. The build succeeds, the parse check passes, and every
  // feature after the throw does nothing -- which is every feature. That failure has happened in this
  // tree once and nothing outside the page can catch it cheaply, since it is a runtime fault in a file
  // that parses. So the page reports on itself.
  //
  // Two turns and not one, because one is exactly what a dead loop produces.
  var LOOP_WATCH_MS = 1500;
  var loopTurns = 0;
  //
  // TWO WAYS THE LOOP CAN STOP, AND THEY ARE NOT THE SAME EVENT. A throw is fatal, because the next
  // turn throws the same way. Slowness is a report and stops nothing.
  //
  // The first version treated them alike and set one flag on either, which the guard then refused to
  // run under. `setTimeout` runs in a background tab and `requestAnimationFrame` does not, a page
  // opened in a tab that is not visible completed one turn, was declared dead on schedule, and never
  // ran again even once brought to the front. The watchdog was the thing that killed the loop.
  var loopThrew = null; // fatal, and the only thing that stops scheduling
  var loopWarned = false; // reported once, stops nothing
  window.__loopHealth = { ok: null, turns: 0, why: "not checked yet" };

  function loopOutOfSight() {
    return (
      typeof document !== "undefined" && document.visibilityState === "hidden"
    );
  }

  function loopSay(why, detail) {
    window.__loopHealth = {
      ok: false,
      turns: loopTurns,
      why: why,
      detail: detail || "",
    };
    if (window.console && console.error) {
      console.error("FRAME LOOP: " + why, detail || "");
    }
  }

  function loopFailed(why, detail) {
    loopThrew = why;
    loopSay(why, detail);
  }

  function guardedTurn() {
    if (loopThrew) {
      return;
    }
    try {
      turn();
    } catch (thrown) {
      loopFailed(
        "threw on turn " + (loopTurns + 1) + ", " + String(thrown),
        String(thrown && thrown.stack ? thrown.stack : ""),
      );
      return;
    }
    loopTurns += 1;
    if (loopTurns >= 2 && window.__loopHealth.ok !== true) {
      window.__loopHealth = {
        ok: true,
        turns: loopTurns,
        why: "the loop turned twice",
      };
    }
  }

  var loopScheduled = requestAnimationFrame;
  requestAnimationFrame = function (fn) {
    return loopScheduled(fn === turn ? guardedTurn : fn);
  };

  function loopWatch() {
    if (loopThrew || loopWarned) {
      return;
    }
    // Hidden is not slow. The frame clock is stopped by the browser, so there is nothing to judge and
    // the question is asked again later instead of answered wrongly now.
    if (loopOutOfSight()) {
      setTimeout(loopWatch, LOOP_WATCH_MS);
      return;
    }
    if (loopTurns < 2) {
      loopWarned = true;
      loopSay(
        "only " + loopTurns + " turn(s) in " + LOOP_WATCH_MS + " ms",
        "a page that renders one frame and stops looks correct and is not",
      );
    }
  }

  setTimeout(loopWatch, LOOP_WATCH_MS);

  if (typeof document !== "undefined" && document.addEventListener) {
    document.addEventListener("visibilitychange", function () {
      if (!loopOutOfSight() && !loopThrew && loopTurns < 2) {
        setTimeout(loopWatch, LOOP_WATCH_MS);
      }
    });
  }

  guardedTurn();
</script>
