<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2076" viewBox="0 0 1200 2076" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1200" height="2076" fill="#0b0d11"/>
<text x="40" y="70" font-size="36" fill="#e6ebf2" font-weight="700" text-anchor="start">Tracking every cell in a developing zebrafish</text>
<text x="40" y="104" font-size="18" fill="#98a2b3" font-weight="400" text-anchor="start">One compiled tracker. No training, no model, nothing read but the movie in front of it.</text>
<rect x="40" y="140" width="1120" height="666" rx="14" fill="#141821" stroke="#2a3140"/>
<text x="64" y="178" font-size="22" fill="#e6ebf2" font-weight="600" text-anchor="start">What happens to a movie</text>
<text x="64" y="206" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">25 training samples, 903 frames, one RTX 3070, Windows 11. Each step&#x27;s bar is its summed clock over those samples.</text>
<circle cx="76" cy="248" r="13" fill="#56B4E9"/>
<text x="76" y="253" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">1</text>
<text x="100" y="253" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Read a frame</text>
<text x="100" y="277" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">one frame&#x27;s voxels come off disk, as the integers the microscope wrote</text>
<rect x="880" y="238" width="6" height="22" rx="4" fill="#56B4E9"/>
<text x="896" y="255" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">2,230 ms</text>
<circle cx="76" cy="326" r="13" fill="#56B4E9"/>
<text x="76" y="331" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">2</text>
<text x="100" y="331" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Find the cells</text>
<text x="100" y="355" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">each voxel is smoothed twice and the difference kept exactly, then every voxel steps uphill</text>
<text x="100" y="376" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">until it stops: one body per resting place</text>
<rect x="880" y="316" width="90" height="22" rx="4" fill="#56B4E9"/>
<text x="980" y="333" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">32,149 ms</text>
<circle cx="76" cy="404" r="13" fill="#56B4E9"/>
<text x="76" y="409" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">3</text>
<text x="100" y="409" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Keep it as runs</text>
<text x="100" y="433" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">each body becomes the stretches of voxels it holds along each row, and the frame is those</text>
<text x="100" y="454" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">runs: about 27 times smaller than the labelled volume</text>
<rect x="880" y="394" width="12" height="22" rx="4" fill="#56B4E9"/>
<text x="902" y="411" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">4,327 ms</text>
<circle cx="76" cy="482" r="13" fill="#E69F00"/>
<text x="76" y="487" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">4</text>
<text x="100" y="487" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Find the drift</text>
<text x="100" y="511" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">the whole view&#x27;s shift between two frames, the same count taken at every shift at once</text>
<rect x="880" y="472" width="72" height="22" rx="4" fill="#E69F00"/>
<text x="962" y="489" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">25,879 ms</text>
<circle cx="76" cy="560" r="13" fill="#E69F00"/>
<text x="76" y="565" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">5</text>
<text x="100" y="565" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Meet the neighbours</text>
<text x="100" y="589" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">the positive voxels two frames share, body by body, at that shift</text>
<rect x="880" y="550" width="14" height="22" rx="4" fill="#E69F00"/>
<text x="904" y="567" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">5,352 ms</text>
<circle cx="76" cy="638" r="13" fill="#E69F00"/>
<text x="76" y="643" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">6</text>
<text x="100" y="643" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Let each cell find its own shift</text>
<text x="100" y="667" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">every cell walks from the view&#x27;s shift to the shift where it agrees best with the next frame;</text>
<text x="100" y="688" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">each walk stops on its own</text>
<rect x="880" y="628" width="12" height="22" rx="4" fill="#E69F00"/>
<text x="902" y="645" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">4,475 ms</text>
<circle cx="76" cy="716" r="13" fill="#E69F00"/>
<text x="76" y="721" font-size="14" fill="#0b0d11" font-weight="700" text-anchor="middle">7</text>
<text x="100" y="721" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Link and score</text>
<text x="100" y="745" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">the strongest partner each way makes a link, divisions are kept as branches, and the links</text>
<text x="100" y="766" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">are scored against the answer key</text>
<rect x="880" y="706" width="2" height="22" rx="4" fill="#E69F00"/>
<text x="892" y="723" font-size="14" fill="#98a2b3" font-weight="400" text-anchor="start">475 ms</text>
<rect x="64" y="778" width="16" height="16" rx="3" fill="#56B4E9"/>
<text x="88" y="791" font-size="16" fill="#e6ebf2" font-weight="400" text-anchor="start">once per frame: 38,706 ms, 51.7% of the engine time</text>
<rect x="620" y="778" width="16" height="16" rx="3" fill="#E69F00"/>
<text x="644" y="791" font-size="16" fill="#e6ebf2" font-weight="400" text-anchor="start">once per pair of frames: 36,181 ms, 48.3%</text>
<rect x="40" y="836" width="1120" height="250" rx="14" fill="#141821" stroke="#2a3140"/>
<text x="64" y="874" font-size="22" fill="#e6ebf2" font-weight="600" text-anchor="start">What it never does</text>
<circle cx="76" cy="911" r="10" fill="none" stroke="#D55E00" stroke-width="3"/>
<line x1="69" y1="904" x2="83" y2="918" stroke="#D55E00" stroke-width="3"/>
<text x="100" y="916" font-size="18" fill="#e6ebf2" font-weight="600" text-anchor="start">It is not trained</text>
<text x="100" y="940" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">there is no model and no learned parameter in the binary: nothing was fitted to this competition&#x27;s data or to any other</text>
<circle cx="76" cy="973" r="10" fill="none" stroke="#D55E00" stroke-width="3"/>
<line x1="69" y1="966" x2="83" y2="980" stroke="#D55E00" stroke-width="3"/>
<text x="100" y="978" font-size="18" fill="#e6ebf2" font-weight="600" text-anchor="start">It reads nothing else</text>
<text x="100" y="1002" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">the only input is the frames of the sample being tracked, and a .cfg of settings. No atlas, no pretrained network, no</text>
<text x="100" y="1023" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">second dataset, no internet</text>
<circle cx="76" cy="1035" r="10" fill="none" stroke="#D55E00" stroke-width="3"/>
<line x1="69" y1="1028" x2="83" y2="1042" stroke="#D55E00" stroke-width="3"/>
<text x="100" y="1040" font-size="18" fill="#e6ebf2" font-weight="600" text-anchor="start">It forms no floating point value</text>
<text x="100" y="1064" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">every stage is integer arithmetic, so the same frames give the same bytes on any machine that runs it</text>
<rect x="40" y="1116" width="1120" height="230" rx="14" fill="#141821" stroke="#2a3140"/>
<text x="64" y="1154" font-size="22" fill="#e6ebf2" font-weight="600" text-anchor="start">Links against the answer key</text>
<text x="64" y="1226" font-size="54" fill="#009E73" font-weight="700" text-anchor="start">2,458 of 2,511</text>
<text x="64" y="1260" font-size="18" fill="#e6ebf2" font-weight="400" text-anchor="start">labeled links correct, 97.9%, strict scoring</text>
<rect x="560" y="1188" width="525" height="34" fill="#009E73"/>
<rect x="1085" y="1188" width="11" height="34" fill="#D55E00"/>
<rect x="1096" y="1188" width="1" height="34" fill="#CC79A7"/>
<text x="560" y="1256" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">wrong 51 (2.0%), no link 2 (0.1%), endpoint not detected 0</text>
<text x="64" y="1312" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">The same 25 samples on the Linux build: the same pooled score, edge rows byte for byte, wall clock 80,860 ms.</text>
<rect x="40" y="1376" width="1120" height="300" rx="14" fill="#141821" stroke="#2a3140"/>
<text x="64" y="1414" font-size="22" fill="#e6ebf2" font-weight="600" text-anchor="start">What comes out</text>
<text x="64" y="1446" font-size="16" fill="#e6ebf2" font-weight="400" text-anchor="start">One sample of 16 frames, 64 x 256 x 256 voxels, as one file, including the .cfg that made it:</text>
<rect x="64" y="1466" width="816" height="30" rx="4" fill="#2a3140"/>
<text x="892" y="1487" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">268,435,456 bytes as labelled voxels</text>
<rect x="64" y="1506" width="30" height="30" rx="4" fill="#56B4E9"/>
<text x="106" y="1527" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">9,927,668 bytes as runs, 27 times smaller</text>
<text x="64" y="1572" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">All 25 objects together are 528,664,080 bytes. The viewer page streams one into a single buffer on the graphics card and</text>
<text x="64" y="1596" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">draws every cell from it: voxels, or smooth translucent cells lit by lights the reader moves, each with a wall at the</text>
<text x="64" y="1620" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">membrane&#x27;s thickness, beside a map the camera turns. A clinical face names things in words; a machine face exposes every</text>
<text x="64" y="1644" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">integer to a program.</text>
<rect x="40" y="1706" width="1120" height="300" rx="14" fill="#141821" stroke="#2a3140"/>
<text x="64" y="1744" font-size="22" fill="#e6ebf2" font-weight="600" text-anchor="start">What every run checks, and what it still gets wrong</text>
<circle cx="76" cy="1778" r="9" fill="#009E73"/>
<text x="100" y="1784" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Runs against voxels</text>
<text x="100" y="1808" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">25 objects: every body&#x27;s run lengths sum to its voxel count, 0 aberrant</text>
<circle cx="76" cy="1836" r="9" fill="#009E73"/>
<text x="100" y="1842" font-size="17" fill="#e6ebf2" font-weight="600" text-anchor="start">Settings against settings</text>
<text x="100" y="1866" font-size="15" fill="#98a2b3" font-weight="400" text-anchor="start">a .cfg written by a run, run again, writes the same bytes and the same edges</text>
<circle cx="76" cy="1894" r="9" fill="#CC79A7"/>
<text x="100" y="1900" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">Every positive body is a cell here: about 1,000 a frame against a published estimate of a few hundred.</text>
<circle cx="76" cy="1928" r="9" fill="#CC79A7"/>
<text x="100" y="1934" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">Repairing an over-cut cell can join two distinct cells through a hub; the viewer&#x27;s review list ranks them.</text>
<circle cx="76" cy="1962" r="9" fill="#CC79A7"/>
<text x="100" y="1968" font-size="15" fill="#e6ebf2" font-weight="400" text-anchor="start">The binary does not yet write the competition&#x27;s submission file, and it wants a compute 7.5 or 8.6 device.</text>
<text x="40" y="2046" font-size="12" fill="#98a2b3" font-weight="400" text-anchor="start">Membrane thickness: Bionumbers, cell biology by the numbers; bilayer 3.6 to 4.3 nm in rat hepatocyte plasma membranes (Mitra et al., PNAS 2004).</text>
</svg>
