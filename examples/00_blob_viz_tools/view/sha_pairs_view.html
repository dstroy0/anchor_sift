<style>
:root { color-scheme: dark; }
body { margin: 0; background: #06070a; color: #e8ebf0;
  font: 12px/1.5 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#stage { position: fixed; inset: 0; }
canvas { display: block; }
.panel { position: fixed; background: #12141a; border: 1px solid #262b34;
  border-radius: 5px; padding: 10px 12px; opacity: 0.94; user-select: none; }
#controls { left: 14px; top: 14px; width: 250px; }
#controls h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: 0.09em;
  text-transform: uppercase; color: #99a1ae; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.row label { flex: 0 0 66px; color: #99a1ae; }

.row .val { flex: 0 0 46px; text-align: right; font-variant-numeric: tabular-nums; }
button { background: #1a1d24; color: #e8ebf0; border: 1px solid #333b47;
  border-radius: 3px; padding: 3px 9px; font: inherit; cursor: pointer; }
button:hover { border-color: #ffe14d; }
#key { right: 14px; top: 14px; width: 210px; }
#key .swatch { display: inline-block; width: 22px; height: 4px; border-radius: 2px;
  vertical-align: middle; margin-right: 7px; }
#key .line { margin: 5px 0; color: #c6ccd6; }
#digest { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px;

  <h4>The rounds</h4>

  </div>
  <div class="row">
    <button id="prev">&#8249; step</button>

    <button id="next">step &#8250;</button>
  </div>
  <div class="row">
    <label>envelope</label>
    <input type="range" id="env" min="0" max="100" value="55">
    <span class="val" id="envOut">0.55</span>

  <div class="row">
    <label>lines</label>
    <input type="range" id="fat" min="4" max="40" value="16">

</div>

<div class="panel" id="key">

  <div class="line"><span class="swatch" style="background:#ffe14d"></span>both bits set</div>
  <div class="line"><span class="swatch" style="background:#ff3d81"></span>top set, bottom clear</div>
  <div class="line"><span class="swatch" style="background:#3dd6ff"></span>bottom set, top clear</div>
  <div class="line"><span class="swatch" style="background:#2b3550"></span>both clear</div>

// ---- toolbox/core/clock.js ----
// orior - Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>

//
// When the next turn of a frame loop runs. With vsync, once per display refresh. Without it, as soon as the turn
// before has left the main thread, through a message port that the browser does not hold to the refresh. A hidden
// page always waits for the refresh: an uncapped loop never runs in a tab no one sees. The meter counts the turns
// that actually ran, per second, over half-second windows.

EV.uncapped = (() => {
  const channel = new MessageChannel();
  let queued = null;
  channel.port1.onmessage = () => {
    const turn = queued;
    queued = null;
    if (turn) {
      turn(performance.now());
    }
  };
  return (turn) => {
    queued = turn;
    channel.port2.postMessage(0);
  };
})();

EV.nextTurn = (vsync, turn) => (vsync || document.hidden ? requestAnimationFrame(turn) : EV.uncapped(turn));

EV.rateMeter = () => {
  let count = 0;
  let since = performance.now();
  let rate = 0;
  return {
    tick: (now) => {
      count += 1;
      if (now - since >= 500) {
        rate = Math.round((count * 1000) / (now - since));
        count = 0;
        since = now;
      }
      return rate;
    },
    rate: () => rate,
  };
};

// ---- toolbox/core/watch.js ----
// orior - Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>
// SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational
//
// A frame loop that reports on itself. EV.watchLoop runs a page's step once per turn inside a guard and asks
// EV.nextTurn for the next one. No page schedules its own frames. A throw stops the loop. A loop awake for
// its patience that has turned fewer than twice is reported: one turn is what a dead loop gives, because setup
// has already drawn a correct still frame and the first turn throws. A hidden page is not
// judged; the browser holds its frames, and the count starts again when the page is seen.
//
// A loop runs for the life of the page or on demand. A step that returns false has nothing left to draw, and
// the loop sleeps until the page wakes it. Every loop starts asleep, and a sleeping loop is healthy.
//
//   const loop = EV.watchLoop("scope view", (now) => { draw(now); }, { vsync: () => view.vsync, settle });
//   loop.wake();
//
// vsync, when given, is asked before every turn; without it every turn waits for the refresh. settle, when
// given, returns a promise the next uncapped turn waits on. A turn never queues behind unfinished work.
//
// window.__loopHealth is read fresh on every access and covers every loop on the page: ok is true, false, or
// null before the first verdict; turns counts them all; why and detail come from the loop that settled the
// verdict; loops holds each loop's own record. A failure also shows on the page in a line at the top. A page
// whose loop cannot start at all, with no device to draw on, says so through EV.noLoop and shows its own reason.

EV.loops = [];

EV.noLoop = (label, why, detail) => {
  EV.loops.push({ label, ok: false, turns: 0, why, detail: detail || "", awake: false });
};

EV.loopHealth = () => {
  const loops = EV.loops.map((one) => ({ ...one }));
  const failed = loops.find((one) => one.ok === false);
  const waiting = loops.find((one) => one.ok === null);
  const deciding = failed || waiting || loops[0];
  return {
    ok: loops.length === 0 ? null : failed ? false : waiting ? null : true,
    turns: loops.reduce((sum, one) => sum + one.turns, 0),
    why: deciding ? `${deciding.label}: ${deciding.why}` : "no frame loop on this page",
    detail: failed ? failed.detail : "",
    loops,
  };
};

Object.defineProperty(window, "__loopHealth", { configurable: true, enumerable: true, get: EV.loopHealth });

EV.loopAlarm = (text) => {
  let line = document.getElementById("loopAlarm");
  if (!line) {
    line = document.createElement("div");
    line.id = "loopAlarm";
    line.setAttribute("role", "alert");
    line.style.cssText = "position: fixed; left: 50%; top: 24px; transform: translateX(-50%); z-index: 30; "
      + "padding: 6px 12px; border-radius: 6px; background: #d55e00; color: #ffffff; font: 12px/1.4 system-ui, sans-serif;";
    document.body.appendChild(line);
  }
  line.textContent = text;
  line.hidden = false;
};

EV.watchLoop = (label, step, options = {}) => {
  const patience = options.patience || 1500;
  const record = { label, ok: true, turns: 0, why: "asleep, nothing to draw", detail: "", awake: false };
  EV.loops.push(record);
  let stopped = false;
  let from = 0;
  let timer = 0;
  let unseen = false;

  const fail = (why, detail) => {
    record.ok = false;
    record.why = why;
    record.detail = detail || "";
    console.error(`[${label}] frame loop ${why}`, record.detail);
    EV.loopAlarm(`${label}: frame loop ${why}`);
  };

  const judge = () => {
    timer = 0;
    if (stopped || !record.awake || record.ok === false) {
      return;
    }
    if (document.visibilityState === "hidden") {
      unseen = true;
      return;
    }
    if (record.turns - from < 2) {
      fail(`turned ${record.turns - from} time(s) in ${patience} ms`, "a page that draws one frame and stops looks correct and is not");
    }
  };

  const arm = () => {
    from = record.turns;
    clearTimeout(timer);
    timer = setTimeout(judge, patience);
  };

  document.addEventListener("visibilitychange", () => {
    if (unseen && document.visibilityState !== "hidden") {
      unseen = false;
      arm();
    }
  });

  const schedule = () => {
    const vsync = options.vsync ? options.vsync() : true;
    const waiting = !vsync && options.settle ? options.settle() : null;
    if (waiting) {
      waiting.then(() => EV.nextTurn(options.vsync ? options.vsync() : true, turn));
    } else {
      EV.nextTurn(vsync, turn);
    }
  };

  const turn = (now) => {
    if (stopped) {
      return;
    }
    let more;
    try {
      more = step(now);
    } catch (thrown) {
      stopped = true;
      record.awake = false;
      fail(`threw on turn ${record.turns + 1}: ${thrown && thrown.message ? thrown.message : thrown}`,
           String(thrown && thrown.stack ? thrown.stack : thrown));
      return;
    }
    record.turns += 1;
    if (record.ok === null && record.turns - from >= 2) {
      record.ok = true;
      record.why = "turned twice";
    }
    if (more === false) {
      record.awake = false;
      if (record.ok === null) {
        record.ok = true;
        record.why = "asleep, nothing to draw";
      }
      return;
    }
    schedule();
  };

  return {
    record,
    // Asks for turns. A loop already awake keeps running, and a stopped loop stays stopped.
    wake: () => {
      if (stopped || record.awake) {
        return;
      }
      record.awake = true;
      if (record.ok !== false) {
        record.ok = null;
        record.why = "not judged yet";
      }
      arm();
      schedule();
    },
  };
};

var stage = document.getElementById("stage");

var R = 12;

// thread. A cylinder is real geometry with a real radius, and "not too thin" is a number the reader
// can turn. Vertex colors down its length carry the gradient: a mixed pair runs hot at the set end
// to cold at the clear end. The line shows which bit is which and not only that they differ.

var along = [];
var pos = baseGeometry.attributes.position;
for (var v = 0; v < pos.count; v++) { along.push(pos.getY(v) + 0.5); }

function makeLine(dir) {
  var geometry = baseGeometry.clone();
  geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(pos.count * 3), 3));
  var mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ vertexColors: true }));

  // Orient the cylinder's Y axis onto the pair's diameter and stretch it end to end. The endpoints
  // are +dir*R and -dir*R. The center of the cylinder is the origin: the line passes through the
  // center exactly, the point of the construction.
  var axis = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize();
  var quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis);
  mesh.quaternion.copy(quat);
  mesh.userData.top = axis.y >= 0 ? 1 : 0;  // which end is the "a" bit, for the gradient direction

var fill = new Float32Array(pairs.length);   // 0 both clear, 1 both set, used by the envelope

function paint(roundIndex) {
  var frame = DATA.frames[roundIndex - 1];
  for (var i = 0; i < pairs.length; i++) {
    var a = frame.charCodeAt(pairs[i].a) === 49;
    var b = frame.charCodeAt(pairs[i].b) === 49;
    fill[i] = (a ? 0.5 : 0) + (b ? 0.5 : 0);

    // The two ends of this cylinder. "a" is bit `a` at one end, "b" at the other; which end is the
    // geometric top depends on how the axis was oriented, tracked at build time.
    var aColor = a ? HOT : COLD;
    var bColor = b ? HOT : COLD;
    // Mixed pairs get the order hue, not two grays. A flip of which bit is set is a change
    // of color and not only of which end glows.
    if (a !== b) {
      aColor = a ? TOP : COLD;
      bColor = b ? BOT : COLD;
    }
    var topEnd = lines[i].userData.top === 1 ? aColor : bColor;
    var botEnd = lines[i].userData.top === 1 ? bColor : aColor;

    var color = lines[i].geometry.attributes.color;
    for (var v = 0; v < along.length; v++) {
      var t = along[v];
      color.setXYZ(v,
        botEnd.r + (topEnd.r - botEnd.r) * t,
        botEnd.g + (topEnd.g - botEnd.g) * t,
        botEnd.b + (topEnd.b - botEnd.b) * t);
    }
    color.needsUpdate = true;

    var lit = (a && b);
    lines[i].material.opacity = lit ? 1.0 : (a || b ? 0.92 : 0.5);
    lines[i].material.transparent = !lit;
  }
  shapeLines();
  shapeEnvelope();
  document.getElementById("digest").textContent =
    (roundIndex === 64 ? "digest  " : "round " + roundIndex + " of 64   ") + DATA.digest;
}

function shapeLines() {
  var radius = state.fat * R;
  for (var i = 0; i < lines.length; i++) {
    // Length is the full diameter; radius is the reader's setting. Scaling the shared base cylinder
    // avoids rebuilding 128 geometries every time the thickness moves.
    lines[i].scale.set(radius, 2 * R, radius);
  }
}

function shapeEnvelope() {
  var array = envGeometry.attributes.position.array;
  for (var e = 0; e < envVerts; e++) {
    var f = fill[nearestPair[e]];
    // Bulge out where the pair is set, dent in where it is clear, about a mid radius. The envelope
    // is a low, lumpy skin and never a sphere, because the state it is reading is not uniform.
    var reach = R * (0.55 + 0.5 * state.env * (f - 0.5) * 2);
    array[e * 3] = envBase[e * 3] * reach;
    array[e * 3 + 1] = envBase[e * 3 + 1] * reach;
    array[e * 3 + 2] = envBase[e * 3 + 2] * reach;
  }
  envGeometry.attributes.position.needsUpdate = true;
  envGeometry.computeVertexNormals();
}

// ---------------------------------------------------------------------------------------------
// Observer, dragged. Offset plus up vector, axes re-derived. Nothing inverts over the pole.
// ---------------------------------------------------------------------------------------------

var target = new THREE.Vector3(0, 0, 0);
var offset = new THREE.Vector3(0, 6, 40);
var upVec = new THREE.Vector3(0, 1, 0);
var side = new THREE.Vector3();
function screenRight() {
  side.crossVectors(upVec, offset);
  if (side.lengthSq() < 1e-9) { side.set(1, 0, 0); }
  return side.normalize();
}

var dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("mousedown", function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mouseup", function () { dragging = false; });
window.addEventListener("mousemove", function (e) {
  if (!dragging) { return; }
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  var right = screenRight().clone();
  offset.applyAxisAngle(upVec, -dx * 0.006);
  offset.applyAxisAngle(right, -dy * 0.006);
  upVec.applyAxisAngle(right, -dy * 0.006).normalize();
});
renderer.domElement.addEventListener("wheel", function (e) {
  e.preventDefault();
  offset.multiplyScalar(e.deltaY > 0 ? 1.06 : 0.94);
}, { passive: false });

// ---------------------------------------------------------------------------------------------
// Controls.
// ---------------------------------------------------------------------------------------------

var roundIn = document.getElementById("round");
var roundOut = document.getElementById("roundOut");
roundIn.addEventListener("input", function () {
  state.round = Number(roundIn.value);
  roundOut.textContent = String(state.round);
  paint(state.round);
});
function step(by) {
  state.round = Math.max(1, Math.min(64, state.round + by));
  roundIn.value = String(state.round);
  roundOut.textContent = String(state.round);
  paint(state.round);
}
document.getElementById("prev").addEventListener("click", function () { step(-1); });
document.getElementById("next").addEventListener("click", function () { step(1); });
var playBtn = document.getElementById("play");
playBtn.addEventListener("click", function () {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? "pause" : "play";
});

document.getElementById("env").addEventListener("input", function (e) {
  state.env = Number(e.target.value) / 100;
  document.getElementById("envOut").textContent = state.env.toFixed(2);
  shapeEnvelope();
});
document.getElementById("fat").addEventListener("input", function (e) {
  state.fat = Number(e.target.value) / 1000;
  document.getElementById("fatOut").textContent = state.fat.toFixed(3);
  shapeLines();
});
document.getElementById("sideOn").addEventListener("click", function () {
  offset.set(offset.length(), 0, 0);
  upVec.set(0, 1, 0);
});

function fit() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", fit);
fit();
paint(state.round);

var clock = new THREE.Clock();
var since = 0;
function turn() {
  var gap = clock.getDelta();
  if (state.playing) {
    since += gap;
    if (since > 0.12) { since = 0; step(state.round >= 64 ? -63 : 1); }
  }
  camera.position.copy(target).add(offset);
  camera.up.copy(upVec);
  camera.lookAt(target);
  renderer.render(scene, camera);
}

EV.watchLoop("pairs view", turn).wake();
</script>
