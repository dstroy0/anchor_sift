<title>Interior Clock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --ink: #15171c; --dim: #5c636f; --faint: #939bab; --ground: #edeef1;
  --panel: #f8f9fa; --edge: #cbd0d8; --hot: #d4531c; --cold: #2f6f9e;
  --good: #2f8f5b; --miss: #b8442c;
}
:root:not([data-theme="light"]) {
  --ink: #e5e8ee; --dim: #98a0ad; --faint: #616976; --ground: #0f1115;
  --panel: #181b21; --edge: #2b3039; --hot: #ff7a3d; --cold: #4aa3d8;
  --good: #4cc38a; --miss: #ff6b4a;
}
:root[data-theme="dark"] {
  --ink: #e5e8ee; --dim: #98a0ad; --faint: #616976; --ground: #0f1115;
  --panel: #181b21; --edge: #2b3039; --hot: #ff7a3d; --cold: #4aa3d8;
  --good: #4cc38a; --miss: #ff6b4a;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 12px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden;
}
#stage { position: fixed; inset: 0; }
canvas { display: block; }
.box {
  position: fixed; background: var(--panel); border: 1px solid var(--edge);
  border-radius: 5px; padding: 9px 11px 10px; opacity: 0.94;
  box-shadow: 0 2px 14px rgba(0,0,0,0.2); user-select: none;
}
.box h4 {
  margin: 0 0 7px; font-size: 10px; font-weight: 600; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--dim); cursor: move;
}
.row { display: flex; align-items: center; gap: 7px; margin: 4px 0; }
.row label { flex: 0 0 74px; color: var(--dim); font-size: 11px; }
.row input[type=range] { flex: 1; min-width: 80px; height: 3px; accent-color: var(--hot); }
.row .val { flex: 0 0 54px; text-align: right; font-variant-numeric: tabular-nums; font-size: 11px; }
select, button {
  background: var(--ground); color: var(--ink); border: 1px solid var(--edge);
  border-radius: 3px; padding: 2px 6px; font: inherit; font-size: 11px; cursor: pointer;
}
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 11px; }
th, td { padding: 1px 8px 1px 0; text-align: right; }
th { color: var(--faint); font-weight: 500; font-size: 10px; }
td:first-child, th:first-child { text-align: left; }
#ask {
  position: fixed; top: 12px; right: 14px; width: 20px; height: 20px; border-radius: 50%;
  border: 1px solid var(--edge); background: var(--panel); color: var(--dim);
  font-size: 12px; line-height: 18px; text-align: center; cursor: help; opacity: 0.6; z-index: 40;
}
#ask:hover { opacity: 1; }
#tile {
  position: fixed; top: 38px; right: 14px; width: 336px; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 5px; padding: 12px 14px; z-index: 39;
  font-size: 11.5px; line-height: 1.62; color: var(--dim);
}
#tile b { color: var(--ink); } #tile p { margin: 0 0 8px; } #tile p:last-child { margin: 0; }
.good { color: var(--good); } .miss { color: var(--miss); }
.num { color: var(--ink); font-variant-numeric: tabular-nums; }
</style>

<div id="stage"></div>
<div id="ask">?</div>
<div id="tile" hidden></div>

<div class="box" id="panel" style="left:14px; top:14px; width:224px;">
  <h4>Reading</h4>
  <div class="row">
    <label>medium</label>
    <select id="mode">
      <option value="glow">scattering, glow</option>
      <option value="shadow">clear, shadow</option>
      <option value="neutrino">through-going</option>
    </select>
  </div>
  <div class="row">
    <label>clock</label>
    <input type="range" id="rate" min="0" max="100" value="42">
    <span class="val" id="rateOut">running</span>
  </div>
  <div class="row">
    <label>contrast</label>
    <input type="range" id="gamma" min="50" max="600" value="260">
    <span class="val" id="gammaOut">2.6</span>
  </div>
  <div class="row">
    <label>observer</label>
    <input type="range" id="dist" min="115" max="600" value="330">
    <span class="val" id="distOut">3.3 R</span>
  </div>
  <div class="row">
    <label>interior</label>
    <select id="truth">
      <option value="hide">hidden</option>
      <option value="show">shown</option>
    </select>
  </div>
  <div class="row">
    <button id="still" style="width:100%">hold the observer still</button>
  </div>
</div>

<div class="box" id="found" style="right:14px; top:70px; width:288px;">
  <h4>Derived from the boundary</h4>
  <table id="foundTable"></table>
</div>

<div class="box" id="curveBox" style="left:14px; bottom:14px; width:430px;">
  <h4>What one patch receives, over time</h4>
  <canvas id="curveCanvas" width="406" height="82"></canvas>
</div>

<div class="box" id="cost" style="right:14px; bottom:14px; width:288px;">
  <h4>What a shadow has to survive</h4>
  <table id="costTable"></table>
</div>

<script>
var DATA = /*ORRERY_DATA*/null;

var TWO_PI = Math.PI * 2;
var bodies = DATA.bodies;
var stage = document.getElementById("stage");

var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(46, 1, 0.1, 300);
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

var RADIUS = 10;
var LAT = 64, LON = 128;

// What is seen at a point of the boundary is what arrived at that point from inside. Light leaves
// there; it does not carry on across the interior and out the far side, so the near hemisphere
// stands in front of the far one and hides it. Front faces, ordinary blending, depth written.
//
// Adding both faces together was tried and is wrong for that reason: it laid the far side's spots
// over the near side's and showed two places at once, which is a picture of a surface light passes
// straight through and not of one it leaves from. The value at a point is still flux and not paint,
// so a point that receives nothing goes dark on its own without anything being painted black.
//
// The opacity control stays, since turning the surface down is how the interior gets looked at
// while the recovery is being checked against it. That is a deliberate act by whoever is reading
// the page and never the default state of the boundary.
var ball = new THREE.Mesh(
  new THREE.SphereGeometry(RADIUS, LON, LAT),
  new THREE.MeshBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 1.0,
    side: THREE.FrontSide
  })
);
scene.add(ball);

// The interior, drawn only when asked for. It is the answer sheet: the page derives radii from the
// boundary and this is what they are being checked against, so leaving it on by default would let
// a reader confirm a recovery by looking at the thing the recovery is supposed to find.
var truthGroup = new THREE.Group();
truthGroup.visible = false;
scene.add(truthGroup);

var sun = new THREE.Mesh(
  new THREE.SphereGeometry(0.45, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffcf6a })
);
truthGroup.add(sun);

var marks = [];
for (var b = 0; b < bodies.length; b++) {
  var dot = new THREE.Mesh(
    new THREE.SphereGeometry(Math.max(0.16, bodies[b].size * 8), 12, 10),
    new THREE.MeshBasicMaterial({ color: 0x8fb6d8 })
  );
  truthGroup.add(dot);
  marks.push(dot);

  var ring = [];
  for (var k = 0; k <= 96; k++) {
    var a = TWO_PI * k / 96;
    var ca = Math.cos(a), sa = Math.sin(a);
    ring.push(new THREE.Vector3(
      bodies[b].u[0] * ca + bodies[b].v[0] * sa,
      bodies[b].u[1] * ca + bodies[b].v[1] * sa,
      bodies[b].u[2] * ca + bodies[b].v[2] * sa
    ).multiplyScalar(bodies[b].radius * RADIUS));
  }
  truthGroup.add(new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(ring),
    new THREE.LineBasicMaterial({ color: 0x3f5570, transparent: true, opacity: 0.55 })
  ));
}

// The observer. Offset plus an up vector, axes re-derived from where it stands, so a drag means
// the same thing to the hand at every attitude and nothing inverts over the pole.
var target = new THREE.Vector3(0, 0, 0);
var offset = new THREE.Vector3(0, 6, 32);
var upVec = new THREE.Vector3(0, 1, 0);
var side = new THREE.Vector3();
function screenRight() {
  side.crossVectors(upVec, offset);
  if (side.lengthSq() < 1e-9) { side.set(1, 0, 0); }
  return side.normalize();
}

// ---------------------------------------------------------------------------------------------
// Where a body is at a moment. Circular orbits on Kepler periods, each tilted a little, matching
// the generator exactly. The page and the generator have to agree here or the curve the generator
// derived from will not be the curve the page draws.
// ---------------------------------------------------------------------------------------------

// Each body carries its own orbit plane as two vectors at right angles. This read a single tilt
// angle for a while after the generator had stopped writing one, and the failure was silent all the
// way down: sin(undefined) is NaN, the dot product is NaN, the table index is NaN, the table lookup
// returns undefined, the sum is NaN, and NaN paints black. Nothing threw. The page rendered a
// perfectly round black ball, which is a plausible picture of a boundary receiving nothing at all.
function bodyAt(body, moment) {
  var angle = body.phase + TWO_PI * moment / body.period;
  var here = Math.cos(angle);
  var there = Math.sin(angle);
  return new THREE.Vector3(
    body.u[0] * here + body.v[0] * there,
    body.u[1] * here + body.v[1] * there,
    body.u[2] * here + body.v[2] * there
  ).normalize();
}

// ---------------------------------------------------------------------------------------------
// The boundary, both ways.
//
// glow    every body is a source and its reach is the profile the generator computed for its own
//         radius. Sum over bodies at each boundary point. No shadow appears anywhere, since light
//         that has forgotten its direction cannot leave one behind.
//
// shadow  a beam comes from one side and a body blocks a disc of it. The edge is as sharp as the
//         body, and a body that emits nothing blocks exactly as well as one that does.
// ---------------------------------------------------------------------------------------------

var beam = new THREE.Vector3(1, 0.25, 0.4).normalize();

function fieldAt(point, moment, mode) {
  var i, body, spot, along, apart;
  if (mode === "glow") {
    var total = 0;
    for (i = 0; i < bodies.length; i++) {
      body = bodies[i];
      spot = bodyAt(body, moment);
      along = Math.max(-1, Math.min(1, spot.dot(point)));
      apart = Math.acos(along);
      var table = DATA.profiles[body.radius.toFixed(4)];
      var at = Math.round(apart / Math.PI * (table.length - 1));
      total += table[at] * body.brightness;
    }
    return total;
  }

  // Through-going. The probe crosses the ball and the boundary without much caring about either,
  // so what it carries out is the column of matter it passed through: the length of its chord that
  // lay inside a body, summed over the bodies. Any surface is opaque to a neutron most of the time
  // and to a neutrino almost never, and it is that almost that makes this readable. The attenuation
  // is small, so the deficit is close to proportional to the column, and a column is a line integral
  // through the interior rather than a picture of its surface.
  //
  // This is the one channel that shows every body at once instead of the nearest one, and the one
  // that has to be drawn through the boundary rather than on it.
  if (mode === "neutrino") {
    var reach = point.dot(beam);
    if (reach <= 0) { return 0; }
    var column = 0;
    for (i = 0; i < bodies.length; i++) {
      body = bodies[i];
      var seat = bodyAt(body, moment).multiplyScalar(body.radius);
      var offsetToSeat = seat.clone().sub(point);
      var alongChord = offsetToSeat.dot(beam);
      if (alongChord > 0 || alongChord < -2 * reach) { continue; }
      var away = offsetToSeat.clone().addScaledVector(beam, -alongChord).length();
      if (away < body.size) {
        column += 2 * Math.sqrt(body.size * body.size - away * away);
      }
    }
    return column;
  }

  // Ballistic. A point on the far side is lit unless a body sits on the line the beam took to
  // reach it. Nothing here is smoothed, which is the whole difference from the branch above.
  // The shadow falls on the side the beam leaves by, never the side it arrives at. Lighting the
  // arrival side puts every body downstream of the surface being drawn, so no body is ever between
  // the source and the point and the ball renders evenly lit with the shadow mode switched on.
  var lit = Math.max(0, point.dot(beam));
  if (lit <= 0) { return 0; }
  for (i = 0; i < bodies.length; i++) {
    body = bodies[i];
    spot = bodyAt(body, moment).multiplyScalar(body.radius);
    // Distance from the body's centre to the beam line through this boundary point.
    var toPoint = point.clone().multiplyScalar(1).sub(spot);
    var alongBeam = toPoint.dot(beam);
    var perp = toPoint.clone().addScaledVector(beam, -alongBeam).length();
    if (alongBeam > 0 && perp < body.size) {
      var soft = 1 - (perp / body.size) * (perp / body.size);
      lit *= Math.max(0, 1 - soft);
    }
  }
  return lit;
}

// Seeded from the first frame that is drawn and never from a guess. These were started at zero and
// one, and the field they have to track sits around four hundredths, so the range they reported was
// twenty times too wide, every reading normalised to nearly nothing, and the ball rendered flat
// black. A scale carried between frames has to be started from the data it is carrying.
var lowSeen = 0, highSeen = 1, seeded = false;

function paint(moment, mode) {
  var geometry = ball.geometry;
  var position = geometry.attributes.position;
  var count = position.count;
  if (!geometry.attributes.color) {
    geometry.setAttribute("color", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  }
  var colors = geometry.attributes.color;
  var scratch = new THREE.Vector3();
  var values = new Float32Array(count);
  var low = Infinity, high = -Infinity, i;

  for (i = 0; i < count; i++) {
    scratch.set(position.getX(i), position.getY(i), position.getZ(i)).normalize();
    var v = fieldAt(scratch, moment, mode);
    values[i] = v;
    if (v < low) { low = v; }
    if (v > high) { high = v; }
  }
  // The scale is carried between frames so a transit reads as the surface going dark. Rescaling to
  // the frame's own range every frame renormalises the dip away and the boundary looks unchanged
  // through the very event the page exists to show.
  // A guard, because the failure above cost an hour and left nothing on screen to read. NaN is the
  // one value that survives every arithmetic here and still paints, and what it paints is a clean
  // black ball that looks like an answer. Saying so once is cheaper than finding it twice.
  if (!(low === low) || !(high === high)) {
    if (!paint.warned) {
      console.error("boundary field is not a number: a body is missing something the page reads");
      paint.warned = true;
    }
    return;
  }
  if (!seeded) { lowSeen = low; highSeen = high; seeded = true; }
  lowSeen = lowSeen * 0.9 + low * 0.1;
  highSeen = highSeen * 0.9 + high * 0.1;
  var span = (highSeen - lowSeen) || 1;

  // Contrast is a curve on the value and never a scale on it. Raising the reading to a power pulls
  // the middle down and leaves both ends where they are, so the ball goes dark while exactly as
  // much light still arrives at the brightest place on it. Multiplying instead would dim the peak
  // along with everything else, which is a darker picture of nothing rather than the same picture
  // with the floor taken out from under it.
  // Black is the floor, because the surface is added to the view and never painted over it. A dark
  // grey floor would add a grey wash everywhere and put an opaque ball back on the screen by a
  // slower route. Nothing arriving has to contribute nothing.
  var dark = [0.0, 0.0, 0.0];
  var warm = [1.0, 0.63, 0.24];
  for (i = 0; i < count; i++) {
    var raw = Math.max(0, Math.min(1, (values[i] - lowSeen) / span));
    var t = Math.pow(raw, state.gamma);
    colors.setXYZ(i,
      dark[0] + (warm[0] - dark[0]) * t,
      dark[1] + (warm[1] - dark[1]) * t,
      dark[2] + (warm[2] - dark[2]) * t);
  }
  colors.needsUpdate = true;
}

// ---------------------------------------------------------------------------------------------
// Panels.
// ---------------------------------------------------------------------------------------------

function drawFound() {
  var html = "<tr><th>period</th><th>radius</th><th>built</th><th>off by</th></tr>";
  if (!DATA.found.length) {
    html += "<tr><td colspan=4 style='color:var(--faint)'>nothing stood above the noise</td></tr>";
  }
  for (var i = 0; i < DATA.found.length; i++) {
    var one = DATA.found[i];
    var built = bodies[one.nearest].radius;
    var close = one.off_by < 0.03;
    html += "<tr><td class='num'>" + one.period.toFixed(3) + "</td>" +
      "<td class='num'>" + one.radius.toFixed(3) + "</td>" +
      "<td class='num'>" + built.toFixed(3) + "</td>" +
      "<td class='" + (close ? "good" : "miss") + "'>" + one.off_by.toFixed(3) + "</td></tr>";
  }
  html += "<tr><td colspan=4 style='height:6px'></td></tr>";
  html += "<tr><td>bodies built</td><td class='num' colspan=3>" + bodies.length + "</td></tr>";
  html += "<tr><td>periods found</td><td class='num' colspan=3>" + DATA.found.length + "</td></tr>";
  document.getElementById("foundTable").innerHTML = html;
}

function drawCost() {
  var html = "<tr><th>scattering lengths</th><th>straight through</th></tr>";
  for (var i = 0; i < DATA.attenuation.length; i++) {
    html += "<tr><td class='num'>" + DATA.attenuation[i].lengths.toFixed(0) + "</td>" +
      "<td class='num'>" + DATA.attenuation[i].survives + "</td></tr>";
  }
  html += "<tr><td colspan=2 style='height:6px'></td></tr>";
  html += "<tr><td colspan=2 style='color:var(--faint); text-align:left; white-space:normal'>" +
    "A shadow is the part that went straight. Through a scattering ball that part is what is " +
    "left after the exponential above, and the source has to outshine the glow by that much " +
    "before an edge survives at all.</td></tr>";
  document.getElementById("costTable").innerHTML = html;
}

var curveCanvas = document.getElementById("curveCanvas");

function drawCurve(moment) {
  var pen = curveCanvas.getContext("2d");
  var wide = curveCanvas.width, high = curveCanvas.height;
  pen.clearRect(0, 0, wide, high);
  var style = getComputedStyle(document.body);
  var hot = style.getPropertyValue("--hot").trim();
  var faint = style.getPropertyValue("--faint").trim();

  var curve = DATA.curve;
  var low = Math.min.apply(null, curve), top = Math.max.apply(null, curve);
  var span = (top - low) || 1;

  pen.strokeStyle = faint; pen.globalAlpha = 0.3;
  pen.beginPath(); pen.moveTo(0, high - 4); pen.lineTo(wide, high - 4); pen.stroke();
  pen.globalAlpha = 1;

  pen.strokeStyle = hot; pen.lineWidth = 1.2;
  pen.beginPath();
  for (var i = 0; i < curve.length; i++) {
    var x = wide * i / (curve.length - 1);
    var y = high - 6 - (high - 14) * (curve[i] - low) / span;
    if (i === 0) { pen.moveTo(x, y); } else { pen.lineTo(x, y); }
  }
  pen.stroke();

  var at = wide * ((moment / DATA.span) % 1);
  pen.strokeStyle = faint; pen.globalAlpha = 0.8;
  pen.beginPath(); pen.moveTo(at, 2); pen.lineTo(at, high - 4); pen.stroke();
  pen.globalAlpha = 1;
}

// ---------------------------------------------------------------------------------------------
// Wiring.
// ---------------------------------------------------------------------------------------------

var state = { mode: DATA.mode, rate: 0.42, moment: 0, frozen: false, gamma: 2.6 };

document.getElementById("gamma").addEventListener("input", function (event) {
  state.gamma = Number(event.target.value) / 100;
  document.getElementById("gammaOut").textContent = state.gamma.toFixed(1);
});
document.getElementById("mode").value = DATA.mode;

document.getElementById("mode").addEventListener("change", function (event) {
  state.mode = event.target.value;
  seeded = false;

  // Each transport gets the drawing its own physics calls for. A through-going probe passes the
  // boundary as easily as it passed everything else, so its reading is added along the line of
  // sight through both faces. The other two leave at the surface, so theirs is drawn on the near
  // face with the far one behind it. Drawing all three the same way was the mistake that made the
  // glow look like a projection and the projection look like a painted ball.
  var through = state.mode === "neutrino";
  ball.material.side = through ? THREE.DoubleSide : THREE.FrontSide;
  ball.material.blending = through ? THREE.AdditiveBlending : THREE.NormalBlending;
  ball.material.depthWrite = !through;
  ball.material.needsUpdate = true;
});
document.getElementById("truth").addEventListener("change", function (event) {
  truthGroup.visible = event.target.value === "show";
});
document.getElementById("rate").addEventListener("input", function (event) {
  state.rate = Number(event.target.value) / 100;
  document.getElementById("rateOut").textContent = state.rate <= 0.005 ? "stopped" : "running";
});
document.getElementById("dist").addEventListener("input", function (event) {
  offset.setLength(RADIUS * Number(event.target.value) / 100);
  document.getElementById("distOut").textContent =
    (Number(event.target.value) / 100).toFixed(1) + " R";
});
document.getElementById("still").addEventListener("click", function () {
  state.frozen = !state.frozen;
  this.textContent = state.frozen ? "let the observer move" : "hold the observer still";
});

function movable(box) {
  var handle = box.querySelector("h4");
  var holding = false, fromX = 0, fromY = 0, wasX = 0, wasY = 0;
  handle.addEventListener("mousedown", function (event) {
    holding = true; fromX = event.clientX; fromY = event.clientY;
    var spot = box.getBoundingClientRect();
    wasX = spot.left; wasY = spot.top;
    box.style.right = "auto"; box.style.bottom = "auto";
    event.preventDefault();
  });
  window.addEventListener("mousemove", function (event) {
    if (!holding) { return; }
    box.style.left = (wasX + event.clientX - fromX) + "px";
    box.style.top = (wasY + event.clientY - fromY) + "px";
  });
  window.addEventListener("mouseup", function () { holding = false; });
}
var allBoxes = document.querySelectorAll(".box");
for (var q = 0; q < allBoxes.length; q++) { movable(allBoxes[q]); }

var dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener("mousedown", function (event) {
  dragging = true; lastX = event.clientX; lastY = event.clientY;
});
window.addEventListener("mouseup", function () { dragging = false; });
window.addEventListener("mousemove", function (event) {
  if (!dragging || state.frozen) { return; }
  var dx = event.clientX - lastX, dy = event.clientY - lastY;
  lastX = event.clientX; lastY = event.clientY;
  var right = screenRight().clone();
  offset.applyAxisAngle(upVec, -dx * 0.006);
  offset.applyAxisAngle(right, -dy * 0.006);
  upVec.applyAxisAngle(right, -dy * 0.006).normalize();
});
renderer.domElement.addEventListener("wheel", function (event) {
  event.preventDefault();
  var slider = document.getElementById("dist");
  slider.value = String(Math.max(115, Math.min(600,
    Number(slider.value) * (event.deltaY > 0 ? 1.06 : 0.94))));
  slider.dispatchEvent(new Event("input"));
}, { passive: false });

var ask = document.getElementById("ask");
var tile = document.getElementById("tile");
tile.innerHTML =
  "<p>A system of " + bodies.length + " bodies orbits inside the ball. You never see it: you see " +
  "the surface. <b>The interior is hidden by default</b> because it is the answer sheet the " +
  "recovery is being graded against.</p>" +
  "<p><b>Glow</b> is the scattering limit. Every body is a source and its depth sets how wide a " +
  "patch it can print, so a deep body is a broad warmth and a shallow one a small bright spot. " +
  "No shadow can exist here at all.</p>" +
  "<p><b>Shadow</b> is the clear limit. A beam from one side prints silhouettes with edges as " +
  "sharp as the bodies, and a body that emits nothing blocks just as well as one that blazes. " +
  "The two limits fail in opposite directions: one loses where, the other loses what.</p>" +
  "<p><b>The boundary never moves.</b> The bodies do, and that is the clock. Hold the observer " +
  "still and whatever keeps changing is time; whatever stops was you.</p>" +
  "<p>One patch watched over the whole run gives the curve below. Each crossing prints a dip, the " +
  "dips repeat on that body's period, and Kepler turns a period into a radius. The table compares " +
  "those radii against the ones the scene was built from, which the recovery never reads.</p>";
ask.addEventListener("mouseenter", function () { tile.hidden = false; });
tile.addEventListener("mouseleave", function () { tile.hidden = true; });
ask.addEventListener("mouseleave", function () {
  setTimeout(function () { if (!tile.matches(":hover")) { tile.hidden = true; } }, 220);
});

function fit() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", fit);
fit();

var opening = DATA.settings || {};
if (opening.theme) { document.documentElement.setAttribute("data-theme", opening.theme); }

drawFound();
drawCost();

var slowest = 0;
for (var s = 0; s < bodies.length; s++) { slowest = Math.max(slowest, bodies[s].period); }

function turn() {
  if (state.rate > 0.005) {
    state.moment += slowest * 0.004 * state.rate;
  }
  paint(state.moment, state.mode);
  for (var i = 0; i < bodies.length; i++) {
    marks[i].position.copy(bodyAt(bodies[i], state.moment)
      .multiplyScalar(bodies[i].radius * RADIUS));
  }
  drawCurve(state.moment);
  camera.position.copy(target).add(offset);
  camera.up.copy(upVec);
  camera.lookAt(target);
  renderer.render(scene, camera);
  requestAnimationFrame(turn);
}
turn();
</script>
