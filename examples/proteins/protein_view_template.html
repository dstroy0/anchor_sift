<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protein walk</title>
<style>
  :root {
    --bg: #0f1216; --surface: #161a20; --line: #262c35;
    --ink: #e6e9ee; --ink-dim: #9aa3af; --ink-mut: #6b7280;
    --deposit: #8a8f98; --accent: #f59e0b; --accent-hi: #fde68a; --good: #34d399;
  }
  :root:not([data-theme="dark"]) {
    @media (prefers-color-scheme: light) {
      --bg: #f7f8fa; --surface: #ffffff; --line: #e3e6ea;
      --ink: #1a1d22; --ink-dim: #4b5563; --ink-mut: #8a919c; --deposit: #b3b8c0;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --surface: #ffffff; --line: #e3e6ea;
    --ink: #1a1d22; --ink-dim: #4b5563; --ink-mut: #8a919c; --deposit: #b3b8c0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 16px 20px 10px; }
  .eyebrow { color: var(--ink-mut); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  h1 { margin: 2px 0 0; font-size: 19px; font-weight: 600; }
  main { flex: 1; display: flex; gap: 16px; padding: 8px 16px 16px; min-height: 0; }
  @media (max-width: 720px) { main { flex-direction: column; } }
  #stage { flex: 1; position: relative; background: var(--surface);
           border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 320px; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  aside { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  @media (max-width: 720px) { aside { width: auto; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-dim); }
  .stat { display: flex; justify-content: space-between; align-items: baseline; padding: 3px 0; }
  .stat .k { color: var(--ink-dim); }
  .stat .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .bars { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .bar { display: grid; grid-template-columns: 26px 1fr 48px; align-items: center; gap: 8px; }
  .bar .name { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .bar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .legend { display: flex; flex-direction: column; gap: 6px; }
  .ramp { height: 12px; border-radius: 6px;
          background: linear-gradient(90deg, var(--deposit), var(--accent), var(--accent-hi)); }
  .ramp-ends { display: flex; justify-content: space-between; color: var(--ink-mut); font-size: 12px;
               font-variant-numeric: tabular-nums; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button { background: var(--surface); color: var(--ink); border: 1px solid var(--line);
                   border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--ink-mut); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">Vector walk - deposit against rebuild</div>
  <h1 id="title">Protein walk</h1>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas></div>
  <aside>
    <div class="card">
      <h2>Controls</h2>
      <div class="controls">
        <select id="run"></select>
        <button id="spin" aria-pressed="true">Spin</button>
      </div>
      <div class="hint" style="margin-top:8px">Drag to turn. Scroll to zoom.</div>
      <div class="hint" style="margin-top:6px">
        <span class="swatch" style="background:var(--deposit)"></span>deposit
        <span class="swatch" style="background:var(--accent);margin-left:10px"></span>rebuilt
      </div>
    </div>
    <div class="card">
      <h2>This chain</h2>
      <div class="stat"><span class="k">atoms</span><span class="v" id="s-atoms">-</span></div>
      <div class="stat"><span class="k">RMSD</span><span class="v" id="s-rmsd">-</span></div>
      <div class="stat"><span class="k">median gap</span><span class="v" id="s-median">-</span></div>
      <div class="stat"><span class="k">worst gap</span><span class="v" id="s-worst">-</span></div>
      <div class="legend" style="margin-top:10px">
        <div class="ramp"></div>
        <div class="ramp-ends"><span>0 A</span><span id="s-rampmax">-</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Disagreement by constituent</h2>
      <div class="bars" id="constituent"></div>
      <div class="hint" style="margin-top:8px">mean gap per backbone atom, over every chain</div>
    </div>
    <div class="card">
      <h2>Whole deposit</h2>
      <div class="stat"><span class="k">chains</span><span class="v" id="w-runs">-</span></div>
      <div class="stat"><span class="k">atoms</span><span class="v" id="w-atoms">-</span></div>
      <div class="stat"><span class="k">RMSD</span><span class="v" id="w-rmsd">-</span></div>
    </div>
  </aside>
</main>
<script>
const DATA = /*PROTEIN_DATA*/null;

function css(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function lerp(a,b,t){ return a+(b-a)*t; }
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
// Sequential ramp within one accent family: low gap sits near the deposit ink, high gap is bright.
function rampColor(t){
  const lo=hexToRgb(css('--deposit')), mid=hexToRgb(css('--accent')), hi=hexToRgb(css('--accent-hi'));
  let a,b,u;
  if(t<0.5){ a=lo; b=mid; u=t/0.5; } else { a=mid; b=hi; u=(t-0.5)/0.5; }
  return `rgb(${Math.round(lerp(a[0],b[0],u))},${Math.round(lerp(a[1],b[1],u))},${Math.round(lerp(a[2],b[2],u))})`;
}

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let yaw=0.5, pitch=-0.35, zoom=1, spinning=true, current=0;
let dpr = Math.min(window.devicePixelRatio||1, 2);

function fit(){
  const r = cv.parentElement.getBoundingClientRect();
  cv.width = Math.max(1, r.width*dpr); cv.height = Math.max(1, r.height*dpr);
}

function centerScale(run){
  const p = run.deposit;
  let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(const q of p) for(let i=0;i<3;i++){ mn[i]=Math.min(mn[i],q[i]); mx[i]=Math.max(mx[i],q[i]); }
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];
  const span=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2])||1;
  return {c, span};
}

function project(pt, c, base){
  const x=pt[0]-c[0], y=pt[1]-c[1], z=pt[2]-c[2];
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  let X=cy*x+sy*z, Z=-sy*x+cy*z;
  let Y=cp*y-sp*Z; Z=sp*y+cp*Z;
  const persp = 1/(1 - Z*0.0018*base);
  const s = base*zoom*persp;
  return [cv.width/2 + X*s/ (0.5) *0.5, cv.height/2 - Y*s/(0.5)*0.5, Z];
}

function drawLine(pts, colorAt, width){
  for(let i=1;i<pts.length;i++){
    ctx.beginPath();
    ctx.moveTo(pts[i-1][0], pts[i-1][1]);
    ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = colorAt(i);
    ctx.lineWidth = width*dpr;
    ctx.lineCap='round';
    ctx.stroke();
  }
}

function render(){
  const run = DATA.runs[current];
  fit();
  ctx.clearRect(0,0,cv.width,cv.height);
  const {c, span} = centerScale(run);
  const base = Math.min(cv.width, cv.height)/span * 0.42;
  const dep = run.deposit.map(p=>project(p,c,base));
  const reb = run.rebuilt.map(p=>project(p,c,base));
  const maxGap = Math.max(1e-6, ...run.gap);
  // deposit first, as recessive reference
  drawLine(dep, ()=>css('--deposit'), 1.4);
  // rebuilt over it, each segment colored by the gap it carries
  drawLine(reb, (i)=> rampColor(Math.min(1,(run.gap[i]+run.gap[i-1])/2/maxGap)), 2.2);
  document.getElementById('s-rampmax').textContent = maxGap.toFixed(2)+' A';
}

function loop(){
  if(spinning){ yaw += 0.006; }
  render();
  requestAnimationFrame(loop);
}

function fillStats(){
  const run = DATA.runs[current];
  const g = run.gap;
  const sorted=[...g].sort((a,b)=>a-b);
  const median = sorted[Math.floor(sorted.length/2)];
  const rmsd = Math.sqrt(g.reduce((s,v)=>s+v*v,0)/g.length);
  document.getElementById('s-atoms').textContent = run.atoms;
  document.getElementById('s-rmsd').textContent = rmsd.toFixed(3)+' A';
  document.getElementById('s-median').textContent = median.toFixed(3)+' A';
  document.getElementById('s-worst').textContent = Math.max(...g).toFixed(3)+' A';
}

function fillGlobal(){
  const s = DATA.summary;
  document.getElementById('w-runs').textContent = s.runs;
  document.getElementById('w-atoms').textContent = s.atoms;
  document.getElementById('w-rmsd').textContent = s.rmsd.toFixed(3)+' A';
  const cst = s.constituent;
  const worst = Math.max(cst.N, cst.CA, cst.C, 1e-6);
  const host = document.getElementById('constituent');
  host.innerHTML='';
  for(const name of ['N','CA','C']){
    const row=document.createElement('div'); row.className='bar';
    row.innerHTML = `<span class="name">${name}</span><span class="track"><span class="fill" style="width:${(cst[name]/worst*100).toFixed(0)}%"></span></span><span class="num">${cst[name].toFixed(3)}</span>`;
    host.appendChild(row);
  }
}

function init(){
  document.getElementById('title').textContent = DATA.title;
  const sel = document.getElementById('run');
  DATA.runs.forEach((r,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`chain ${i+1} (${r.atoms} atoms)`; sel.appendChild(o); });
  sel.addEventListener('change', ()=>{ current=+sel.value; fillStats(); });
  const spin=document.getElementById('spin');
  spin.addEventListener('click', ()=>{ spinning=!spinning; spin.setAttribute('aria-pressed', spinning); });
  let dragging=false, lx=0, ly=0;
  cv.addEventListener('pointerdown', e=>{ dragging=true; spinning=false; document.getElementById('spin').setAttribute('aria-pressed', false); lx=e.clientX; ly=e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e=>{ if(!dragging) return; yaw += (e.clientX-lx)*0.01; pitch += (e.clientY-ly)*0.01; pitch=Math.max(-1.5,Math.min(1.5,pitch)); lx=e.clientX; ly=e.clientY; });
  cv.addEventListener('pointerup', ()=>{ dragging=false; });
  cv.addEventListener('wheel', e=>{ e.preventDefault(); zoom *= e.deltaY<0?1.08:0.93; zoom=Math.max(0.2,Math.min(6,zoom)); }, {passive:false});
  window.addEventListener('resize', fit);
  fillStats(); fillGlobal(); fit(); loop();
}
init();
</script>
</body>
</html>
