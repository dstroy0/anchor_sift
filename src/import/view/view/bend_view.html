<meta charset="utf-8" />
<title>Bend View</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --ink: #16181d;
    --dim: #5d6470;
    --faint: #949cab;
    --ground: #e9ebee;
    --panel: #f8f9fa;
    --edge: #ccd1d9;
    --hot: #d8541f;
    --cool: #2c6f9b;
    --null: #9aa3b0;
    --band: rgba(120, 128, 140, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e6e9ee;
      --dim: #99a1ae;
      --faint: #626a78;
      --ground: #0f1115;
      --panel: #181b21;
      --edge: #2c313a;
      --hot: #ff7a3d;
      --cool: #4aa3d8;
      --null: #565e6c;
      --band: rgba(150, 158, 170, 0.14);
    }
  }
  :root[data-theme="dark"] {
    --ink: #e6e9ee;
    --dim: #99a1ae;
    --faint: #626a78;
    --ground: #0f1115;
    --panel: #181b21;
    --edge: #2c313a;
    --hot: #ff7a3d;
    --cool: #4aa3d8;
    --null: #565e6c;
    --band: rgba(150, 158, 170, 0.14);
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font:
      12px/1.5 "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
  }
  .box {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 9px 11px 10px;
    opacity: 0.95;
    box-shadow: 0 2px 14px rgba(0, 0, 0, 0.18);
    user-select: none;
  }
  .box h4 {
    margin: 0 0 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: move;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 4px 0;
  }
  .row label {
    flex: 0 0 74px;
    color: var(--dim);
    font-size: 11px;
  }
  .row input[type="range"] {
    flex: 1;
    min-width: 80px;
    height: 3px;
    accent-color: var(--hot);
  }
  .row .val {
    flex: 0 0 58px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  select,
  button {
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 2px 6px;
    font: inherit;
    font-size: 11px;
  }
  button {
    cursor: pointer;
  }
  button:focus-visible,
  select:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--hot);
    outline-offset: 1px;
  }
  table {
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    width: 100%;
  }
  td {
    padding: 1px 0;
  }
  td:last-child {
    text-align: right;
    color: var(--ink);
  }
  td:first-child {
    color: var(--dim);
  }
  .ok {
    color: #3a9d5d;
  }
  .bad {
    color: var(--hot);
    font-weight: 600;
  }
  .key {
    display: inline-block;
    width: 14px;
    height: 2px;
    vertical-align: 3px;
    margin-right: 3px;
  }
</style>

<div id="stage"></div>

<div class="box" id="clockBox" style="left: 14px; top: 14px; width: 290px">
  <h4>Clock</h4>
  <div class="row">
    <label>round</label>
    <input
      type="range"
      id="clock"
      min="0"
      max="6300"
      value="0"
      aria-label="round clock"
    />
    <span class="val" id="clockOut">1.00</span>
  </div>
  <div class="row">
    <label>sweep</label>
    <button id="play" type="button">pause</button>
    <input
      type="range"
      id="speed"
      min="5"
      max="400"
      value="60"
      aria-label="sweep speed"
    />
    <span class="val" id="speedOut">0.60 r/s</span>
  </div>
  <div class="row">
    <label>transition</label>
    <select id="mode" aria-label="transition">
      <option value="bend">bend</option>
      <option value="fade">fade</option>
    </select>
  </div>
  <div class="row">
    <label>scale</label>
    <select id="scale" aria-label="scale">
      <option value="transition">per transition</option>
      <option value="frame">per frame</option>
      <option value="global">whole run</option>
    </select>
  </div>
  <div class="row">
    <label>relief</label>
    <input
      type="range"
      id="relief"
      min="0"
      max="100"
      value="38"
      aria-label="relief"
    />
    <span class="val" id="reliefOut">0.38</span>
  </div>
  <table id="readout" style="margin-top: 6px"></table>
</div>

<div class="box" id="chartBox" style="right: 14px; bottom: 14px; width: 420px">
  <h4>Bend angle between rounds</h4>
  <canvas id="chart" width="396" height="176"></canvas>
  <div
    style="
      font-size: 10.5px;
      color: var(--dim);
      margin-top: 4px;
      line-height: 1.7;
    "
  >
    <span class="key" style="background: var(--hot)"></span>same seed &nbsp;
    <span class="key" style="background: var(--cool)"></span>cross seed &nbsp;
    <span class="key" style="background: var(--null)"></span>repeat &nbsp;
    <span
      class="key"
      style="background: var(--band); height: 8px; vertical-align: -1px"
    ></span
    >fair bits, drawn
  </div>
</div>

<div class="box" id="checkBox" style="right: 14px; top: 14px; width: 260px">
  <h4>Page against generator</h4>
  <table id="checks"></table>
</div>

        0.0008434829821082447, 0.0006061708689563242, -0.002054120032691554,
        -0.0004592206863559671, 0.00024331789087038818, 0.0013059437095898196,
        -0.0003096748420317313, 0.00019401531596314203, 0.00044944549747484753,
        -0.0002770316917555648, 0.0014054989428750105, -0.0003249830419830935,
        0.00032196852969596326, -0.0072649096918574905, -0.000529609261552909,
        -0.009379946728255728, 0.000541436122757394, 0.005790760194098483,
        0.005316553157066126, -0.01627372472400646, -0.0017049088332904343,
        0.006300473042726864, -1.716350471029265e-5, 0.000491805501208328,
        0.0006897289050819469, 0.0005392489356586768, -0.0021974192360223427,
        -0.00016744447230822033, -0.00037138121697535527,
        -0.0003727875129357914, -0.0003710839097874837,
      ],
    },
    settings: {},
  };

  // -------------------------------------------------------------------------------------------------
  // Nothing here measures. The coefficients of every round came out of the generator, and so did the
  // three curves and the band. What the page does is move between rounds: it computes the field at
  // the clock's instant from the two rounds either side, and draws it as a surface. That arithmetic
  // is graded against the generator's own references on load, and the panel says whether it agrees.
  // -------------------------------------------------------------------------------------------------

  var FOUR_PI = 4 * Math.PI;
  var TOP = DATA.degrees;
  var COUNT = (TOP + 1) * (TOP + 1);
  var ROUNDS = DATA.rounds;
  var RADIUS = 10;

  function legendreColumn(top, order, x) {
    var out = new Float64Array(top + 1);
    var sine = Math.sqrt(Math.max(0, 1 - x * x));
    var value = Math.sqrt(1 / FOUR_PI);
    for (var step = 1; step <= order; step++) {
      value *= Math.sqrt((2 * step + 1) / (2 * step)) * sine;
    }
    if (order <= top) {
      out[order] = value;
    }
    if (order + 1 <= top) {
      out[order + 1] = Math.sqrt(2 * order + 3) * x * value;
    }
    for (var degree = order + 2; degree <= top; degree++) {
      var lead = Math.sqrt(
        (4 * degree * degree - 1) / (degree * degree - order * order),
      );
      var trail = Math.sqrt(
        ((degree - 1) * (degree - 1) - order * order) /
          (4 * (degree - 1) * (degree - 1) - 1),
      );
      out[degree] = lead * (x * out[degree - 1] - trail * out[degree - 2]);
    }
    return out;
  }

  // Every real harmonic at one direction, flat, in the storage order sphere_field uses: degree d
  // starts at d*d, order zero sits at d*d + d, cosine orders above it and sine orders below.
  function harmonicsAt(top, colatitude, longitude) {
    var out = new Float64Array((top + 1) * (top + 1));
    var x = Math.cos(colatitude);
    var rootTwo = Math.SQRT2;
    for (var order = 0; order <= top; order++) {
      var column = legendreColumn(top, order, x);
      if (order === 0) {
        for (var d0 = 0; d0 <= top; d0++) {
          out[d0 * d0 + d0] = column[d0];
        }
        continue;
      }
      var cosine = Math.cos(order * longitude) * rootTwo;
      var sine = Math.sin(order * longitude) * rootTwo;
      for (var degree = order; degree <= top; degree++) {
        out[degree * degree + degree + order] = column[degree] * cosine;
        out[degree * degree + degree - order] = column[degree] * sine;
      }
    }
    return out;
  }

  // The same bend the generator uses, including its one-dimensional case.
  function slerp(first, second, fraction) {
    var size = first.length,
      i;
    var out = new Float64Array(size);
    if (size === 1) {
      out[0] = first[0] + (second[0] - first[0]) * fraction;
      return out;
    }
    var lengthFirst = 0,
      lengthSecond = 0;
    for (i = 0; i < size; i++) {
      lengthFirst += first[i] * first[i];
      lengthSecond += second[i] * second[i];
    }
    lengthFirst = Math.sqrt(lengthFirst);
    lengthSecond = Math.sqrt(lengthSecond);
    if (lengthFirst === 0 || lengthSecond === 0) {
      for (i = 0; i < size; i++) {
        out[i] = first[i] + (second[i] - first[i]) * fraction;
      }
      return out;
    }
    var dot = 0;
    for (i = 0; i < size; i++) {
      dot += (first[i] / lengthFirst) * (second[i] / lengthSecond);
    }
    var omega = Math.acos(Math.max(-1, Math.min(1, dot)));
    var length =
      Math.pow(lengthFirst, 1 - fraction) * Math.pow(lengthSecond, fraction);
    var sinOmega = Math.sin(omega);
    for (i = 0; i < size; i++) {
      var unitFirst = first[i] / lengthFirst,
        unitSecond = second[i] / lengthSecond;
      if (sinOmega === 0) {
        out[i] = (unitFirst + (unitSecond - unitFirst) * fraction) * length;
      } else {
        out[i] =
          ((Math.sin((1 - fraction) * omega) / sinOmega) * unitFirst +
            (Math.sin(fraction * omega) / sinOmega) * unitSecond) *
          length;
      }
    }
    return out;
  }

  function fieldAtInstant(clock, mode) {
    var index = Math.floor(clock);
    var fraction = clock - index;
    if (index >= ROUNDS - 1) {
      index = ROUNDS - 2;
      fraction = 1;
    }
    var first = DATA.fields[index],
      second = DATA.fields[index + 1];
    var out = new Float64Array(COUNT);
    for (var degree = 0; degree <= TOP; degree++) {
      var low = degree * degree,
        high = low + 2 * degree + 1;
      if (mode === "bend") {
        var bent = slerp(
          first.slice(low, high),
          second.slice(low, high),
          fraction,
        );
        for (var k = 0; k < bent.length; k++) {
          out[low + k] = bent[k];
        }
      } else {
        for (var j = low; j < high; j++) {
          out[j] = first[j] + (second[j] - first[j]) * fraction;
        }
      }
    }
    return { coefficients: out, index: index, fraction: fraction };
  }

  // -------------------------------------------------------------------------------------------------
  // The page grades itself before it draws. A basis with the wrong normalization, or a bend that
  // differs from the generator's, still draws a smooth surface; only a number can tell.
  // -------------------------------------------------------------------------------------------------

  var CHECK = { field: 0, halfway: 0, ok: false };
  (function selfCheck() {
    var reference = DATA.reference;
    var coefficients = DATA.fields[reference.round];
    var worstField = 0,
      scaleField = 0;
    for (var p = 0; p < reference.directions.length; p++) {
      var basis = harmonicsAt(
        TOP,
        reference.directions[p][0],
        reference.directions[p][1],
      );
      var total = 0;
      for (var c = 0; c < COUNT; c++) {
        total += coefficients[c] * basis[c];
      }
      worstField = Math.max(worstField, Math.abs(total - reference.fields[p]));
      scaleField = Math.max(scaleField, Math.abs(reference.fields[p]));
    }
    var bent = fieldAtInstant(0.5, "bend").coefficients;
    var worstHalf = 0,
      scaleHalf = 0;
    for (var h = 0; h < COUNT; h++) {
      worstHalf = Math.max(worstHalf, Math.abs(bent[h] - reference.halfway[h]));
      scaleHalf = Math.max(scaleHalf, Math.abs(reference.halfway[h]));
    }
    CHECK.field = worstField / (scaleField || 1);
    CHECK.halfway = worstHalf / (scaleHalf || 1);
    // The coefficients cross into the page rounded to nine places, agreement is bounded by that
    // rounding and not by a number chosen here.
    var bound = 1e-9 * COUNT;
    CHECK.ok = CHECK.field <= bound && CHECK.halfway <= bound;
    CHECK.bound = bound;
  })();

  // -------------------------------------------------------------------------------------------------
  // The surface.
  // -------------------------------------------------------------------------------------------------

  var stage = document.getElementById("stage");
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  stage.appendChild(renderer.domElement);

  // Light that shows relief without burning it out. The first version used a glossy metal and a
  // strong key light, and the specular spot was a white disc larger than any feature on the surface.
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  var keyLight = new THREE.DirectionalLight(0xffffff, 0.62);
  keyLight.position.set(18, 24, 30);
  scene.add(keyLight);
  var rimLight = new THREE.DirectionalLight(0x9fb8ff, 0.28);
  rimLight.position.set(-26, -10, -18);
  scene.add(rimLight);

  var geometry = new THREE.SphereGeometry(RADIUS, 144, 72);
  var material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.78,
    metalness: 0.18,
  });
  var body = new THREE.Mesh(geometry, material);
  scene.add(body);

  var positions = geometry.attributes.position;
  var VERTICES = positions.count;
  var unit = new Float32Array(VERTICES * 3);
  // Degree zero is only the size, so the shape uses every coefficient above it.
  var SHAPE = COUNT - 1;
  var basisTable = new Float32Array(VERTICES * SHAPE);
  (function buildBasis() {
    for (var v = 0; v < VERTICES; v++) {
      var px = positions.getX(v),
        py = positions.getY(v),
        pz = positions.getZ(v);
      var length = Math.sqrt(px * px + py * py + pz * pz) || 1;
      unit[v * 3] = px / length;
      unit[v * 3 + 1] = py / length;
      unit[v * 3 + 2] = pz / length;
      var colatitude = Math.acos(Math.max(-1, Math.min(1, py / length)));
      var longitude = Math.atan2(pz, px);
      var basis = harmonicsAt(TOP, colatitude, longitude);
      for (var c = 1; c < COUNT; c++) {
        basisTable[v * SHAPE + c - 1] = basis[c];
      }
    }
  })();
  geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(new Float32Array(VERTICES * 3), 3),
  );

  var values = new Float32Array(VERTICES);
  function synthesize(coefficients) {
    var peak = 0;
    for (var v = 0; v < VERTICES; v++) {
      var total = 0,
        row = v * SHAPE;
      for (var c = 0; c < SHAPE; c++) {
        total += coefficients[c + 1] * basisTable[row + c];
      }
      values[v] = total;
      var magnitude = total < 0 ? -total : total;
      if (magnitude > peak) {
        peak = magnitude;
      }
    }
    return peak;
  }

  // The size of each round's shape, used to hold the scale still across a transition, a fade
  // visibly loses relief in the middle while a bend does not.
  var ROUND_PEAK = new Float64Array(ROUNDS);
  var GLOBAL_PEAK = 0;
  for (var round = 0; round < ROUNDS; round++) {
    ROUND_PEAK[round] = synthesize(DATA.fields[round]);
    GLOBAL_PEAK = Math.max(GLOBAL_PEAK, ROUND_PEAK[round]);
  }

  function shade(t) {
    // Cool below, the ground at zero, hot above. The square root lifts small departures into view;
    // the relief already carries magnitude, so color only has to carry sign and rough size.
    var cool = [0.12, 0.42, 0.72],
      mid = [0.62, 0.64, 0.68],
      hot = [0.92, 0.36, 0.1];
    var a, b, f;
    if (t < 0) {
      a = mid;
      b = cool;
      f = Math.min(1, Math.sqrt(-t));
    } else {
      a = mid;
      b = hot;
      f = Math.min(1, Math.sqrt(t));
    }
    return [
      a[0] + (b[0] - a[0]) * f,
      a[1] + (b[1] - a[1]) * f,
      a[2] + (b[2] - a[2]) * f,
    ];
  }

  function power(coefficients) {
    var total = 0;
    for (var c = 1; c < COUNT; c++) {
      total += coefficients[c] * coefficients[c];
    }
    return Math.sqrt(total);
  }

  var state = {
    clock: 0,
    playing: true,
    speed: 0.6,
    mode: "bend",
    scale: "transition",
    relief: 0.38,
  };
  var shown = { index: 0, fraction: 0, keptBend: 1, keptFade: 1, peak: 0 };

  function redraw() {
    var instant = fieldAtInstant(state.clock, state.mode);
    var peak = synthesize(instant.coefficients);
    var scale;
    if (state.scale === "frame") {
      scale = peak;
    } else if (state.scale === "global") {
      scale = GLOBAL_PEAK;
    } else {
      scale = Math.max(
        ROUND_PEAK[instant.index],
        ROUND_PEAK[instant.index + 1],
      );
    }
    scale = scale || 1;

    var colors = geometry.attributes.color;
    for (var v = 0; v < VERTICES; v++) {
      var t = values[v] / scale;
      var radius = RADIUS * (1 + state.relief * t);
      positions.setXYZ(
        v,
        unit[v * 3] * radius,
        unit[v * 3 + 1] * radius,
        unit[v * 3 + 2] * radius,
      );
      var rgb = shade(t);
      colors.setXYZ(v, rgb[0], rgb[1], rgb[2]);
    }
    positions.needsUpdate = true;
    colors.needsUpdate = true;
    geometry.computeVertexNormals();

    shown.index = instant.index;
    shown.fraction = instant.fraction;
    shown.peak = peak;
    var kept = reliefKept(instant.index, instant.fraction);
    shown.keptBend = kept.bend;
    shown.keptFade = kept.fade;
  }

  // How much relief the instant keeps, for both transitions, against what the two ends set.
  //
  // THE REFERENCE IS EACH DEGREE'S GEOMETRIC MEAN OF ITS TWO END NORMS, not a straight line between
  // the two rounds' total sizes. The first readout used the straight line, and it read 0.844 in bend
  // mode between rounds 1 and 2 with no collapse at all: the bend moves each degree's norm
  // geometrically, which sits under a straight line whenever the ends differ in size, and rounds 1 and
  // 2 differ a lot. Against the geometric reference the bend reads one by construction, so what the
  // fade reads beside it is the collapse and nothing else.
  function reliefKept(index, fraction) {
    var first = DATA.fields[index],
      second = DATA.fields[index + 1];
    var reference = 0,
      faded = 0;
    for (var degree = 1; degree <= TOP; degree++) {
      var low = degree * degree,
        high = low + 2 * degree + 1;
      var normFirst = 0,
        normSecond = 0,
        normFade = 0;
      for (var j = low; j < high; j++) {
        normFirst += first[j] * first[j];
        normSecond += second[j] * second[j];
        var mixed = first[j] + (second[j] - first[j]) * fraction;
        normFade += mixed * mixed;
      }
      var expected =
        Math.pow(Math.sqrt(normFirst), 1 - fraction) *
        Math.pow(Math.sqrt(normSecond), fraction);
      reference += expected * expected;
      faded += normFade;
    }
    var bent = power(fieldAtInstant(index + fraction, "bend").coefficients);
    reference = Math.sqrt(reference);
    return {
      bend: reference > 0 ? bent / reference : 1,
      fade: reference > 0 ? Math.sqrt(faded) / reference : 1,
    };
  }

  // -------------------------------------------------------------------------------------------------
  // Panels.
  // -------------------------------------------------------------------------------------------------

  function roundLabel(index) {
    return index === null || index === undefined
      ? "none"
      : "round " + (index + 1);
  }

  function drawReadout() {
    var angle = DATA.same[shown.index];
    var rows = [
      ["round", (state.clock + 1).toFixed(2)],
      ["transition", shown.index + 1 + " to " + (shown.index + 2)],
      [
        "bend angle, same seed",
        angle === null ? "no length" : angle.toFixed(2) + "°",
      ],
      ["relief kept, bend", shown.keptBend.toFixed(3)],
      ["relief kept, fade", shown.keptFade.toFixed(3)],
      ["", ""],
      ["carries through, same", roundLabel(DATA.carry.same)],
      ["carries through, cross", roundLabel(DATA.carry.cross)],
      ["reproduces through", roundLabel(DATA.carry.repeat)],
      [
        "fair band",
        DATA.band.low.toFixed(1) + " to " + DATA.band.high.toFixed(1) + "°",
      ],
      ["samples per seed", DATA.samples],
    ];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      if (!rows[i][0]) {
        html += "<tr><td colspan=2 style='height:4px'></td></tr>";
        continue;
      }
      html += "<tr><td>" + rows[i][0] + "</td><td>" + rows[i][1] + "</td></tr>";
    }
    document.getElementById("readout").innerHTML = html;
  }

  function drawChecks() {
    var rows = [
      ["field at 5 directions", CHECK.field.toExponential(1)],
      ["bend halfway, round 1 to 2", CHECK.halfway.toExponential(1)],
      ["bound from 9 place rounding", CHECK.bound.toExponential(1)],
      [
        "verdict",
        CHECK.ok
          ? "<span class='ok'>agrees</span>"
          : "<span class='bad'>DISAGREES</span>",
      ],
    ];
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      html += "<tr><td>" + rows[i][0] + "</td><td>" + rows[i][1] + "</td></tr>";
    }
    document.getElementById("checks").innerHTML = html;
  }

  var chart = document.getElementById("chart");
  var pen = chart.getContext("2d");
  function drawChart() {
    var wide = chart.width,
      high = chart.height;
    var left = 30,
      right = 8,
      top = 8,
      bottom = 18;
    pen.clearRect(0, 0, wide, high);
    var style = getComputedStyle(document.documentElement);
    var ink = style.getPropertyValue("--faint").trim();
    var hot = style.getPropertyValue("--hot").trim();
    var cool = style.getPropertyValue("--cool").trim();
    var nul = style.getPropertyValue("--null").trim();
    var band = style.getPropertyValue("--band").trim();

    function x(round) {
      return left + ((wide - left - right) * (round - 1)) / (ROUNDS - 1);
    }
    function y(angle) {
      return top + (high - top - bottom) * (1 - angle / 180);
    }

    pen.fillStyle = band;
    pen.fillRect(
      left,
      y(DATA.band.high),
      wide - left - right,
      y(DATA.band.low) - y(DATA.band.high),
    );

    pen.strokeStyle = ink;
    pen.globalAlpha = 0.5;
    pen.lineWidth = 1;
    pen.beginPath();
    pen.moveTo(left, y(0));
    pen.lineTo(wide - right, y(0));
    pen.stroke();
    pen.globalAlpha = 1;
    pen.fillStyle = ink;
    pen.font = "9px system-ui, sans-serif";
    [0, 90, 180].forEach(function (a) {
      pen.fillText(a + "°", 2, y(a) + 3);
    });
    [1, 16, 32, 48, 64].forEach(function (r) {
      pen.fillText(String(r), x(r) - 4, high - 5);
    });

    function trace(series, offset, colour, dashed) {
      pen.strokeStyle = colour;
      pen.lineWidth = 1.4;
      pen.setLineDash(dashed ? [3, 3] : []);
      pen.beginPath();
      var started = false;
      for (var i = 0; i < series.length; i++) {
        if (series[i] === null) {
          started = false;
          continue;
        }
        var px = x(i + 1 + offset),
          py = y(series[i]);
        if (!started) {
          pen.moveTo(px, py);
          started = true;
        } else {
          pen.lineTo(px, py);
        }
      }
      pen.stroke();
      pen.setLineDash([]);
    }
    // A transition between rounds i and i + 1 is drawn halfway between them; a repeat sits on its round.
    trace(DATA.repeat, 0, nul, true);
    trace(DATA.cross, 0.5, cool, false);
    trace(DATA.same, 0.5, hot, false);

    if (DATA.carry.same !== null) {
      pen.strokeStyle = hot;
      pen.globalAlpha = 0.45;
      pen.setLineDash([2, 3]);
      pen.beginPath();
      pen.moveTo(x(DATA.carry.same + 1.5), top);
      pen.lineTo(x(DATA.carry.same + 1.5), high - bottom);
      pen.stroke();
      pen.setLineDash([]);
      pen.globalAlpha = 1;
    }
    pen.strokeStyle = style.getPropertyValue("--ink").trim();
    pen.lineWidth = 1;
    pen.beginPath();
    pen.moveTo(x(state.clock + 1), top);
    pen.lineTo(x(state.clock + 1), high - bottom);
    pen.stroke();
  }

  // -------------------------------------------------------------------------------------------------
  // Controls.
  // -------------------------------------------------------------------------------------------------

  var clockInput = document.getElementById("clock");
  clockInput.max = String((ROUNDS - 1) * 100);
  clockInput.addEventListener("input", function () {
    state.clock = Number(clockInput.value) / 100;
    state.playing = false;
    document.getElementById("play").textContent = "sweep";
  });
  document.getElementById("play").addEventListener("click", function () {
    state.playing = !state.playing;
    this.textContent = state.playing ? "pause" : "sweep";
  });
  document.getElementById("speed").addEventListener("input", function () {
    state.speed = Number(this.value) / 100;
    document.getElementById("speedOut").textContent =
      state.speed.toFixed(2) + " r/s";
  });
  document.getElementById("mode").addEventListener("change", function () {
    state.mode = this.value;
  });
  document.getElementById("scale").addEventListener("change", function () {
    state.scale = this.value;
  });
  document.getElementById("relief").addEventListener("input", function () {
    state.relief = Number(this.value) / 100;
    document.getElementById("reliefOut").textContent = state.relief.toFixed(2);
  });

  var offset = new THREE.Vector3(0, 6, 36);
  var upVector = new THREE.Vector3(0, 1, 0);
  var dragging = false,
    lastX = 0,
    lastY = 0;
  renderer.domElement.addEventListener("mousedown", function (event) {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
  });
  window.addEventListener("mouseup", function () {
    dragging = false;
  });
  window.addEventListener("mousemove", function (event) {
    if (!dragging) {
      return;
    }
    var dx = event.clientX - lastX,
      dy = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    var side = new THREE.Vector3().crossVectors(upVector, offset).normalize();
    offset.applyAxisAngle(upVector, -dx * 0.006);
    offset.applyAxisAngle(side, -dy * 0.006);
    upVector.applyAxisAngle(side, -dy * 0.006).normalize();
  });
  renderer.domElement.addEventListener(
    "wheel",
    function (event) {
      event.preventDefault();
      offset.setLength(
        Math.max(
          14,
          Math.min(120, offset.length() * (event.deltaY > 0 ? 1.07 : 0.93)),
        ),
      );
    },
    { passive: false },
  );

  function fit() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", fit);
  fit();

  var opening = DATA.settings || {};
  if (opening.theme) {
    document.documentElement.setAttribute("data-theme", opening.theme);
  }
  if (typeof opening.step === "number" && opening.step > 0) {
    state.clock = Math.min(ROUNDS - 1, opening.step);
    state.playing = false;
    document.getElementById("play").textContent = "sweep";
  }

  drawChecks();

  var lastTime = null;
  function turn(now) {
    if (lastTime === null) {
      lastTime = now;
    }
    var seconds = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;
    if (state.playing) {
      state.clock += state.speed * seconds;
      if (state.clock > ROUNDS - 1) {
        state.clock = 0;
      }
      clockInput.value = String(Math.round(state.clock * 100));
    }
    document.getElementById("clockOut").textContent = (state.clock + 1).toFixed(
      2,
    );
    redraw();
    drawReadout();
    drawChart();
    camera.position.copy(offset);
    camera.up.copy(upVector);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(guardedTurn);
  }

  // Two turns and not one: a loop that throws on its first turn has already drawn one correct still
  // frame, and nothing outside the page can tell that from a working one. The page reports on itself.
  //
  // A HIDDEN TAB IS NOT A DEAD LOOP. The browser holds animation frames for a tab nobody can see, and
  // the first reading of this page came back "0 turns, not checked yet" from a tab whose
  // visibilityState was hidden while the loop was healthy. The health record says hidden in that case
  // instead of reporting a stall that is the browser's decision.
  var loopTurns = 0,
    loopThrew = null;
  window.__loopHealth = {
    ok: null,
    turns: 0,
    why: "not checked yet",
    selfCheck: CHECK,
  };
  function loopReport() {
    if (loopThrew) {
      return window.__loopHealth;
    }
    if (loopTurns >= 2) {
      return {
        ok: true,
        turns: loopTurns,
        why: "the loop turned twice",
        selfCheck: CHECK,
      };
    }
    if (document.visibilityState === "hidden") {
      return {
        ok: null,
        turns: loopTurns,
        why: "tab hidden, frames held by the browser",
        selfCheck: CHECK,
      };
    }
    return {
      ok: null,
      turns: loopTurns,
      why: "fewer than two turns while visible",
      selfCheck: CHECK,
    };
  }
  window.__loopReport = loopReport;

  // One frame on demand, at a chosen instant and transition, for reading the surface from outside the
  // page without waiting on the browser's frame clock.
  window.__frameAt = function (clock, mode) {
    state.playing = false;
    document.getElementById("play").textContent = "sweep";
    state.clock = Math.max(0, Math.min(ROUNDS - 1, clock));
    if (mode) {
      state.mode = mode;
      document.getElementById("mode").value = mode;
    }
    clockInput.value = String(Math.round(state.clock * 100));
    document.getElementById("clockOut").textContent = (state.clock + 1).toFixed(
      2,
    );
    redraw();
    drawReadout();
    drawChart();
    camera.position.copy(offset);
    camera.up.copy(upVector);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    return {
      round: state.clock + 1,
      mode: state.mode,
      bendAngle: DATA.same[shown.index],
      keptBend: shown.keptBend,
      keptFade: shown.keptFade,
    };
  };
  function guardedTurn(now) {
    if (loopThrew) {
      return;
    }
    try {
      turn(now);
    } catch (thrown) {
      loopThrew = String(thrown);
      window.__loopHealth = {
        ok: false,
        turns: loopTurns,
        why: "threw: " + loopThrew,
        selfCheck: CHECK,
      };
      if (window.console) {
        console.error("FRAME LOOP", thrown);
      }
      return;
    }
    loopTurns += 1;
    if (loopTurns >= 2 && window.__loopHealth.ok !== true) {
      window.__loopHealth = {
        ok: true,
        turns: loopTurns,
        why: "the loop turned twice",
        selfCheck: CHECK,
      };
    }
  }
  requestAnimationFrame(guardedTurn);
</script>
