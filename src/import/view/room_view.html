<title>Inside The Shell</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    --ink: #e8ebf0;
    --dim: #99a1ae;
    --faint: #5f6773;
    --ground: #06070a;
    --panel: #12141a;
    --edge: #262b34;
    --hot: #ff8a45;
  }
  :root[data-theme="light"] {
    --ink: #14161b;
    --dim: #5b626e;
    --faint: #949cab;
    --ground: #e9ebef;
    --panel: #f7f8fa;
    --edge: #ccd1d9;
    --hot: #cf5418;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font:
      12px/1.5 "Segoe UI",
      system-ui,
      -apple-system,
      sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
  }
  .box {
    position: fixed;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 9px 11px 10px;
    opacity: 0.9;
    box-shadow: 0 2px 18px rgba(0, 0, 0, 0.5);
    user-select: none;
  }
  .box h4 {
    margin: 0 0 7px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--dim);
    cursor: move;
  }
  .box h5 {
    margin: 9px 0 3px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 4px 0;
  }
  .row label {
    flex: 0 0 78px;
    color: var(--dim);
    font-size: 11px;
  }
  .row input[type="range"] {
    flex: 1;
    min-width: 84px;
    height: 3px;
    accent-color: var(--hot);
  }
  .row .val {
    flex: 0 0 60px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  select {
    background: var(--ground);
    color: var(--ink);
    border: 1px solid var(--edge);
    border-radius: 3px;
    padding: 2px 5px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  /* Fixed columns. Left to itself the table gives the widest cell what it asks for, so one long
   value such as "operation 301 of 512" takes the width and the labels beside it break mid-phrase,
   with "stopping the" on one line and "beam" alone on the next while its number stays up on the
   first. Naming the split holds every label and every value in one column apiece. */
  table {
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    table-layout: fixed;
    width: 100%;
  }
  td {
    padding: 2px 0 2px 8px;
    text-align: right;
    vertical-align: baseline;
    overflow-wrap: break-word;
  }
  td:first-child {
    text-align: left;
    color: var(--dim);
    padding-left: 0;
    width: 44%;
  }
  .legend {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .key {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--dim);
  }
  .swatch {
    flex: 0 0 11px;
    width: 11px;
    height: 11px;
    border-radius: 2px;
    border: 1px solid rgba(255, 255, 255, 0.16);
  }
  .key span {
    flex: 1;
  }
  .check {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 4px 0;
    font-size: 11px;
    color: var(--dim);
    cursor: pointer;
  }
  .check input {
    accent-color: var(--hot);
    cursor: pointer;
  }
  #rights {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--edge);
    font-size: 9.5px;
    letter-spacing: 0.02em;
    color: var(--faint);
    text-align: left;
  }
  #ask {
    position: fixed;
    top: 12px;
    right: 14px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--edge);
    background: var(--panel);
    color: var(--dim);
    font-size: 12px;
    line-height: 18px;
    text-align: center;
    cursor: help;
    opacity: 0.55;
    z-index: 40;
  }
  #ask:hover {
    opacity: 1;
  }
  #tile {
    position: fixed;
    top: 38px;
    right: 14px;
    width: 344px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 5px;
    padding: 12px 14px;
    z-index: 39;
    font-size: 11.5px;
    line-height: 1.62;
    color: var(--dim);
  }
  #tile b {
    color: var(--ink);
  }
  #tile p {
    margin: 0 0 8px;
  }
  #tile p:last-child {
    margin: 0;
  }
  #where {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 16px;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.05em;
    pointer-events: none;
  }
  #rate {
    position: fixed;
    left: 14px;
    bottom: 14px;
    font-size: 10.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    pointer-events: none;
    z-index: 22;
  }
  /* The label rides its target. Pinned to a screen corner it says the right words about the wrong
   place the moment the view turns, and the leader that has to reach it rakes across the object the
   reader is trying to look at. Held near the thing instead, the leader is short and local. */
  .tag {
    position: fixed;
    pointer-events: none;
    white-space: nowrap;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 3px;
    background: rgba(10, 12, 16, 0.72);
    border: 1px solid currentColor;
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
    z-index: 21;
    left: 0;
    top: 0;
    will-change: transform;
  }
  .tag[hidden] {
    display: none;
  }
  #leads {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
  }
  #leads line {
    stroke-width: 1;
    opacity: 0.7;
  }
  #leads circle {
    fill: none;
    stroke-width: 1;
    opacity: 0.85;
  }
</style>

<div id="stage"></div>
<div id="ask">?</div>
<div id="tile" hidden></div>
<div id="where"></div>
<div id="rate"></div>
<svg id="leads" width="100%" height="100%"></svg>
<div id="tags"></div>

<div class="box" id="panel" style="left: 14px; top: 14px; width: 248px">
  <h4>The room</h4>
  <div class="row">
    <label>wall</label>
    <select id="shell">
      <option value="sphere">sphere</option>
      <option value="cube">cube</option>
      <option value="hexagon">hexagonal drum</option>
      <option value="octahedron">octahedron</option>
      <option value="dodecahedron">twelve faces</option>
    </select>
  </div>
  <div class="row">
    <label>shell shape</label>
    <select id="core">
      <option value="sphere">sphere</option>
      <option value="cube">cube</option>
      <option value="octahedron">octahedron</option>
      <option value="cone">cone</option>
    </select>
  </div>
  <div class="row">
    <label>you are</label>
    <input type="range" id="dist" min="0" max="100" value="61" />
    <span class="val" id="distOut">&ndash;</span>
  </div>
  <div class="row">
    <label>dwell</label>
    <input type="range" id="dwell" min="0" max="100" value="0" />
    <span class="val" id="dwellOut">early</span>
  </div>
  <label class="check"
    ><input type="checkbox" id="cast" checked /> internals cast shadows</label
  >
  <label class="check"
    ><input type="checkbox" id="smear" checked /> boundaries keep the
    trace</label
  >
  <div class="row">
    <label>beam energy</label>
    <input type="range" id="energy" min="0" max="100" value="34" />
    <span class="val" id="energyOut">0.34</span>
  </div>
  <div class="row">
    <label>disc</label>
    <input type="range" id="flat" min="6" max="100" value="100" />
    <span class="val" id="flatOut">1.00</span>
  </div>
  <div class="row" id="motionRow">
    <label>motion</label>
    <input type="range" id="motion" min="0" max="100" value="40" />
    <span class="val" id="motionOut">running</span>
  </div>
  <div id="clockBlock" style="display: none">
    <h5>The operation clock</h5>
    <div class="row">
      <label>clock</label>
      <input type="range" id="clock" min="0" max="511" value="511" />
      <span class="val" id="clockOut">&ndash;</span>
    </div>
    <div class="row">
      <label>rate</label>
      <input type="range" id="tickRate" min="0" max="100" value="0" />
      <span class="val" id="tickRateOut">held</span>
    </div>
    <div class="row">
      <label>doing</label>
      <span class="val" id="clockOp" style="flex: 1; text-align: left"
        >&ndash;</span
      >
    </div>
    <div class="row">
      <label>depth</label>
      <input type="range" id="hold" min="4" max="29" value="22" />
      <span class="val" id="holdOut">0.22</span>
    </div>
    <div class="row">
      <label>degree L</label>
      <input type="range" id="degrees" min="0" max="10" value="10" />
      <span class="val" id="degreesOut">10</span>
    </div>
    <div class="row">
      <label>surface</label>
      <input type="range" id="skin" min="0" max="100" value="42" />
      <span class="val" id="skinOut">0.42</span>
    </div>
  </div>

  <h5>Boundaries</h5>
  <div id="veils"></div>

  <h5>The sources</h5>
  <div class="row">
    <label>carrying</label>
    <select id="pick"></select>
  </div>
  <div class="row">
    <label>beam around</label>
    <input type="range" id="beamA" min="0" max="360" value="40" />
    <span class="val" id="beamAOut">40&deg;</span>
  </div>
  <div class="row">
    <label>beam up</label>
    <input type="range" id="beamB" min="-88" max="88" value="26" />
    <span class="val" id="beamBOut">26&deg;</span>
  </div>
  <div class="row">
    <label>beam out</label>
    <input type="range" id="beamR" min="4" max="95" value="16" />
    <span class="val" id="beamROut">0.16</span>
  </div>

  <div id="rights">
    &copy; 2026 Douglas Quigg (dstroy0) &middot; AGPL-3.0-or-later
  </div>
</div>

<div class="box" id="counts" style="right: 14px; top: 70px; width: 246px">
  <h4>What stops the beam</h4>
  <table id="countTable"></table>
</div>

<div class="box" id="keys" style="right: 14px; width: 246px; display: none">
  <h4>What the colours mean</h4>
  <div class="legend" id="keyList"></div>
</div>

      smearAt[at] = landed.x * SMEAR_OUT;
      smearAt[at + 1] = landed.y * SMEAR_OUT;
      smearAt[at + 2] = landed.z * SMEAR_OUT;
    }
    trailHead = (trailHead + 1) % TRAIL;

    // Age is counted back from the newest slot, so the brightest end is always where the light is now.
    var life = state.dwell * TRAIL;
    for (var k2 = 0; k2 < COUNT; k2++) {
      for (var j = 0; j < TRAIL; j++) {
        var age = (trailHead - 1 - j + TRAIL * 2) % TRAIL;
        var lit = life < 0.02 ? (age === 0 ? 1 : 0) : Math.exp(-age / life);
        var to = (k2 * TRAIL + j) * 3;
        trailTint[to] = tint[k2 * 3] * lit * 0.7;
        trailTint[to + 1] = tint[k2 * 3 + 1] * lit * 0.7;
        trailTint[to + 2] = tint[k2 * 3 + 2] * lit * 0.7;
        trailSize[k2 * TRAIL + j] = spread[k2] * (0.35 + 0.4 * lit);

        // What lands on the shell is brighter and broader than what made it, since the boundary is
        // being read rather than the thing itself, and a smear is what a spot becomes once it has had
        // time to move.
        smearTint[to] = tint[k2 * 3] * lit * 0.95;
        smearTint[to + 1] = tint[k2 * 3 + 1] * lit * 0.95;
        smearTint[to + 2] = tint[k2 * 3 + 2] * lit * 0.95;
        smearSize[k2 * TRAIL + j] = spread[k2] * (0.5 + 0.6 * lit);
      }
    }
    trailGeometry.attributes.position.needsUpdate = true;
    trailGeometry.attributes.tint.needsUpdate = true;
    trailGeometry.attributes.wide.needsUpdate = true;
    smearGeometry.attributes.position.needsUpdate = true;
    smearGeometry.attributes.tint.needsUpdate = true;
    smearGeometry.attributes.wide.needsUpdate = true;
  }

  // ---------------------------------------------------------------------------------------------
  // The medium. There is matter between the lights, and matter in the way is the reason a beam is
  // visible along its length instead of only where it lands. Each mote is lit by how close it sits to
  // the nearest source, so moving a source lights a different part of the room and the scattering is
  // drawn from the same places the shadows are.
  // ---------------------------------------------------------------------------------------------

  var MOTES = 2200;
  var duskAt = new Float32Array(MOTES * 3);
  var duskLit = new Float32Array(MOTES * 3);
  var duskSeed = 1;

  function nextDusk() {
    duskSeed = (duskSeed * 1103515245 + 12345) & 0x7fffffff;
    return duskSeed / 2147483648;
  }

  for (var m = 0; m < MOTES; m++) {
    var mh = 2 * nextDusk() - 1;
    var ma = 2 * Math.PI * nextDusk();
    var mf = Math.sqrt(Math.max(0, 1 - mh * mh));
    var mr = ROOM * Math.pow(nextDusk(), 0.42);
    duskAt[m * 3] = mf * Math.cos(ma) * mr;
    duskAt[m * 3 + 1] = mh * mr;
    duskAt[m * 3 + 2] = mf * Math.sin(ma) * mr;
  }

  var duskGeometry = new THREE.BufferGeometry();
  duskGeometry.setAttribute("position", new THREE.BufferAttribute(duskAt, 3));
  duskGeometry.setAttribute("color", new THREE.BufferAttribute(duskLit, 3));
  var dusk = new THREE.Points(
    duskGeometry,
    new THREE.PointsMaterial({
      size: DUST_SIZE,
      map: HALO,
      vertexColors: true,
      transparent: true,
      opacity: 0.5,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    }),
  );
  scene.add(dusk);

  // Scaled to the room, and to how close a source is now carried. These were fixed numbers chosen
  // against a wall thirty units out, and then left alone when one source sat well outside everything
  // it lit. A source brought in among the bodies sits where the medium is densest, so the old
  // fall-off saturated every mote near it, the cap did the rest, and the room came up as a flat wash
  // with the black floor lifted clear off the bottom. The softening is the room's area rather than
  // its radius, which is what keeps the near field finite when the source is inside the cloud.
  var DUST_GAIN = ROOM * ROOM * 0.006;
  var DUST_SOFT = ROOM * ROOM * 0.05;
  var DUST_MOST = 0.14;

  function lightTheDusk() {
    for (var k = 0; k < MOTES; k++) {
      var best = 0;
      for (var s = 0; s < sources.length; s++) {
        var seat = sources[s].light.position;
        var dx = duskAt[k * 3] - seat.x;
        var dy = duskAt[k * 3 + 1] - seat.y;
        var dz = duskAt[k * 3 + 2] - seat.z;
        var far = dx * dx + dy * dy + dz * dz;
        var lit = DUST_GAIN / (far + DUST_SOFT);
        if (lit > best) {
          best = lit;
        }
      }
      if (best > DUST_MOST) {
        best = DUST_MOST;
      }
      duskLit[k * 3] = best;
      duskLit[k * 3 + 1] = best * 0.86;
      duskLit[k * 3 + 2] = best * 0.66;
    }
    duskGeometry.attributes.color.needsUpdate = true;
  }

  // ---------------------------------------------------------------------------------------------
  // The sources. Carried, not fixed, and the only things in here that make a shadow.
  //
  // More than one, because one source cannot give depth. A single shadow says a body is somewhere
  // along a line. Two sources apart from each other throw two shadows of the same body, and how far
  // those two separate on the wall is the body's distance from the wall: that is a measurement and
  // not an impression, and it is the reason the second source is worth what it costs.
  //
  // What it costs is the whole performance question. A cube shadow map is six scene renders for one
  // source. The map is small and the redraw is held until something moves, and between those two the
  // second source is affordable.
  // ---------------------------------------------------------------------------------------------

  // One emission, however many sources carry it. The dwell gate already holds the early and late
  // halves to a single total so that opening it late cannot invent photons; a second source is the
  // same question asked the other way, and handing each new source a full budget of its own would
  // invent them just as surely. So the budget is shared, and adding a source divides the light
  // rather than adding light.
  var BEAM_BUDGET = 3.6;

  // How far a source throws. The falloff here is the renderer's non-physical one, which is close to
  // linear in the distance and still strong at the far end of it, a reach set to the whole room
  // lit the wall almost evenly and lifted the room off black. Two sources doing that at once is what
  // turned the picture into a flat wash. Set to the region a source is meant to light, the near field
  // keeps the strength the magnified shadows need and the wall goes back to being dark.
  var BEAM_REACH = ROOM * 1.6;
  var SHADOW_MAP = 512;

  // How close a source may be carried. A point source magnifies a body onto the wall by the distance
  // to the wall over the distance to the body, a source outside everything it lights magnifies by
  // about one and the shadows come out life-size and read as smudges. Brought inside the shells the
  // ratio climbs and the shadow sweeps hugely for a small movement, which is what makes depth from
  // parallax legible in the first place.
  //
  // The floor is set by the shadow camera's near plane and not by taste. A body nearer to the source
  // than that plane is clipped out of the map and stops casting at all, so the slider stops where
  // every body is still in front of it with room to spare, rather than running on to a setting where
  // shadows drop out one at a time and the picture looks broken.
  var SHADOW_NEAR = 0.35;

  var sources = [];

  function makeSource(hue, ang, alt, out, label) {
    var light = new THREE.PointLight(hue, 0, BEAM_REACH, 1.0);
    light.castShadow = true;
    light.shadow.mapSize.width = SHADOW_MAP;
    light.shadow.mapSize.height = SHADOW_MAP;
    light.shadow.camera.near = SHADOW_NEAR;
    light.shadow.camera.far = ROOM * 2.2;
    light.shadow.bias = -0.0022;
    scene.add(light);

    var lamp = new THREE.Mesh(
      new THREE.SphereGeometry(LAMP_SIZE, 14, 10),
      new THREE.MeshBasicMaterial({ color: hue }),
    );
    scene.add(lamp);

    // The late half of the dwell split. It fills rather than prints, so it casts nothing.
    var fill = new THREE.PointLight(0xcfe0ff, 0.0, BEAM_REACH * 1.15, 0.55);
    fill.castShadow = false;
    scene.add(fill);

    var made = {
      light: light,
      lamp: lamp,
      fill: fill,
      hue: hue,
      label: label,
      ang: ang,
      alt: alt,
      out: out,
      at: new THREE.Vector3(),
    };
    sources.push(made);
    return made;
  }

  // How many sources the room carries, and the reader's to choose. One cannot give depth: a single
  // shadow says a body is somewhere along a line and it takes a second one to say where on that line.
  // Past two, each source is another parallax on the same bodies, and since they share one light
  // budget the cost of asking for more is visible in the picture rather than hidden from it.
  var SOURCES = Math.max(1, Math.min(12, DATA.sources || 2));

  for (var q = 0; q < SOURCES; q++) {
    // Spread rather than placed by hand, asking for one more moves them all apart instead of
    // dropping a new one onto an old one. The altitude steps by the golden angle because an even
    // division of the circle would otherwise put every source on the same latitude, where they give
    // parallax in one direction and none at all in the other.
    var around = Math.round((360 * q) / SOURCES + 40) % 360;
    var above = Math.round(34 * Math.sin(q * 2.399963 + 0.6));
    var tone = new THREE.Color().setHSL(
      (0.09 + (0.62 * q) / SOURCES) % 1,
      0.35,
      0.87,
    );
    makeSource(
      tone.getHex(),
      around,
      above,
      0.16 + 0.03 * (q % 3),
      q === 0 ? "neutrino source" : "source " + (q + 1),
    );
  }

  // Barely any fill. A room with ambient light in it has no shadows worth the name, and the whole
  // reading here is what fails to arrive somewhere.
  var ambient = new THREE.AmbientLight(0x04050a, 1.0);
  scene.add(ambient);

  // The dwell split, applied to every source from the one budget. Early light still knows what it
  // passed and prints an edge; late light arrives from everywhere and fills the shadow instead.
  // Letting both rise together, or letting each source start a budget of its own, would be inventing
  // photons that were never emitted.
  function shareTheBeam() {
    var each = BEAM_BUDGET / Math.max(1, sources.length);
    for (var s = 0; s < sources.length; s++) {
      sources[s].light.intensity = each * (1 - 0.75 * state.dwell);
      sources[s].fill.intensity = each * 0.55 * state.dwell;
    }
    ambient.intensity = 1.0 + 2.2 * state.dwell;
    shadowStale = true;
  }

  // ---------------------------------------------------------------------------------------------
  // Standing somewhere. The reader is always inside something: the distance runs from within the
  // innermost boundary out to well past the wall, and crossing a shell is a thing that happens on the
  // way rather than a mode that gets switched.
  // ---------------------------------------------------------------------------------------------

  var target = new THREE.Vector3(0, 0, 0);
  var lookFrom = new THREE.Vector3(0, 2, 18).setLength(OPENING);
  var upVec = new THREE.Vector3(0, 1, 0);
  var side = new THREE.Vector3();

  function screenRight() {
    side.crossVectors(upVec, lookFrom);
    if (side.lengthSq() < 1e-9) {
      side.set(1, 0, 0);
    }
    return side.normalize();
  }

  // The drift rate is zeroed the moment the payload carries a trace. A bit goes where the operation
  // puts it and nowhere on its own, a population drift here would be the page inventing motion the
  // computation did not perform, and the ring would smear away over the first few seconds.
  var state = {
    energy: 0.34,
    rate: DATA.clock ? 0.0 : 0.4,
    flat: 1.0,
    dwell: 0.0,
    core: DATA.core || "sphere",
    pick: 0,
    tick: 0,
    tickRate: 0,
    degrees: 0,
    hold: DATA.clock ? DATA.clock.hold : 0.62,
  };

  // Raised whenever the picture the shadow map holds has gone stale, and lowered once it has been
  // redrawn. Movement of the bodies, movement of a source and a change of which bodies cast at all
  // are the three things that make it stale; nothing else does.
  var shadowStale = true;

  function placeSource(one) {
    var a = (one.ang * Math.PI) / 180;
    var b = (one.alt * Math.PI) / 180;
    var r = one.out * ROOM;
    one.at.set(
      r * Math.cos(b) * Math.cos(a),
      r * Math.sin(b),
      r * Math.cos(b) * Math.sin(a),
    );
    one.light.position.copy(one.at);
    one.lamp.position.copy(one.at);
    one.fill.position.copy(one.at);
    shadowStale = true;
  }

  function placeAll() {
    for (var s = 0; s < sources.length; s++) {
      placeSource(sources[s]);
    }
    lightTheDusk();
  }

  // Which mesh a light belongs to, decided once per change of energy instead of once per frame. The
  // lists hold indices, a light moving between them costs nothing but a place in an array.
  var stopList = new Int32Array(COUNT);
  var passList = new Int32Array(COUNT);
  var stopCount = 0,
    passCount = 0;

  function applyEnergy() {
    stopCount = 0;
    passCount = 0;
    for (var k = 0; k < COUNT; k++) {
      if (stops[k] > state.energy) {
        stopList[stopCount++] = k;
      } else {
        passList[passCount++] = k;
      }
    }
    stoppers.count = stopCount;
    passers.count = passCount;

    // A light the beam goes through is still there and still lit. Dimming it says which ones the beam
    // is stopped by; hiding it would say the beam decides what exists.
    var shade = new THREE.Color();
    var k2;
    for (k2 = 0; k2 < stopCount; k2++) {
      var s = stopList[k2];
      shade.setRGB(tint[s * 3], tint[s * 3 + 1], tint[s * 3 + 2]);
      stoppers.setColorAt(k2, shade);
    }
    for (k2 = 0; k2 < passCount; k2++) {
      var p = passList[k2];
      shade.setRGB(
        tint[p * 3] * 0.45,
        tint[p * 3 + 1] * 0.45,
        tint[p * 3 + 2] * 0.45,
      );
      passers.setColorAt(k2, shade);
    }
    if (stoppers.instanceColor) {
      stoppers.instanceColor.needsUpdate = true;
    }
    if (passers.instanceColor) {
      passers.instanceColor.needsUpdate = true;
    }
    shadowStale = true;
    return stopCount;
  }

  // The magnification a source is working at: the distance it throws onto the wall over the distance
  // to what it is throwing. Reported rather than asserted, because it is the number that decides
  // whether a shadow is a reading or a smudge.
  function magnification(one) {
    var out = one.at.length();
    var toBody = Math.max(0.5, SHELL - out);
    if (out > SHELL) {
      toBody = Math.max(0.5, out - SHELL);
    }
    return (ROOM + out) / toBody;
  }

  // Every source's magnification and not the first two, because the count is the reader's to set and
  // a row that names two of nine is a row that stops being true the moment they ask for more.
  function magnified() {
    var each = [];
    for (var m = 0; m < sources.length; m++) {
      each.push(magnification(sources[m]).toFixed(1));
    }
    return each.join(", ") + "x";
  }

  // How many bits are set at this operation. Counted off the trace rather than off the stopping
  // powers, so the row goes on saying what the state is even when the beam energy has been raised
  // past the point where a set bit still casts anything.
  // The state at an operation. Held as the states the run passes through plus a tick to state map,
  // because six operations in every eight leave the eight words alone and shipping the repeats would
  // be shipping the same string four times over.
  function frameAt(whole) {
    return CLOCK.states[CLOCK.index[whole]];
  }

  function setNow(whole) {
    var frame = frameAt(whole);
    var lit = 0;
    for (var b2 = 0; b2 < frame.length; b2++) {
      if (frame.charCodeAt(b2) === 49) {
        lit++;
      }
    }
    return lit;
  }

  function drawCounts(stopping) {
    var here = lookFrom.length();
    var inside = here < bandOuter(0);
    var held = shells.length;
    var within = held;
    for (var s = 0; s < held; s++) {
      if (here < shells[s].reach) {
        within = s;
        break;
      }
    }

    var rows = [
      ["lights inside", COUNT],
      ["stopping", stopping],
      ["passing", COUNT - stopping],
      ["", ""],
      ["boundaries", held + " nested"],
      ["wall at", ROOM.toFixed(0)],
      [
        "you are",
        within < held
          ? "inside boundary " + (within + 1)
          : here > ROOM
            ? "outside the room"
            : "in the room",
      ],
      ["standing at", here.toFixed(1)],
      ["", ""],
      ["sources", sources.length],
      ["magnifying", magnified()],
      ["", ""],
      ["source", DATA.source],
    ];

    if (CLOCK) {
      var now = Math.max(0, Math.min(CLOCK.ticks - 1, Math.floor(state.tick)));
      rows.splice(
        3,
        0,
        ["", ""],
        ["operation", now + 1 + " of " + CLOCK.ticks],
        ["round", roundAt(now) + " of " + CLOCK.rounds],
        ["bits set", setNow(now) + " of " + COUNT],
      );
      if (surface) {
        rows.splice(
          7,
          0,
          ["degree", state.degrees + " of " + CLOCK.degrees],
          ["modes", (state.degrees + 1) * (state.degrees + 1)],
          ["swing", surfaceSpan.toExponential(2)],
        );
      }
    }
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      if (rows[i][0] === "") {
        html += "<tr><td colspan=2 style='height:5px'></td></tr>";
        continue;
      }
      html += "<tr><td>" + rows[i][0] + "</td><td>" + rows[i][1] + "</td></tr>";
    }
    document.getElementById("countTable").innerHTML = html;

    document.getElementById("where").textContent =
      here > ROOM
        ? "outside the room, reading its surface"
        : inside
          ? "inside the innermost boundary, among them"
          : "in the room, boundaries ahead of you";
  }

  // ---------------------------------------------------------------------------------------------
  // The operation clock.
  //
  // Present only when the payload carries a trace, which is what a page built from a running
  // computation ships and a page built from a draw does not. Everything below is inert without one,
  // so the drawn room is unchanged by its existence.
  //
  // The room's other pages hold a population that moves on its own and is read while it moves. A
  // computation does not move on its own: it advances because an operation was performed, and the
  // honest clock for it is the operation count and not the wall clock. So the reader gets the
  // operation index directly, to drag or to let run at a rate they choose, and nothing here advances
  // unless one of those two says it does.
  //
  // Time is the radius. The state sits small near the middle at the first operation and reaches the
  // shell at the last one traced, so the run is laid out along the one axis the reader can walk. A
  // reader standing still has the computation arrive at them and pass, and where they stand decides
  // which part of the run they are inside of.
  //
  // The band follows the radius rather than being fixed when the page opens. The state deposits on
  // whichever boundary it is inside of at the time, so the record on the surfaces climbs from the
  // inner shell to the outer one as the computation runs, and each surface ends up holding the part
  // of the run that happened while the state was within it.
  // ---------------------------------------------------------------------------------------------

  var CLOCK = DATA.clock || null;

  var wordOf = new Int32Array(COUNT);
  var homeTurn = new Float32Array(COUNT);
  var homeDown = new Float32Array(COUNT);

  // One helix and not eight rings.
  //
  // Giving each word its own latitude put all thirty-two of its bits at one height, so the state came
  // out as eight flat discs stacked up the axis. Horizontal slices are an artefact of that placement:
  // the eight words are not eight planes, they are eight turns of one register, and drawing them as
  // separated sheets invents a structure the state does not have.
  //
  // So colatitude advances across the whole index while longitude wraps every thirty-two, which winds
  // a single continuous curve eight times around the sphere. Each word is still one turn of it, a
  // rotation still spins its own bits and nothing about the spin changes. The acos spaces the turns
  // by equal area, which keeps the winding even instead of crowding the poles.
  if (CLOCK) {
    for (var c0 = 0; c0 < COUNT; c0++) {
      wordOf[c0] = Math.floor(c0 / CLOCK.width);
      homeDown[c0] = Math.acos(1 - (2 * (c0 + 0.5)) / COUNT);
      homeTurn[c0] = (2 * Math.PI * (c0 % CLOCK.width)) / CLOCK.width;
    }
  }

  function opAt(tick) {
    return tick % CLOCK.ops;
  }
  function roundAt(tick) {
    return Math.floor(tick / CLOCK.ops) + 1;
  }

  // The ring turn during a rotating operation. Sigma1 reads e as rotations by 6, 11 and 25 and
  // exclusive-ors them, so the ring turns through each amount in order and then comes home: the
  // exclusive-or of three rotations is not itself a rotation and there is no offset for the ring to
  // stay at. What the operation actually leaves behind is a change of value, and that arrives at the
  // write operations further down the round, where the bits change rather than move.
  function spinTurn(which, whole, phase) {
    var step = CLOCK.steps[opAt(whole)];
    if (!step || step.spins !== which || !step.by.length) {
      return 0;
    }
    var legs = step.by.length + 1;
    var leg = Math.min(legs - 1, Math.floor(phase * legs));
    var into = phase * legs - leg;
    var from = leg === 0 ? 0 : step.by[leg - 1];
    var to = leg >= step.by.length ? 0 : step.by[leg];
    return ((from + (to - from) * into) * 2 * Math.PI) / CLOCK.width;
  }

  // ---------------------------------------------------------------------------------------------
  // The boundary reconstruction.
  //
  // What an observer outside the shell has is not the bits. It is a field on a closed surface, and
  // the honest way to hold that field is the basis the surface actually has: the real spherical
  // harmonics. So the state is expanded on the sphere, carried outward through the kernel, and
  // evaluated again on a grid to recover a radius for every direction. The result is a closed genus
  // zero surface, which is the same kind of object the state was, arrived at without ever having
  // seen it.
  //
  // The kernel is what makes this a reading rather than a redrawing. Depth enters as (r/R)^l and
  // conduction as exp(-l(l+1)tau), both diagonal in degree, so everything between a source and the
  // boundary is one number per degree. A high degree is fine structure, and (r/R)^l takes it away
  // fastest: the deeper the state sits, the fewer degrees survive the trip out. That is the whole
  // claim of the boundary work, and here it is a thing the reader can move.
  //
  // The coefficients arrive depth-free because every bit sits at the same radius at a given
  // operation, which is what putting time on the radius bought. The page multiplies in the kernel at
  // whatever radius the clock has reached, so moving the clock or the degree ceiling re-reads the
  // same expansion rather than needing a new one.
  //
  // Degree is a ceiling and not a filter. Cutting it does not smooth the surface after the fact, it
  // declines to sum the terms above it, which is what a boundary that cannot hold them actually does.
  // ---------------------------------------------------------------------------------------------

  var SURFACE_LAT = 36; // rings of the reconstruction grid, pole to pole
  var SURFACE_LON = 72; // samples around each of them
  var SURFACE_SWING = 0.16; // how far the field is allowed to move the surface, as a fraction

  var surface = null;
  var surfaceBasis = null;
  var surfaceAt = null;
  var surfaceUnit = null;

  // The normalised associated Legendre values for one order, every degree up to the ceiling. Climbs
  // the diagonal and then recurs in degree, which holds every intermediate at unit scale. Built from
  // factorials instead, this overflows above degree 150 and loses digits long before that, and the
  // failure is quiet: the low degrees stay right and only the fine structure goes wrong.
  function legendreColumn(top, order, x) {
    var out = new Float64Array(top + 1);
    var sine = Math.sqrt(Math.max(0, 1 - x * x));
    var value = Math.sqrt(1 / (4 * Math.PI));
    for (var s = 1; s <= order; s++) {
      value *= Math.sqrt((2 * s + 1) / (2 * s)) * sine;
    }
    if (order <= top) {
      out[order] = value;
    }
    if (order + 1 <= top) {
      out[order + 1] = Math.sqrt(2 * order + 3) * x * value;
    }
    for (var d = order + 2; d <= top; d++) {
      var lead = Math.sqrt((4 * d * d - 1) / (d * d - order * order));
      var trail = Math.sqrt(
        ((d - 1) * (d - 1) - order * order) / (4 * (d - 1) * (d - 1) - 1),
      );
      out[d] = lead * (x * out[d - 1] - trail * out[d - 2]);
    }
    return out;
  }

  // Every harmonic up to the ceiling at one direction, flattened the way the coefficients are: degree
  // l occupies the run starting at l squared, ordered from -l to +l.
  function harmonicsAt(top, down, around, into) {
    var x = Math.cos(down);
    var rootTwo = Math.SQRT2;
    for (var order = 0; order <= top; order++) {
      var column = legendreColumn(top, order, x);
      if (order === 0) {
        for (var d0 = 0; d0 <= top; d0++) {
          into[d0 * d0 + d0] = column[d0];
        }
        continue;
      }
      var cosine = Math.cos(order * around) * rootTwo;
      var sine = Math.sin(order * around) * rootTwo;
      for (var d = order; d <= top; d++) {
        into[d * d + d + order] = column[d] * cosine;
        into[d * d + d - order] = column[d] * sine;
      }
    }
  }

  function buildSurface() {
    var top = CLOCK.degrees;
    var width = (top + 1) * (top + 1);
    var rings = SURFACE_LAT + 1;
    var cols = SURFACE_LON + 1;
    var points = rings * cols;

    // The basis on the grid, evaluated once. It depends on the direction and the ceiling and never on
    // the state, so recomputing it per operation would be paying for the same numbers 512 times.
    surfaceBasis = new Float32Array(points * width);
    surfaceUnit = new Float32Array(points * 3);
    var one = new Float64Array(width);

    for (var r = 0; r < rings; r++) {
      var down = (Math.PI * r) / SURFACE_LAT;
      for (var c = 0; c < cols; c++) {
        var around = (2 * Math.PI * c) / SURFACE_LON;
        var at = r * cols + c;
        for (var z = 0; z < width; z++) {
          one[z] = 0;
        }
        harmonicsAt(top, down, around, one);
        for (var w = 0; w < width; w++) {
          surfaceBasis[at * width + w] = one[w];
        }

        var across = Math.sin(down);
        surfaceUnit[at * 3] = across * Math.cos(around);
        surfaceUnit[at * 3 + 1] = Math.cos(down);
        surfaceUnit[at * 3 + 2] = across * Math.sin(around);
      }
    }

    surfaceAt = new Float32Array(points * 3);
    var geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(surfaceAt, 3));

    var faces = [];
    for (var r2 = 0; r2 < SURFACE_LAT; r2++) {
      for (var c2 = 0; c2 < SURFACE_LON; c2++) {
        var a = r2 * cols + c2,
          b = a + 1,
          d2 = a + cols,
          e2 = d2 + 1;
        faces.push(a, d2, b, b, d2, e2);
      }
    }
    geometry.setIndex(faces);

    // Lit and not additive. The reconstruction is a shape and a shape needs shading to be read as
    // one: an additive skin brightens where it folds toward the eye and says nothing about which way
    // it is facing, which is the one thing a topology is asked for here.
    surface = new THREE.Mesh(
      geometry,
      new THREE.MeshStandardMaterial({
        color: 0x7fd0ff,
        roughness: 0.55,
        metalness: 0.0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.42,
        flatShading: false,
      }),
    );
    surface.castShadow = false;
    surface.receiveShadow = false;
    scene.add(surface);
  }

  // The kernel and the sum, at whatever radius the clock has reached and whatever ceiling is set.
  function paintSurface(whole, reach) {
    if (!surface) {
      return;
    }
    var top = CLOCK.degrees;
    var width = (top + 1) * (top + 1);
    var ceiling = Math.max(0, Math.min(top, state.degrees));
    var carried = (ceiling + 1) * (ceiling + 1);
    var coefficients = CLOCK.harmonics[CLOCK.index[whole]];

    // Depth as (r/R)^l and conduction as exp(-l(l+1)tau), one number per degree, carrying everything
    // between the state and the surface it is being read on.
    //
    // R is the boundary doing the reading, so the ratio is the state's radius over that boundary's.
    // Measuring it against the outermost depth the room allows instead made the state look four times
    // further from its surface than it is, and (r/R)^l with r/R at 0.27 leaves degree one standing
    // and nothing above it. A lone degree one term is a dipole, and a dipole drawn as a radius is an
    // egg: the surface was reporting the offset of the state and no part of its shape.
    var ratio = (reach * SHELL) / bandOuter(bandFor(reach));
    var gain = new Float64Array(carried);
    var climb = 1.0;
    for (var l = 0; l <= ceiling; l++) {
      var smoothing = Math.exp(-l * (l + 1) * CLOCK.tau);
      for (var m = 0; m < 2 * l + 1; m++) {
        gain[l * l + m] = climb * smoothing;
      }
      climb *= ratio;
    }

    var points = surfaceAt.length / 3;
    var low = Infinity,
      high = -Infinity;
    var field = new Float64Array(points);
    for (var p = 0; p < points; p++) {
      var base = p * width;
      var sum = 0;
      for (var w = 0; w < carried; w++) {
        sum += coefficients[w] * gain[w] * surfaceBasis[base + w];
      }
      field[p] = sum;
      if (sum < low) {
        low = sum;
      }
      if (sum > high) {
        high = sum;
      }
    }

    // Scaled to its own range and not to a fixed one. The kernel drops the whole field by orders of
    // magnitude as the state goes deep, a fixed scale would draw a sphere at every operation and
    // report that the shape had gone away when the amplitude went away. The shape is being read here;
    // the amplitude is reported in the panel, where it can be compared across depths.
    var span = high - low;

    // The envelope lives between the state and the boundary it is read on, and the range is built
    // from those two radii instead of from a swing about a centre. A swing can always be handed a
    // radius that carries it through the surface above it; a range cannot, because both ends of it
    // are the walls. So the innermost fold clears the outermost bit and the outermost fold stops
    // short of the boundary, at every depth the reader can set, by construction.
    var nearest = reach * SHELL + rad[0] * 1.6;
    var furthest = bandOuter(bandFor(reach)) * 0.97;
    if (furthest < nearest) {
      furthest = nearest;
    }

    for (var q = 0; q < points; q++) {
      var along = span < 1e-12 ? 0.5 : (field[q] - low) / span;
      var scale = nearest + along * (furthest - nearest);
      surfaceAt[q * 3] = surfaceUnit[q * 3] * scale;
      surfaceAt[q * 3 + 1] = surfaceUnit[q * 3 + 1] * scale;
      surfaceAt[q * 3 + 2] = surfaceUnit[q * 3 + 2] * scale;
    }
    surface.geometry.attributes.position.needsUpdate = true;
    surface.geometry.computeVertexNormals();
    surface.geometry.computeBoundingSphere();
    surfaceSpan = span;
  }

  var surfaceSpan = 0;

  function bandFor(reach) {
    var part = Math.max(
      0,
      Math.min(0.9999, (reach - CLOCK.inner) / (CLOCK.outer - CLOCK.inner)),
    );
    return Math.floor(part * BANDS);
  }

  var warmth = new THREE.Color();

  function applyTick() {
    if (!CLOCK) {
      return;
    }
    var whole = Math.max(0, Math.min(CLOCK.ticks - 1, Math.floor(state.tick)));
    var phase = Math.max(0, Math.min(1, state.tick - whole));
    var frame = frameAt(whole);

    // The state does not change size. Eight words of thirty-two bits at the first operation and eight
    // words of thirty-two bits at the last: the compression function never adds a bit or takes one
    // away. An earlier version put the clock on the radius, so the globe inflated as the run advanced
    // and said the state was growing. It does not grow. What advances is the values, and the thing
    // carrying them is one fixed size from the first operation to the last.
    //
    // Depth is still a setting, because depth is what the boundary reading is against: the same fixed
    // state read from further in reaches the surface with fewer degrees. That is a knob the reader
    // turns, and never a thing the clock moves.
    var deep = state.hold;
    var reach = deep * SHELL;
    var which = bandFor(deep);

    for (var k = 0; k < COUNT; k++) {
      // 49 is the character one. Read off the frame directly rather than parsed into an array per
      // tick, because the trace is the largest thing on the page and a copy of it per operation is
      // the one allocation here that would be felt.
      var set = frame.charCodeAt(k) === 49;
      stops[k] = set ? 0.92 : 0.14;

      var turn = homeTurn[k] + spinTurn(wordOf[k], whole, phase);
      var across = Math.sin(homeDown[k]) * reach;
      atX[k] = across * Math.cos(turn);
      atY[k] = Math.cos(homeDown[k]) * reach;
      atZ[k] = across * Math.sin(turn);
      band[k] = which;

      // A set bit is lit and a clear bit is not gone. Drawing only the ones would make the ring a
      // gap-toothed arc and say the zeroes are absent, when a zero is a bit that is there and is
      // zero. So the clear ones stay, cold and small, and the ring stays a ring.
      var glow = 0.35 + 0.65 * (things[k].glow || 0);
      warmth.setHSL(
        set ? 0.09 : 0.56,
        set ? 0.85 : 0.5,
        set ? 0.34 + 0.34 * glow : 0.14 + 0.1 * glow,
      );
      tint[k * 3] = warmth.r;
      tint[k * 3 + 1] = warmth.g;
      tint[k * 3 + 2] = warmth.b;
    }

    paintSurface(whole, deep);
    applyEnergy();
  }

  function showClock() {
    if (!CLOCK) {
      return;
    }
    var whole = Math.max(0, Math.min(CLOCK.ticks - 1, Math.floor(state.tick)));
    var step = CLOCK.steps[opAt(whole)];
    document.getElementById("clockOut").textContent =
      "round " + roundAt(whole) + ", op " + (opAt(whole) + 1);
    document.getElementById("clockOp").textContent = step ? step.label : "–";
  }

  // ---------------------------------------------------------------------------------------------
  // Wiring.
  // ---------------------------------------------------------------------------------------------

  function bind(id, outId, apply, format) {
    var input = document.getElementById(id);
    var out = document.getElementById(outId);
    function run() {
      var shown = apply(Number(input.value));
      if (out) {
        out.textContent = format ? format(shown) : shown;
      }
    }
    input.addEventListener("input", run);
    run();
  }

  // The fastest the clock will run, in operations a second. Chosen so the slowest setting above zero
  // is slow enough to follow a single operation and the fastest still takes long enough to watch the
  // whole compression rather than flash it.
  var CLOCK_TOP = 24;

  // Set up before the sliders below are bound, because binding one runs it immediately and it would
  // otherwise read an opening value this block is about to change.
  if (CLOCK) {
    document.getElementById("clockBlock").style.display = "";
    var clockInput = document.getElementById("clock");
    clockInput.max = String(CLOCK.ticks - 1);
    clockInput.value = "0";
    state.tick = 0;
    state.degrees = CLOCK.degrees;

    var degreeInput = document.getElementById("degrees");
    degreeInput.max = String(CLOCK.degrees);
    degreeInput.value = String(CLOCK.degrees);
    if (CLOCK.harmonics) {
      buildSurface();
    }

    // A control that is present and inert is worse than one that is absent, so motion goes rather
    // than sitting there doing nothing against a trace that supplies its own.
    document.getElementById("motionRow").style.display = "none";
    document.getElementById("motion").value = "0";
  }

  // Shadow casting, off as well as on. A shadow is the reading here, so being able to drop it is what
  // separates the picture from the claim: with the casters switched off the wall goes dark except for
  // what the sources light directly, and every mark that was doing work disappears with them.
  function tie(id, apply) {
    var box = document.getElementById(id);
    box.addEventListener("change", function () {
      apply(box.checked);
    });
    apply(box.checked);
  }

  tie("cast", function (on) {
    stoppers.castShadow = on;
    for (var s = 0; s < sources.length; s++) {
      sources[s].light.castShadow = on;
    }
    shadowStale = true;
  });

  tie("smear", function (on) {
    smears.visible = on;
    trails.visible = on;
  });

  // The colours, named. A body is orange when its bit is set and blue-grey when it is clear, and
  // without the key those read as two populations rather than two values of one. Built from the same
  // numbers the bodies are tinted with, so the swatch cannot drift away from what it stands for.
  function paintKeys() {
    if (!CLOCK) {
      return;
    }
    var hot = new THREE.Color(),
      cold = new THREE.Color();
    hot.setHSL(0.09, 0.85, 0.51);
    cold.setHSL(0.56, 0.5, 0.19);

    var keys = [
      [hot.getStyle(), "bit set, and stopping the beam"],
      [cold.getStyle(), "bit clear, and passing it"],
      ["#7fd0ff", "the boundary reconstruction"],
      ["#c8a06a", "the trace left on a boundary"],
      ["#fff0dd", "a neutrino source"],
    ];

    var html = "";
    for (var k = 0; k < keys.length; k++) {
      html +=
        "<div class='key'><i class='swatch' style='background:" +
        keys[k][0] +
        "'></i><span>" +
        keys[k][1] +
        "</span></div>";
    }
    document.getElementById("keyList").innerHTML = html;

    var box = document.getElementById("keys");
    box.style.display = "";
    var counts = document.getElementById("counts");
    box.style.top = counts.offsetTop + counts.offsetHeight + 12 + "px";
  }

  bind(
    "dist",
    "distOut",
    function (raw) {
      lookFrom.setLength(standAt(raw / 100));
      return lookFrom.length();
    },
    function (v) {
      return v.toFixed(1);
    },
  );

  bind(
    "energy",
    "energyOut",
    function (raw) {
      state.energy = raw / 100;
      drawCounts(applyEnergy());
      return state.energy;
    },
    function (v) {
      return v.toFixed(2);
    },
  );

  bind(
    "dwell",
    "dwellOut",
    function (raw) {
      state.dwell = raw / 100;
      shareTheBeam();
      return state.dwell;
    },
    function (v) {
      return v < 0.02 ? "early" : v > 0.7 ? "late" : v.toFixed(2);
    },
  );

  bind(
    "flat",
    "flatOut",
    function (raw) {
      // Squashing the boundary squashes what it holds, and nothing is added or removed on the way. The
      // shell meshes are scaled by the same number the wall test uses, so what is drawn and what turns
      // the lights around are one surface and cannot drift apart.
      state.flat = raw / 100;
      for (var s = 0; s < shells.length; s++) {
        shells[s].mesh.scale.set(1, state.flat, 1);
      }
      shadowStale = true;
      return state.flat;
    },
    function (v) {
      return v.toFixed(2);
    },
  );

  bind(
    "motion",
    "motionOut",
    function (raw) {
      state.rate = raw / 100;
      return state.rate;
    },
    function (v) {
      return v < 0.005 ? "still" : "running";
    },
  );

  // Dragged or run, and the same variable either way, a reader who scrubs to an operation and then
  // lets it go carries on from where they stopped rather than from where the run had got to.
  bind("clock", null, function (raw) {
    if (!CLOCK) {
      return raw;
    }
    state.tick = raw;
    applyTick();
    showClock();
    return raw;
  });

  bind(
    "tickRate",
    "tickRateOut",
    function (raw) {
      state.tickRate = (raw / 100) * CLOCK_TOP;
      return state.tickRate;
    },
    function (v) {
      return v < 0.05 ? "held" : v.toFixed(1) + " ops/s";
    },
  );

  // How far in the state sits. A setting and not a clock: the state is one size for the whole run, so
  // nothing about the run may move this. Reading the same fixed state from deeper reaches the surface
  // with fewer degrees, because depth enters the kernel as (r/R)^l and takes the fine structure first.
  bind(
    "hold",
    "holdOut",
    function (raw) {
      if (!CLOCK) {
        return raw / 100;
      }
      state.hold = raw / 100;
      applyTick();
      return state.hold;
    },
    function (v) {
      return v.toFixed(2);
    },
  );

  // The ceiling on the expansion, and the one control here that is an argument rather than a
  // convenience. Dropping it does not blur the surface after the fact, it declines to sum the terms
  // above it, which is what a boundary too coarse to hold them does on its own.
  bind("degrees", "degreesOut", function (raw) {
    if (!CLOCK) {
      return raw;
    }
    state.degrees = raw;
    applyTick();
    return raw;
  });

  bind(
    "skin",
    "skinOut",
    function (raw) {
      if (surface) {
        surface.material.opacity = raw / 100;
        surface.visible = raw > 0.5;
      }
      return raw / 100;
    },
    function (v) {
      return v < 0.005 ? "off" : v.toFixed(2);
    },
  );

  // One row of opacity per boundary, built from the shells rather than written out, so the panel
  // cannot fall out of step with how many there are.
  //
  // The faint setting is lower than one shell wanted because there are now several. A translucent
  // boundary is drawn on both faces and adds light twice, so three of them at the old faint value
  // stacked six additive layers and lifted the whole room off black before anything was lit.
  var VEIL_FAINT = 3;
  var veilBox = document.getElementById("veils");
  for (var v = 0; v < shells.length; v++) {
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      "<label>boundary " +
      (v + 1) +
      "</label>" +
      '<input type="range" id="veil' +
      v +
      '" min="0" max="100" value="' +
      VEIL_FAINT +
      '">' +
      '<span class="val" id="veil' +
      v +
      'Out">' +
      (VEIL_FAINT / 100).toFixed(2) +
      "</span>";
    veilBox.appendChild(row);
  }

  // Translucent looks through to the bulk; opaque reads the surface. Crossing between them swaps the
  // material, because one blend cannot do both: additive brightens and never occludes, and a lit
  // surface that writes depth cannot also be a faint window. Nothing about the interior is skipped
  // while a boundary is closed. The bodies keep stepping, keep being confined and keep depositing,
  // and what they deposited is on the outside of the surface now being read, which is the claim.
  var SOLID_FROM = 0.34;

  function dressShell(one, amount) {
    one.opacity = amount;
    if (amount < SOLID_FROM) {
      one.glass.opacity = amount;
      if (one.mesh.material !== one.glass) {
        one.mesh.material = one.glass;
      }
    } else {
      // Held just short of one so the surface never becomes a flat cut-out. A boundary is still a
      // boundary when the faintest trace of what is behind it survives, and the topology reads
      // better against that than against a solid plate.
      one.solid.opacity =
        0.72 + 0.28 * Math.min(1, (amount - SOLID_FROM) / (1 - SOLID_FROM));
      if (one.mesh.material !== one.solid) {
        one.mesh.material = one.solid;
      }
    }
  }

  for (var v2 = 0; v2 < shells.length; v2++) {
    (function (which) {
      bind(
        "veil" + which,
        "veil" + which + "Out",
        function (raw) {
          dressShell(shells[which], raw / 100);
          return raw / 100;
        },
        function (n) {
          return n.toFixed(2);
        },
      );
    })(v2);
  }

  // One set of beam controls and a choice of which source they are carrying, rather than three rows
  // per source. The reader carries one at a time, which is what carrying means.
  var pickBox = document.getElementById("pick");
  for (var p2 = 0; p2 < sources.length; p2++) {
    var choice = document.createElement("option");
    choice.value = String(p2);
    choice.textContent = sources[p2].label;
    pickBox.appendChild(choice);
  }

  function loadSourceControls() {
    var one = sources[state.pick];
    document.getElementById("beamA").value = String(one.ang);
    document.getElementById("beamB").value = String(one.alt);
    document.getElementById("beamR").value = String(Math.round(one.out * 100));
    document.getElementById("beamAOut").textContent = one.ang + "°";
    document.getElementById("beamBOut").textContent = one.alt + "°";
    document.getElementById("beamROut").textContent = one.out.toFixed(2);
  }

  pickBox.addEventListener("change", function (event) {
    state.pick = Number(event.target.value);
    loadSourceControls();
  });

  bind(
    "beamA",
    "beamAOut",
    function (raw) {
      sources[state.pick].ang = raw;
      placeAll();
      return raw;
    },
    function (n) {
      return n + "°";
    },
  );

  bind(
    "beamB",
    "beamBOut",
    function (raw) {
      sources[state.pick].alt = raw;
      placeAll();
      return raw;
    },
    function (n) {
      return n + "°";
    },
  );

  bind(
    "beamR",
    "beamROut",
    function (raw) {
      sources[state.pick].out = raw / 100;
      placeAll();
      return raw / 100;
    },
    function (n) {
      return n.toFixed(2);
    },
  );

  document.getElementById("shell").addEventListener("change", function (event) {
    setShell(event.target.value);
  });

  document.getElementById("core").value = DATA.core || "sphere";
  document.getElementById("core").addEventListener("change", function (event) {
    // The shape the lights are held by, swapped under them while they are moving. Nothing about the
    // cloud is rebuilt: the same population carries on against a different wall, which is the only
    // way to see that the wall being a different shape changes nothing about what is held.
    state.core = event.target.value;
    setCore(state.core);
    shadowStale = true;
  });

  function movable(box) {
    var handle = box.querySelector("h4");
    var holding = false,
      fromX = 0,
      fromY = 0,
      wasX = 0,
      wasY = 0;
    handle.addEventListener("mousedown", function (event) {
      holding = true;
      fromX = event.clientX;
      fromY = event.clientY;
      var spot = box.getBoundingClientRect();
      wasX = spot.left;
      wasY = spot.top;
      box.style.right = "auto";
      box.style.bottom = "auto";
      event.preventDefault();
    });
    window.addEventListener("mousemove", function (event) {
      if (!holding) {
        return;
      }
      box.style.left = wasX + event.clientX - fromX + "px";
      box.style.top = wasY + event.clientY - fromY + "px";
    });
    window.addEventListener("mouseup", function () {
      holding = false;
    });
  }
  var allBoxes = document.querySelectorAll(".box");
  for (var q = 0; q < allBoxes.length; q++) {
    movable(allBoxes[q]);
  }

  var dragging = false,
    lastX = 0,
    lastY = 0;
  renderer.domElement.addEventListener("mousedown", function (event) {
    dragging = true;
    lastX = event.clientX;
    lastY = event.clientY;
  });
  window.addEventListener("mouseup", function () {
    dragging = false;
  });
  window.addEventListener("mousemove", function (event) {
    if (!dragging) {
      return;
    }
    var dx = event.clientX - lastX,
      dy = event.clientY - lastY;
    lastX = event.clientX;
    lastY = event.clientY;
    var right = screenRight().clone();
    lookFrom.applyAxisAngle(upVec, -dx * 0.005);
    lookFrom.applyAxisAngle(right, -dy * 0.005);
    upVec.applyAxisAngle(right, -dy * 0.005).normalize();
  });
  renderer.domElement.addEventListener(
    "wheel",
    function (event) {
      event.preventDefault();
      var slider = document.getElementById("dist");
      var moved = Number(slider.value) + (event.deltaY > 0 ? 2.2 : -2.2);
      slider.value = String(Math.max(0, Math.min(100, moved)));
      slider.dispatchEvent(new Event("input"));
    },
    { passive: false },
  );

  var ask = document.getElementById("ask");
  var tile = document.getElementById("tile");
  tile.innerHTML =
    "<p>You are standing inside a dark room. Inside it are " +
    shells.length +
    " closed boundaries, " +
    "one within the next, holding " +
    things.length +
    " small lights that cannot leave them.</p>" +
    "<p><b>Each boundary is a window to you and a wall to them.</b> You see through it; they turn " +
    "around at it. Nothing about a boundary requires it to stop light in order to stop matter, and " +
    "that is the whole arrangement: what leaves is the light, what stays is what emitted it.</p>" +
    "<p><b>Close one and nothing inside stops.</b> Drive a boundary opaque and you are reading its " +
    "surface instead of looking through it. The contents are still moving, still confined, still " +
    "depositing, and their traces are the smears on the surface you are now reading. Nothing was " +
    "lost by closing it, which is the point: the surface carries what the bulk was doing.</p>" +
    "<p><b>The beams are carried, and there are two.</b> One shadow puts a body somewhere along a " +
    "line. Two shadows of the same body separate by an amount that gives its depth, and bringing a " +
    "source in close magnifies both, since a point source throws a body onto the wall by the ratio " +
    "of the two distances. Carry a source inside the shells and small movements sweep the shadows " +
    "across the whole room.</p>" +
    "<p><b>Energy decides what stops it.</b> Each light has a stopping power. Raise the energy and " +
    "shadows switch off one at a time, weakest first, because a probe that mostly passes through is " +
    "a cross-section falling with energy and not a wall turning into a window.</p>" +
    "<p>Zoom all the way in and you pass through every boundary in turn. Zoom out and each one is an " +
    "object ahead of you. There is no view from nowhere: you are always inside something, and the " +
    "outside of one of these is the inside of the next.</p>";
  ask.addEventListener("mouseenter", function () {
    tile.hidden = false;
  });
  tile.addEventListener("mouseleave", function () {
    tile.hidden = true;
  });
  ask.addEventListener("mouseleave", function () {
    setTimeout(function () {
      if (!tile.matches(":hover")) {
        tile.hidden = true;
      }
    }, 220);
  });

  function fit() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", fit);
  fit();

  var opening = DATA.settings || {};
  if (opening.theme) {
    document.documentElement.setAttribute("data-theme", opening.theme);
  }

  // ---------------------------------------------------------------------------------------------
  // The wall the lights are held by, whatever shape it has been given.
  //
  // Each shape supplies one number that is under one inside and over one outside, and the outward
  // direction where it is over. That is all confinement needs, and writing it that way is the claim
  // being made: a curved wall, a flat-faced one and one with a point on it are the same wall as far
  // as anything inside is concerned. Every one of them is closed, which is the part that matters.
  //
  // The normal is the shape's own and never the direction back to the middle. Those agree on a
  // sphere and on nothing else, and a light bouncing off a cube by its radial direction slides along
  // the faces toward the corners and piles up there. It looks like physics and it is a wrong normal.
  // ---------------------------------------------------------------------------------------------

  var pos = new THREE.Vector3();
  var norm = new THREE.Vector3();
  var mat = new THREE.Matrix4();

  function measure(kind, x, y, z, a, b, out) {
    var rho, allowed, ax, ay, az, q;
    if (kind === "cube") {
      ax = Math.abs(x) / a;
      ay = Math.abs(y) / b;
      az = Math.abs(z) / a;
      q = Math.max(ax, ay, az);
      if (ax >= ay && ax >= az) {
        out.set(x < 0 ? -1 : 1, 0, 0);
      } else if (ay >= az) {
        out.set(0, y < 0 ? -1 : 1, 0);
      } else {
        out.set(0, 0, z < 0 ? -1 : 1);
      }
      return q;
    }
    if (kind === "octahedron") {
      q = Math.abs(x) / a + Math.abs(y) / b + Math.abs(z) / a;
      out
        .set((x < 0 ? -1 : 1) / a, (y < 0 ? -1 : 1) / b, (z < 0 ? -1 : 1) / a)
        .normalize();
      return q;
    }
    if (kind === "cone") {
      // Apex up, base down. The room allowed at a height closes to nothing at the point, a light
      // heading for the tip runs out of room rather than reaching it.
      rho = Math.sqrt(x * x + z * z);
      allowed = Math.max(1e-4, (a * (b - y)) / (2 * b));
      var qSide = rho / allowed;
      var qFloor = -y / b;
      if (qSide >= qFloor) {
        if (rho < 1e-6) {
          out.set(0, 1, 0);
        } else {
          out.set(x / rho, a / (2 * b), z / rho).normalize();
        }
        return qSide;
      }
      out.set(0, -1, 0);
      return qFloor;
    }
    ax = x / a;
    ay = y / b;
    az = z / a;
    q = Math.sqrt(ax * ax + ay * ay + az * az);
    out.set(x / (a * a), y / (b * b), z / (a * a)).normalize();
    return q;
  }

  // A body turned back at a surface, whichever side of it the body is on. Outward is the direction
  // the measure grows in, so the boundary below a band is the same test with the sign flipped: a body
  // in the second band is held off the first from the outside exactly as it is held inside the
  // second, and one routine does both.
  function turnBack(k, kind, a, b, fromInside) {
    var reach = measure(kind, atX[k], atY[k], atZ[k], a, b, norm);
    var over = fromInside ? reach > 1 : reach < 1;
    if (!over) {
      return;
    }

    var along = vX[k] * norm.x + vY[k] * norm.y + vZ[k] * norm.z;
    var facing = fromInside ? along > 0 : along < 0;
    if (facing) {
      // The speed it arrived with is the speed it leaves with. A light that lost a little here
      // would drain the cloud inward over a few minutes, slowly enough to read as the scene
      // settling rather than as a leak.
      vX[k] -= 2 * along * norm.x;
      vY[k] -= 2 * along * norm.y;
      vZ[k] -= 2 * along * norm.z;
    }

    // Put it back on the wall. Every one of these shapes is star-shaped about the middle, so pulling
    // straight in or pushing straight out reaches the surface, and for the three whose measure scales
    // with the position it lands on it exactly. The cone is checked again because its measure does not.
    if (reach > 1e-6) {
      var back = 1 / reach;
      atX[k] *= back;
      atY[k] *= back;
      atZ[k] *= back;
    }
    if (
      kind === "cone" &&
      measure(kind, atX[k], atY[k], atZ[k], a, b, norm) > 1
    ) {
      atY[k] = Math.max(-b, Math.min(b * 0.98, atY[k]));
      var space = Math.max(1e-4, (a * (b - atY[k])) / (2 * b));
      var here = Math.sqrt(atX[k] * atX[k] + atZ[k] * atZ[k]);
      if (here > space) {
        atX[k] *= space / here;
        atZ[k] *= space / here;
      }
    }
  }

  function step(gap) {
    var kind = state.core;
    var squash = state.flat;
    var move = gap * state.rate * 6.0 * SHELL * 0.1;
    var running = state.rate > 0.005;

    var wroteStop = 0,
      wrotePass = 0;
    for (var k = 0; k < COUNT; k++) {
      var mine = bandOuter(band[k]);
      var a = Math.max(1e-3, mine - rad[k]);
      var b = Math.max(1e-3, mine * squash - rad[k]);

      if (running) {
        atX[k] += vX[k] * move;
        atY[k] += vY[k] * move;
        atZ[k] += vZ[k] * move;

        turnBack(k, kind, a, b, true);
        if (band[k] > 0) {
          var under = bandOuter(band[k] - 1);
          turnBack(k, kind, under + rad[k], under * squash + rad[k], false);
        }
      }

      pos.set(atX[k], atY[k], atZ[k]);
      mat.makeScale(rad[k], rad[k], rad[k]);
      mat.setPosition(pos);
      if (stops[k] > state.energy) {
        stoppers.setMatrixAt(wroteStop++, mat);
      } else {
        passers.setMatrixAt(wrotePass++, mat);
      }

      // A halo belongs to the interior as much as the light does. At full size it reaches past the
      // boundary and draws light outside a surface nothing inside is able to cross, and that is the
      // one claim this room is making. Capped by the room left, measured the same way the wall is.
      var slack = Math.max(
        0,
        1 - measure(kind, atX[k], atY[k], atZ[k], mine, mine * squash, norm),
      );
      haloAt[k * 3] = atX[k];
      haloAt[k * 3 + 1] = atY[k];
      haloAt[k * 3 + 2] = atZ[k];
      haloSize[k] = Math.min(spread[k], slack * mine * 1.4);
      var fade = Math.min(1, slack * 5.0);
      haloTint[k * 3] = tint[k * 3] * fade;
      haloTint[k * 3 + 1] = tint[k * 3 + 1] * fade;
      haloTint[k * 3 + 2] = tint[k * 3 + 2] * fade;
    }

    stoppers.instanceMatrix.needsUpdate = true;
    passers.instanceMatrix.needsUpdate = true;
    haloGeometry.attributes.position.needsUpdate = true;
    haloGeometry.attributes.tint.needsUpdate = true;
    haloGeometry.attributes.wide.needsUpdate = true;
    if (running) {
      shadowStale = true;
    }
  }

  // ---------------------------------------------------------------------------------------------
  // Callouts.
  //
  // A label rides the thing it names. Pinned to a screen corner it goes on saying the right words
  // about the wrong place the moment the view turns, and the leader that has to reach it from there
  // rakes diagonally across the object the reader is trying to look at. Held near its target the
  // leader is short, local, and touches the box rather than crossing it.
  //
  // The offset is carried in the object's own apparent scale and not in pixels. Pull back and the
  // object shrinks toward the middle of the frame, a label at a fixed pixel offset drifts out to
  // the edges and leaves the thing it names behind; scaled, it closes in as the object does. Dragging
  // sets that offset rather than a position, a label the reader moved goes on tracking.
  // ---------------------------------------------------------------------------------------------

  var flatPoint = new THREE.Vector3();
  var callouts = [];

  function edgeOf(rect, fromX, fromY) {
    var midX = rect.left + rect.width / 2;
    var midY = rect.top + rect.height / 2;
    var runX = fromX - midX,
      runY = fromY - midY;
    if (runX === 0 && runY === 0) {
      return [midX, midY];
    }
    // How far along the segment the box wall sits, taken as the smaller of the two axis crossings.
    var stepX = runX === 0 ? Infinity : rect.width / 2 / Math.abs(runX);
    var stepY = runY === 0 ? Infinity : rect.height / 2 / Math.abs(runY);
    var reach = Math.min(stepX, stepY, 1);
    return [midX + runX * reach, midY + runY * reach];
  }

  // How large the arrangement is on screen right now, against how large it is at the opening
  // distance. One number, so every label closes in together and the group keeps its shape.
  function apparentPull() {
    var here = Math.max(NEAREST * 0.5, lookFrom.length());
    return Math.max(0.2, Math.min(1.75, OPENING / here));
  }

  var tagHome = document.getElementById("tags");
  var leadHome = document.getElementById("leads");

  function makeCallout(name, hue, offX, offY, aim) {
    var tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = name;
    tag.style.color = hue;
    tagHome.appendChild(tag);

    var lead = document.createElementNS("http://www.w3.org/2000/svg", "line");
    lead.setAttribute("stroke", hue);
    leadHome.appendChild(lead);

    var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("r", "7");
    dot.setAttribute("fill", "none");
    dot.setAttribute("stroke", hue);
    leadHome.appendChild(dot);

    var made = {
      tag: tag,
      lead: lead,
      dot: dot,
      offX: offX,
      offY: offY,
      aim: aim,
      at: new THREE.Vector3(),
    };
    callouts.push(made);
    draggableTag(made);
    return made;
  }

  // Kept off the two panels. A label that lands under one is unreadable and a leader that runs
  // beneath one points at nothing, so the label is pushed to whichever side has room for it.
  var keepOff = [];

  function clearOfPanels(left, top, wide, high) {
    for (var r = 0; r < keepOff.length; r++) {
      var box = keepOff[r];
      if (
        left + wide < box.left ||
        left > box.right ||
        top + high < box.top ||
        top > box.bottom
      ) {
        continue;
      }
      var goLeft = box.left - wide - 8;
      var goRight = box.right + 8;
      left = left + wide / 2 < (box.left + box.right) / 2 ? goLeft : goRight;
      if (left < 4) {
        left = goRight;
      }
      if (left + wide > window.innerWidth - 4) {
        left = goLeft;
      }
    }
    return left;
  }

  function callout(one) {
    var tag = one.tag,
      lead = one.lead,
      dot = one.dot;

    one.aim(one.at);
    flatPoint.copy(one.at).project(camera);
    var behind = flatPoint.z > 1 || flatPoint.z < -1;
    if (behind) {
      tag.hidden = true;
      lead.setAttribute("stroke-opacity", "0");
      dot.setAttribute("stroke-opacity", "0");
      return;
    }
    tag.hidden = false;
    lead.setAttribute("stroke-opacity", "0.7");
    dot.setAttribute("stroke-opacity", "0.85");

    var toX = (flatPoint.x * 0.5 + 0.5) * window.innerWidth;
    var toY = (-flatPoint.y * 0.5 + 0.5) * window.innerHeight;

    var pull = apparentPull();
    var wide = tag.offsetWidth,
      high = tag.offsetHeight;
    var left = toX + one.offX * pull - wide / 2;
    var top = toY + one.offY * pull - high / 2;

    left = Math.max(4, Math.min(window.innerWidth - wide - 4, left));
    top = Math.max(4, Math.min(window.innerHeight - high - 4, top));
    left = clearOfPanels(left, top, wide, high);
    left = Math.max(4, Math.min(window.innerWidth - wide - 4, left));

    tag.style.transform = "translate(" + left + "px," + top + "px)";

    var hook = edgeOf(
      { left: left, top: top, width: wide, height: high },
      toX,
      toY,
    );
    lead.setAttribute("x1", hook[0]);
    lead.setAttribute("y1", hook[1]);
    lead.setAttribute("x2", toX);
    lead.setAttribute("y2", toY);
    dot.setAttribute("cx", toX);
    dot.setAttribute("cy", toY);
  }

  // A drag sets the offset the label keeps from its target, in the same apparent scale the offset is
  // read back in, a label the reader put somewhere stays there relative to the thing rather than
  // relative to the window.
  function draggableTag(one) {
    var tag = one.tag;
    tag.style.pointerEvents = "auto";
    tag.style.cursor = "move";
    var holding = false,
      fromX = 0,
      fromY = 0,
      wasX = 0,
      wasY = 0;
    tag.addEventListener("mousedown", function (event) {
      holding = true;
      fromX = event.clientX;
      fromY = event.clientY;
      wasX = one.offX;
      wasY = one.offY;
      event.preventDefault();
      event.stopPropagation();
    });
    window.addEventListener("mousemove", function (event) {
      if (!holding) {
        return;
      }
      var pull = apparentPull();
      one.offX = wasX + (event.clientX - fromX) / pull;
      one.offY = wasY + (event.clientY - fromY) / pull;
    });
    window.addEventListener("mouseup", function () {
      holding = false;
    });
  }

  var hueOf = ["#ffcf95", "#9fd4ff"];

  for (var c = 0; c < sources.length; c++) {
    (function (which) {
      makeCallout(
        sources[which].label,
        hueOf[which % hueOf.length],
        which === 0 ? 74 : -74,
        which === 0 ? -52 : 46,
        function (out) {
          out.copy(sources[which].at);
        },
      );
    })(c);
  }

  for (var c2 = 0; c2 < shells.length; c2++) {
    (function (which) {
      makeCallout(
        "boundary " + (which + 1),
        "#8fb4d8",
        86,
        34 + which * 8,
        function (out) {
          out.set(0, shells[which].reach * state.flat, 0);
        },
      );
    })(c2);
  }

  placeAll();
  drawCounts(applyEnergy());
  loadSourceControls();

  // After the counts table has been filled, because the key box is placed under it and an empty
  // table measures as a heading with nothing below.
  paintKeys();

  var clock = new THREE.Clock();
  var sinceTrail = 0;

  // The frame time, measured rather than asserted. A mean over the last sixty frames, because a
  // single frame says more about what the operating system was doing than about the scene.
  var spans = new Float32Array(60);
  var spanAt = 0;
  var spanFull = false;
  var rateBox = document.getElementById("rate");
  var sinceRate = 0;

  function turn() {
    var began = performance.now();
    var gap = Math.min(0.05, clock.getDelta());

    // The operation clock advances before anything is placed, a frame draws the state as of the
    // operation the clock is on and never the one before it. It runs on the measured frame time and
    // not on frames, or the computation would go faster on a faster machine and the rate the reader
    // set would be a property of their hardware.
    if (CLOCK && state.tickRate > 0.005) {
      state.tick += gap * state.tickRate;
      if (state.tick > CLOCK.ticks - 1) {
        state.tick = 0;
      }
      document.getElementById("clock").value = String(Math.floor(state.tick));
      applyTick();
      showClock();
    }

    step(gap);

    // The trace is laid on its own clock and not once a frame. Tied to the frame rate the tail gets
    // shorter on a fast machine and longer on a slow one, which makes the dwell time a property of
    // the hardware rather than of the medium.
    sinceTrail += gap;
    if (sinceTrail > 0.045) {
      sinceTrail = 0;
      layTrail();
    }

    for (var c3 = 0; c3 < callouts.length; c3++) {
      callout(callouts[c3]);
    }

    // Step outside the room and the room's own wall becomes the thing being read. It goes part way to
    // transparent so what is inside registers on it, which is the same reading one shell out: the
    // surface of a thing is where what is inside it is legible from. Standing outside is not a
    // different kind of looking, it is the same looking against a bigger boundary.
    var here = lookFrom.length();
    var beyond = Math.max(0, Math.min(1, (here - ROOM) / (ROOM * 0.5)));
    wallStuff.opacity = 1 - 0.72 * beyond;
    wallStuff.depthWrite = beyond < 0.02;

    camera.position.copy(target).add(lookFrom);
    camera.up.copy(upVec);
    camera.lookAt(target);

    // The one place the shadow is paid for. Held down while nothing moves, which is the difference
    // between twelve scene renders every frame and twelve when the reader does something.
    if (shadowStale) {
      renderer.shadowMap.needsUpdate = true;
      shadowStale = false;
    }
    renderer.render(scene, camera);

    spans[spanAt] = performance.now() - began;
    spanAt = (spanAt + 1) % spans.length;
    if (spanAt === 0) {
      spanFull = true;
    }

    sinceRate += gap;
    if (sinceRate > 0.5) {
      sinceRate = 0;
      var reach = spanFull ? spans.length : Math.max(1, spanAt);
      var total = 0;
      for (var f = 0; f < reach; f++) {
        total += spans[f];
      }
      var mean = total / reach;
      rateBox.textContent =
        mean.toFixed(2) +
        " ms  " +
        (1000 / mean).toFixed(0) +
        " fps  " +
        sources.length +
        " sources  " +
        SHADOW_MAP +
        " shadow";
    }
    requestAnimationFrame(turn);
  }
  turn();

  setInterval(function () {
    keepOff = [];
    var boxes = document.querySelectorAll(".box");
    for (var w = 0; w < boxes.length; w++) {
      keepOff.push(boxes[w].getBoundingClientRect());
    }
    drawCounts(applyEnergy());
  }, 400);
</script>
