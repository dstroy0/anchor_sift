sentence=Fixed widths, a machine word, and the compile-time machinery a C11 embedded library is written in.
paragraph=Header only. The exact-width integer aliases, a boolean, a machine word derived from the target's pointer width, an index type, and an unaligned-access word. A static assertion, feature probes, attribute wrappers, and compile-time assertions that pin a dispatch table's members to consecutive slots. Nothing is allocated, nothing runs at startup, and the only headers reached are stddef and stdint.
