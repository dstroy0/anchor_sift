#
# What orior calls itself, where its trees are, and which gates its commits pass.

[project]
name = "orior"
version = "0.1.0"
spdx = "AGPL-3.0-or-later OR LicenseRef-Commercial OR LicenseRef-Educational"
copyright = "Copyright (C) 2026 Douglas Quigg (dstroy0) <dquigg123@gmail.com>"
prefix = "ORIOR"

[layout]
# This repository keeps its tools under utils/maint/ and not tools/, the only line that
# differs from the template. Every tool asks for the kind and never for the directory.
source = ["src"]
docs = ["docs", "theory"]
examples = ["examples"]
tests = ["utils/test"]
tools = "utils/maint"
scratch = "build"

[code]
# The engine is written six times over, in C, CUDA, Python, R, MATLAB and the headers those need.
# This list selects a parser and never a scope.
extensions = [".c", ".h", ".cu", ".py"]
skip_files = []

[prose]
# theory/ is where the research lives and it is the longest continuous prose here. docs/ is four
# pointer pages. utils/maint/ carries file headers that make the same kind of claim a page does, and
# docs_check reads .tex as well. The research papers are in scope.
roots = ["README.md", "CONTRIBUTING.md", "docs", "theory", "src", "examples", "utils/maint"]
# Empty, and it stays empty: nothing outside this tree is read.
extra_roots = []

[hooks]
# docs_check is the prose gate. A gate named here that cannot be found stops the commit; absent is
# never a pass.
gates = ["docs_check"]

[hooks.docs_check]
# Named, so the gate errors where the checker is not at this path.
tool = "utils/maint/prose/docs_check"
roots = ["README.md", "CONTRIBUTING.md", "docs", "theory", "src", "examples", "utils/maint"]
